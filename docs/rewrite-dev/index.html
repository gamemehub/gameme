<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>RewriteMemory</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a12;color:#e0e0e8;font-family:'Courier New',monospace}
button{cursor:pointer;font-family:inherit}
.screen{position:fixed;inset:0;display:none;flex-direction:column}

/* SE TOGGLE */
.se-toggle{position:fixed;top:10px;right:10px;z-index:100;background:rgba(20,24,40,.7);border:1px solid #2a3050;color:#6a78a0;font-size:10px;letter-spacing:.12em;padding:6px 12px;border-radius:3px}
.se-toggle.off{color:#3a4060;border-color:#1e2035}
.screen.active{display:flex}

/* TITLE */
#S-title{align-items:center;justify-content:center;background:#0a0a12}
.title-logo{font-size:clamp(32px,8vw,56px);font-weight:900;letter-spacing:.15em;color:#c8d0e8;text-align:center;margin-bottom:8px}
.title-sub{font-size:12px;color:#4a5068;letter-spacing:.3em;text-align:center;margin-bottom:48px}
.start-btn{background:transparent;border:1px solid #3a4060;color:#8090b8;padding:14px 40px;font-size:11px;letter-spacing:.25em;border-radius:2px}

/* SCENE / VN */
#S-scene{background:#0a0a12;cursor:pointer}
.scene-bg{position:absolute;inset:0;background:#0a0a12;transition:background 1s}
.scene-sprites{position:absolute;bottom:180px;left:0;right:0;display:flex;justify-content:center;gap:24px;align-items:flex-end}
.sprite-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;transition:opacity .4s}
.sprite-name{font-size:9px;color:#4a5068;letter-spacing:.1em}
.sprite-img{image-rendering:pixelated;image-rendering:crisp-edges;filter:drop-shadow(0 4px 12px rgba(0,0,0,.7))}
.dialogue-box{position:absolute;bottom:0;left:0;right:0;min-height:180px;max-height:60%;background:rgba(8,8,18,.95);border-top:1px solid #1e2035;padding:0 0 8px;display:flex;flex-direction:column}
.dlg-speaker{display:flex;align-items:center;gap:10px;padding:10px 16px 6px;border-bottom:1px solid #12141e}
.dlg-name{font-size:11px;font-weight:700}
.dlg-role{font-size:8px;color:#2a2e48;margin-left:auto}
.dlg-text{padding:10px 16px 6px;font-size:13px;color:#c8d0e8;line-height:2;max-height:180px;overflow-y:auto;white-space:pre-wrap;flex:1}
.dlg-inner{padding:4px 16px 8px;font-size:10px;color:#4a5878;line-height:1.9;font-style:italic;border-left:2px solid #1e2840;margin:0 16px 6px;background:rgba(10,20,40,.4);display:none;white-space:pre-wrap}
.dlg-next{text-align:center;padding:8px;font-size:9px;color:#1e2840;letter-spacing:.2em;border-top:1px solid #10121e;display:none}

/* MEMORY (書き換え画面) */
#S-memory{background:#06060e;align-items:center;justify-content:center;padding:20px}
.memory-title{font-size:10px;color:#3a4060;letter-spacing:.3em;margin-bottom:20px;text-align:center}
.memory-cards{width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px}
.memory-card{padding:12px 14px;background:#0c0e1a;border:1px solid #1e2035;border-radius:3px;cursor:pointer;transition:border-color .2s}
.memory-card.selected{border-color:#4a60a0;background:#0e1228}
.memory-card-label{font-size:8px;color:#2a3050;letter-spacing:.15em;margin-bottom:4px}
.memory-card-text{font-size:12px;color:#8090b0;line-height:1.7}
.memory-confirm{margin-top:16px;width:100%;max-width:360px;padding:12px;background:transparent;border:1px solid #2a3050;color:#4a5878;font-size:10px;letter-spacing:.2em;border-radius:2px;display:none}

/* PHONE (章末・空白メッセージ) */
#S-phone{background:#05060c;align-items:center;justify-content:center;padding:24px}
.phone-frame{width:100%;max-width:340px;height:70%;max-height:560px;background:#0a0c16;border:1px solid #1e2035;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 8px 40px rgba(0,0,0,.6)}
.phone-header{padding:14px;font-size:11px;letter-spacing:.2em;color:#6a78a0;text-align:center;border-bottom:1px solid #161826;background:#0c0e1a}
.phone-thread{flex:1;padding:16px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
.msg{max-width:82%;display:flex;flex-direction:column;gap:4px;align-self:flex-start;animation:msgIn .35s ease both}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg-from{font-size:9px;color:#4a5068;letter-spacing:.1em;padding-left:4px}
.msg-bubble{padding:10px 12px;font-size:12px;line-height:1.8;border-radius:12px;background:#141828;color:#c8d0e8;word-break:break-word}
.msg.unknown .msg-bubble{background:#0e1020;color:#9aa6c8}
.blank{display:inline-block;background:#e8ecf8;color:transparent;border-radius:2px;box-shadow:0 0 10px rgba(232,236,248,.55);animation:blankPulse 2.8s ease-in-out infinite;vertical-align:middle}
@keyframes blankPulse{0%,100%{opacity:.5}50%{opacity:.95}}
.phone-next{margin-top:18px;font-size:9px;color:#2a3050;letter-spacing:.2em;text-align:center}

/* CHAPTER END / To be continued */
#S-continued{background:#05060c;align-items:center;justify-content:center}
.cont-wrap{text-align:center;animation:msgIn .8s ease both}
.cont-chapter{font-size:9px;color:#3a4060;letter-spacing:.35em;margin-bottom:18px}
.cont-title{font-size:clamp(24px,7vw,40px);font-weight:900;letter-spacing:.12em;color:#c8d0e8;margin-bottom:14px}
.cont-sub{font-size:10px;color:#4a5068;letter-spacing:.25em;margin-bottom:40px}
.cont-btn{background:transparent;border:1px solid #2a3050;color:#6a78a0;padding:12px 32px;font-size:10px;letter-spacing:.2em;border-radius:2px}
</style>
</head>
<body>

<!-- SE 音量トグル（全画面共通） -->
<button class="se-toggle" id="se-toggle" aria-label="効果音 ON/OFF">♪ ON</button>

<!-- TITLE -->
<div class="screen active" id="S-title">
  <div style="text-align:center">
    <div class="title-logo">RewriteMemory</div>
    <div class="title-sub">記憶は、書き換えられる。</div>
    <button class="start-btn" id="start-btn">はじめる</button>
  </div>
  <div style="position:absolute;bottom:16px;width:100%;text-align:center;font-size:8px;color:#1e2030;letter-spacing:.15em">GC2026 — Chapter 01</div>
</div>

<!-- SCENE / VN -->
<div class="screen" id="S-scene">
  <div class="scene-bg" id="scene-bg"></div>
  <div class="scene-sprites" id="scene-sprites"></div>
  <div class="dialogue-box">
    <div class="dlg-speaker" id="dlg-speaker" style="display:none">
      <span class="dlg-name" id="dlg-name"></span>
      <span class="dlg-role" id="dlg-role"></span>
    </div>
    <div class="dlg-text" id="dlg-text"></div>
    <div class="dlg-inner" id="dlg-inner"></div>
    <div class="dlg-next" id="dlg-next">▸ タップして続ける</div>
  </div>
</div>

<!-- MEMORY REWRITE -->
<div class="screen" id="S-memory">
  <div class="memory-title">── 記憶の書き換え ──</div>
  <div class="memory-cards" id="memory-cards"></div>
  <button class="memory-confirm" id="memory-confirm">この記憶を書き換える</button>
</div>

<!-- PHONE / 章末メッセージ -->
<div class="screen" id="S-phone">
  <div class="phone-frame">
    <div class="phone-header" id="phone-header">メッセージ</div>
    <div class="phone-thread" id="phone-thread"></div>
  </div>
  <div class="phone-next" id="phone-next">▸ タップして続ける</div>
</div>

<!-- CHAPTER END / To be continued -->
<div class="screen" id="S-continued">
  <div class="cont-wrap">
    <div class="cont-chapter">CHAPTER 01 — END</div>
    <div class="cont-title">To be continued</div>
    <div class="cont-sub">Chapter 02 ── coming soon</div>
    <button class="cont-btn" id="cont-btn">タイトルへ戻る</button>
  </div>
</div>

<script>
/* ═══ SPRITE SYSTEM ═══════════════════════════════════════ */
var SPRITES = {};
var _SC = {};

function mkSprite(id) {
  var d = SPRITES[id]; if (!d) return null;
  var s = 5, h = d.px.length, w = d.px[0].length;
  var c = document.createElement('canvas');
  c.width = w*s; c.height = h*s;
  var x = c.getContext('2d');
  for (var y=0;y<h;y++) for (var i=0;i<w;i++) {
    var ci = d.px[y][i];
    if (ci > 0 && d.pal[ci]) { x.fillStyle=d.pal[ci]; x.fillRect(i*s,y*s,s,s); }
  }
  return c.toDataURL();
}
function getSprite(id) { if(!_SC[id])_SC[id]=mkSprite(id); return _SC[id]||''; }

/* ═══ SOUND ENGINE (Web Audio API・全SE自作/ゼロ素材) ════════
   仕様: docs/specs/chapter01_se_spec.md
   - 外部音源ファイルは一切使わず、その場で波形を合成する
   - 音量ON/OFFは localStorage('se_enabled') に保存（既定ON）
   - テキストブリップは 80ms 間隔で連続再生制御
*/
var SE = (function(){
  var _ctx     = null;
  var _running = false;   /* resume()完了後にtrue */
  var _enabled = (localStorage.getItem('se_enabled') !== 'off');
  var _last    = 0;
  var INTERVAL = 80;
  var MASTER   = 0.30;

  /* AudioContextを生成/取得。まだrunningでなければnullを返す */
  function _ac() {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    if (!_ctx) {
      try { _ctx = new AC(); } catch(e){ return null; }
    }
    if (_running) return _ctx;
    /* suspended → resume()を呼んで、完了したら_running=trueにする */
    if (_ctx.state === 'suspended') {
      try {
        _ctx.resume().then(function(){ _running = true; });
      } catch(e) {}
      return null; /* まだrunningでないので今回は音を出さない */
    }
    /* すでにrunning（ユーザーがすでに操作済み等） */
    if (_ctx.state === 'running') { _running = true; return _ctx; }
    return null;
  }

  /* iOS / PC: ユーザージェスチャー内でOscillatorを即起動してautoplay制限を解除 */
  function _unlock() {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!_ctx) { try { _ctx = new AC(); } catch(e){ return; } }
    /* resume()を呼んで、完了したらrunning状態になることを保証 */
    if (_ctx.state === 'suspended') {
      try {
        _ctx.resume().then(function(){
          _running = true;
          /* 無音のoscillatorを1ms鳴らして確実にunlock（iOS対応） */
          try {
            var o = _ctx.createOscillator();
            var g = _ctx.createGain();
            g.gain.setValueAtTime(0.0001, _ctx.currentTime);
            o.connect(g); g.connect(_ctx.destination);
            o.start(_ctx.currentTime);
            o.stop(_ctx.currentTime + 0.001);
          } catch(e2) {}
        });
      } catch(e) {}
    } else if (_ctx.state === 'running') {
      _running = true;
    }
  }

  function _tone(freq, type, dur, gain, at, freqTo, reverb) {
    if (!_enabled) return;
    var c = _ac(); if (!c) return; /* runningでない間はスキップ */
    var t0 = c.currentTime + (at||0) + 0.005;
    var pk = (gain==null?0.18:gain) * MASTER;
    try {
      var osc = c.createOscillator(), gn = c.createGain();
      osc.type = type||'sine';
      osc.frequency.setValueAtTime(freq, t0);
      if (freqTo) osc.frequency.linearRampToValueAtTime(freqTo, t0+(dur||0.08));
      gn.gain.setValueAtTime(0.0001, t0);
      gn.gain.exponentialRampToValueAtTime(Math.max(0.0002,pk), t0+0.015);
      gn.gain.exponentialRampToValueAtTime(0.0001, t0+(dur||0.08));
      osc.connect(gn); gn.connect(c.destination);
      if (reverb) {
        var dl=c.createDelay(); dl.delayTime.value=0.06;
        var fb=c.createGain(); fb.gain.value=0.25;
        var wt=c.createGain(); wt.gain.value=0.35*MASTER;
        gn.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wt); wt.connect(c.destination);
      }
      osc.start(t0); osc.stop(t0+(dur||0.08)+(reverb?0.4:0.02));
    } catch(e) {}
  }

  function _noise(dur, gain, lp) {
    if (!_enabled) return;
    var c = _ac(); if (!c) return;
    var t0 = c.currentTime;
    try {
      var len = Math.floor(c.sampleRate*(dur||0.3));
      var buf = c.createBuffer(1,len,c.sampleRate);
      var arr = buf.getChannelData(0);
      for(var i=0;i<len;i++) arr[i]=(Math.random()*2-1)*(1-i/len);
      var src=c.createBufferSource(); src.buffer=buf;
      var gn=c.createGain(); gn.gain.value=(gain==null?0.09:gain)*MASTER;
      var node=src;
      if(lp){var f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=lp;src.connect(f);node=f;}
      node.connect(gn); gn.connect(c.destination); src.start(t0);
    } catch(e) {}
  }

  var SE = {
    unlock:    _unlock,
    resume:    function(){ _unlock(); },
    isEnabled: function(){ return _enabled; },
    toggle: function(){
      _enabled = !_enabled;
      try{ localStorage.setItem('se_enabled',_enabled?'on':'off'); }catch(e){}
      return _enabled;
    },
    blip: function(chr) {
      if(!_enabled) return;
      var now=Date.now();
      if(now-_last<INTERVAL) return;
      _last=now;
      if(chr==='mio'){
        _tone(520+(Math.random()*40-20),'triangle',0.06,0.13);
      } else if(chr==='noa'){
        _tone(880,'sine',0.07,0.10,0,null,true);
      } else {
        _tone(320,'sine',0.06,0.12);  /* トウ・その他 */
      }
    },
    select:         function(){ _tone(520,'sine',0.06,0.15); _tone(660,'sine',0.06,0.12,0.07); },
    notify:         function(){ _tone(880,'sine',0.08,0.13); _tone(1100,'sine',0.06,0.10,0.09); },
    notifyBlank:    function(){ _noise(0.35,0.06,600); },
    memoryClick:    function(){ _tone(1320,'sine',0.04,0.12); },
    reconstruction: function(){
      _tone(523,'sine',0.12,0.14);
      _tone(659,'sine',0.12,0.12,0.10);
      _tone(784,'sine',0.18,0.14,0.20);
    }
  };
  return SE;
})();

/* SE トグルボタン制御 */
(function() {
  var btn = document.getElementById('se-toggle');
  if (!btn) return;
  function paint() {
    try {
      var on = SE && SE.isEnabled ? SE.isEnabled() : true;
      btn.textContent = on ? '♪ ON' : '♪ OFF';
      btn.classList.toggle('off', !on);
    } catch(e) {}
  }
  paint();
  btn.addEventListener('click', function(e) {
    e.stopPropagation();
    try { if (SE) { SE.unlock(); var on = SE.toggle(); paint(); if (on) SE.select(); } } catch(e) {}
  });
})();

document.addEventListener('touchstart',function(){ SE.unlock(); },{passive:true,once:false});
/* ═══ SCENE ENGINE ═══════════════════════════════════════ */
var si=0, beat=0, tTimer=null;
var SCENES = []; /* ← シナリオデータはここに入る */

function sc() {
  if (typeof si === 'string') {
    var idx = SCENES.findIndex(function(s){ return s.id === si; });
    if (idx >= 0) { si = idx; } else { return null; }
  }
  return SCENES[si] || null;
}
function ns() { si++; runScene(); }

function runScene() {
  var s = sc(); if (!s) { showEnd(); return; }
  if (s.type === 'vn')     showVN(s);
  else if (s.type === 'memory') showMemory(s);
  else if (s.type === 'phone') showPhone(s);
  else if (s.type === 'continued') showContinued(s);
}

function showVN(s) {
  show('S-scene');
  beat = 0;
  var bg = document.getElementById('scene-bg');
  bg.style.background = s.bg || '#0a0a12';
  showBeat(s);
}

/* 話者名 → ブリップ用キャラキー（ト書き=無音） */
function blipKey(speaker) {
  if (!speaker || !speaker.name) return null;
  var n = speaker.name;
  if (n.indexOf('トウ') >= 0) return 'tou';
  if (n.indexOf('ミオ') >= 0) return 'mio';
  if (n.indexOf('ノア') >= 0) return 'noa';
  return null;
}

function showBeat(s) {
  var b = s.beats[beat]; if (!b) { ns(); return; }
  var sp = document.getElementById('dlg-speaker');
  var nm = document.getElementById('dlg-name');
  var rl = document.getElementById('dlg-role');
  var tx = document.getElementById('dlg-text');
  var inn = document.getElementById('dlg-inner');
  var nx = document.getElementById('dlg-next');
  tx.textContent=''; inn.textContent=''; inn.style.display='none'; nx.style.display='none';

  /* スプライト更新 */
  updateSprites(b.sprites);

  if (b.speaker) {
    sp.style.display='flex';
    nm.textContent=b.speaker.name; nm.style.color=b.speaker.color||'#c8d0e8';
    rl.textContent=b.speaker.role||'';
  } else {
    sp.style.display='none';
  }

  if (b.text) typewrite(tx, b.text, 16, blipKey(b.speaker));
  if (b.inner) { inn.style.display='block'; typewrite(inn, b.inner, 14, null); }
  setTimeout(function(){ nx.style.display='block'; }, 400);
}

function updateSprites(list) {
  var zone = document.getElementById('scene-sprites');
  zone.innerHTML = '';
  if (!list) return;
  list.forEach(function(sp) {
    var wrap = document.createElement('div'); wrap.className='sprite-wrap';
    var src = getSprite(sp.id);
    if (src) {
      var img = document.createElement('img');
      img.src=src; img.className='sprite-img';
      img.style.height = (sp.height||96)+'px';
      if (sp.flip) img.style.transform='scaleX(-1)';
      wrap.appendChild(img);
    }
    if (sp.label) {
      var lbl = document.createElement('div'); lbl.className='sprite-name';
      lbl.textContent=sp.label; wrap.appendChild(lbl);
    }
    zone.appendChild(wrap);
  });
}

function typewrite(el, txt, spd, blipChar) {
  if(tTimer)clearInterval(tTimer);
  el.textContent=''; var i=0;
  tTimer=setInterval(function(){
    var ch=txt[i++];
    el.textContent+=ch;
    /* 空白・改行以外の文字でキャラ別ブリップ（内部で80ms制御） */
    if(blipChar && ch && ch!=='\n' && ch!=='　' && ch!==' ') SE.blip(blipChar);
    if(i>=txt.length){clearInterval(tTimer);tTimer=null;}
  }, spd||14);
}

document.getElementById('S-scene').addEventListener('click', function() {
  SE.resume();
  if (tTimer) { clearInterval(tTimer); tTimer=null;
    var s=sc(); if(s&&s.beats&&s.beats[beat]) {
      var b=s.beats[beat];
      document.getElementById('dlg-text').textContent=b.text||'';
      if(b.inner)document.getElementById('dlg-inner').textContent=b.inner;
    }
    document.getElementById('dlg-next').style.display='block'; return;
  }
  beat++;
  var s=sc();
  if(s&&s.beats&&beat<s.beats.length) showBeat(s);
  else ns();
});

/* ═══ MEMORY REWRITE ═══════════════════════════════════ */
var selectedMemory = null;

function showMemory(s) {
  show('S-memory');
  selectedMemory = null;
  var ct = document.getElementById('memory-cards');
  var btn = document.getElementById('memory-confirm');
  ct.innerHTML=''; btn.style.display='none';

  var opts = s.options || s.choices || [];
  opts.forEach(function(opt, i) {
    var card = document.createElement('div'); card.className='memory-card';
    card.innerHTML='<div class="memory-card-label">記憶 '+(i+1)+'</div>'
      +'<div class="memory-card-text">'+(opt.text||opt.label||'')+'</div>';
    card.onclick = function() {
      SE.resume();
      SE.memoryClick(); /* 記憶断片クリック */
      document.querySelectorAll('.memory-card').forEach(function(c){c.classList.remove('selected');});
      card.classList.add('selected');
      selectedMemory = opt;
      btn.style.display='block';
    };
    ct.appendChild(card);
  });

  var isReconstruction = (s.id && s.id.indexOf('reconstruction') >= 0);
  btn.onclick = function() {
    if (!selectedMemory) return;
    /* 再構成シーンで正解（次へ進む）なら和音、それ以外は選択音 */
    if (isReconstruction && selectedMemory.next) SE.reconstruction();
    else SE.select();
    if (selectedMemory.next) { si = selectedMemory.next; runScene(); }
    else ns();
  };
}

/* ═══ PHONE / 章末・空白メッセージ ════════════════════ */
var phone = { msgs: [], idx: 0, done: false, timer: null };

function escapeHtml(t) {
  return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
/* 文字列、または [{t:'通常'},{b:'　　'}] 形式（b=白く抜ける部分）を描画 */
function renderSeg(seg) {
  if (seg == null) return '';
  if (typeof seg === 'string') return escapeHtml(seg);
  return seg.map(function(p) {
    if (p.b != null) return '<span class="blank">' + escapeHtml(p.b) + '</span>';
    return escapeHtml(p.t || '');
  }).join('');
}

function addPhoneMsg(m) {
  var thread = document.getElementById('phone-thread');
  var wrap = document.createElement('div');
  wrap.className = 'msg' + (m.unknown ? ' unknown' : '');
  var from = document.createElement('div'); from.className = 'msg-from';
  from.innerHTML = renderSeg(m.from);
  var bub = document.createElement('div'); bub.className = 'msg-bubble';
  bub.innerHTML = renderSeg(m.text);
  wrap.appendChild(from); wrap.appendChild(bub);
  thread.appendChild(wrap);
  thread.scrollTop = thread.scrollHeight;
}

/* 空白メッセージ判定（unknown、または b: 抜け部分を含むセグメント） */
function segHasBlank(seg) {
  if (!seg || typeof seg === 'string') return false;
  return seg.some(function(p) { return p && p.b != null; });
}
function isBlankMsg(m) {
  return !!(m.unknown || segHasBlank(m.text) || segHasBlank(m.text_parts) ||
            segHasBlank(m.from) || segHasBlank(m.from_parts));
}

function phoneStep() {
  if (phone.idx >= phone.msgs.length) {
    phone.done = true;
    document.getElementById('phone-next').style.display = 'block';
    return;
  }
  var m = phone.msgs[phone.idx++];
  addPhoneMsg(m);
  if (isBlankMsg(m)) SE.notifyBlank(); else SE.notify();
  phone.timer = setTimeout(phoneStep, m.delay || 900);
}

function showPhone(s) {
  show('S-phone');
  if (phone.timer) { clearTimeout(phone.timer); phone.timer = null; }
  phone.msgs = s.messages || [];
  phone.idx = 0; phone.done = false;
  document.getElementById('phone-header').textContent = s.header || 'メッセージ';
  document.getElementById('phone-thread').innerHTML = '';
  document.getElementById('phone-next').style.display = 'none';
  phoneStep();
}

document.getElementById('S-phone').addEventListener('click', function() {
  SE.resume();
  if (!phone.done) {
    /* 残りメッセージを一括表示（音は最後に1回だけ：空白があれば不安音） */
    if (phone.timer) { clearTimeout(phone.timer); phone.timer = null; }
    var sawBlank = false;
    while (phone.idx < phone.msgs.length) {
      var rm = phone.msgs[phone.idx++];
      if (isBlankMsg(rm)) sawBlank = true;
      addPhoneMsg(rm);
    }
    if (sawBlank) SE.notifyBlank(); else SE.notify();
    phone.done = true;
    document.getElementById('phone-next').style.display = 'block';
    return;
  }
  ns();
});

/* ═══ CHAPTER END ═════════════════════════════════════ */
function showContinued(s) {
  show('S-continued');
  var btn = document.getElementById('cont-btn');
  /* 次のシーンがあれば「次の章へ」、なければ「タイトルへ戻る」 */
  var hasNext = (si + 1) < SCENES.length;
  btn.textContent = hasNext ? '次の章へ' : 'タイトルへ戻る';
  /* クリックハンドラを付け替え（重複防止） */
  var newBtn = btn.cloneNode(true);
  btn.parentNode.replaceChild(newBtn, btn);
  newBtn.addEventListener('click', function() {
    if (hasNext) { si++; beat=0; runScene(); }
    else { showEnd(); }
  });
}

/* ═══ UTILS ═══════════════════════════════════════════ */
function show(id) {
  document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});
  document.getElementById(id).classList.add('active');
}
function showEnd() {
  show('S-title');
}

/* ═══ START ═══════════════════════════════════════════ */
(function(){
  var btn = document.getElementById('start-btn');
  function go(e){ if(e) e.preventDefault(); SE.unlock(); si=0; beat=0; runScene(); }
  btn.addEventListener('touchstart', go, {passive:false});
  btn.addEventListener('click',      go, false);
})();

: "#8090c8", "role": ""}, "sprites": []}]}, {"id": "ch01_030_unlog_sign", "type": "vn", "bg": "linear-gradient(180deg,#c4c8d4,#9498aa)", "beats": [{"text": "広場の端の古い掲示板に、誰かの落書きが残っていた。", "speaker": null, "sprites": []}, {"text": "——《記録は嘘をつく》。\nインクは、まだ乾いていないように見えた。", "speaker": null, "sprites": []}, {"text": "すぐ横の街頭端末が、ざ、ざ、と白いノイズに乱れる。\n知らない文字が一瞬だけ走って、すぐに消えた。", "speaker": null, "sprites": []}, {"text": "（何かがおかしい。\n最近、こういうものが、増えてきた。）", "speaker": null, "sprites": []}]}, {"id": "ch01_035_unlog_approach", "type": "vn", "bg": "linear-gradient(180deg,#a8acba,#7e8290)", "beats": [{"text": "ベンチのミオに、フードを深くかぶった人物が近づいていく。\n足音は、記録に残らないみたいに静かだった。", "speaker": null, "sprites": []}, {"text": "「見つけた」", "speaker": {"name": "？", "color": "#9a8aa0", "role": "（フードの人物）"}, "sprites": []}, {"text": "「やっぱり、記録に残らない」", "speaker": {"name": "？", "color": "#9a8aa0", "role": "（フードの人物）"}, "sprites": []}, {"text": "「きみは、世界を戻す鍵だ」", "speaker": {"name": "？", "color": "#9a8aa0", "role": "（フードの人物）"}, "sprites": []}, {"text": "ミオは一瞬、息を呑んだ。\nそれでも、いつものように笑ってみせる。", "speaker": null, "sprites": []}, {"text": "「……大丈夫だよ」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "袖を握るミオの指先が、小さく震えていた。", "speaker": null, "sprites": []}]}, {"id": "ch01_040_choice_protect", "type": "memory", "prompt": "アンログの人物が、ミオに迫っている。どうする？", "options": [{"text": "ミオに声をかける", "next": null}, {"text": "状況を確認する", "next": 15}]}, {"id": "ch01_045_name_call", "type": "vn", "bg": "linear-gradient(180deg,#dfe4f0,#cbd4e8)", "beats": [{"text": "放っておけなかった。\n気づいたら、トウは一歩、前に出ていた。", "speaker": null, "sprites": []}, {"text": "「ミオ」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「鍵なんかじゃない」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「ミオは、ミオだ」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "ミオの肩が、小さく揺れた。\nトウの声に気づいて、強ばっていた顔が、少しほどける。", "speaker": null, "sprites": []}, {"text": "「……トウ」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "フードの人物が、初めて動きを止めた。", "speaker": null, "sprites": []}, {"text": "「なぜ、彼女に声が届く」", "speaker": {"name": "？", "color": "#9a8aa0", "role": "（フードの人物）"}, "sprites": []}, {"text": "人物は背を向け、人混みの白さに溶けるように消えていく。", "speaker": null, "sprites": []}, {"text": "「記録できない子……また来る」", "speaker": {"name": "？", "color": "#9a8aa0", "role": "（フードの人物）"}, "sprites": []}]}, {"id": "ch01_050_after", "type": "vn", "bg": "linear-gradient(180deg,#e6ebe2,#d0d8c6)", "beats": [{"text": "気づくと、フードの人物の姿は、もうどこにもなかった。", "speaker": null, "sprites": []}, {"text": "ミオが、ふっと肩の力を抜く。", "speaker": null, "sprites": []}, {"text": "「……ありがとう」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「よくあるの。わたし、ちょっと有名みたい」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「記録に、残らないから」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "ミオは笑っていた。\nでも、その笑い方を、トウは放っておけなかった。", "speaker": null, "sprites": []}, {"text": "（また来る、と言っていた。\n次は、もっと早く動く。）", "speaker": null, "sprites": []}]}, {"id": "ch01_010_message", "type": "vn", "bg": "linear-gradient(180deg,#08080f,#0c1020)", "beats": [{"text": "スマートフォンが震える。", "speaker": null, "sprites": []}, {"text": "「トウ、今どこ？\n広場に来て。変なことが起きてる」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "ミオ。\nまだある。まだ、呼べる。", "speaker": null, "sprites": []}, {"text": "「……行く」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}]}, {"id": "ch01_020_plaza_meet", "type": "vn", "bg": "linear-gradient(180deg,#0a100a,#0c1810)", "beats": [{"text": "広場の入口で、ミオが手を振っていた。\nその声を聞いただけで、息が戻った。", "speaker": null, "sprites": []}, {"text": "「トウ、こっち」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「ミオ、大丈夫か」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「大丈夫。たぶん、大丈夫」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "（大丈夫じゃない時の声だ）", "speaker": null, "sprites": []}, {"text": "ミオは少し笑った。\n指先はカーディガンの袖を強く握っている。", "speaker": null, "sprites": []}, {"text": "「トウって、そういうところあるよね」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「見すぎないでって言いたくなるところ」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「でも、今日は見てほしいかも」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "ミオが広場の中央を指さした。", "speaker": null, "sprites": []}]}, {"id": "ch01_030_missing_chair", "type": "vn", "bg": "linear-gradient(180deg,#06060e,#080814)", "beats": [{"text": "そこには、何もなかった。\n昨日まであったはずの古い椅子が——ない。", "speaker": null, "sprites": []}, {"text": "地面には、四角い跡だけが残っている。\n椅子の脚が長い間そこにあった証拠。", "speaker": null, "sprites": []}, {"text": "「消えてる。」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「撤去されたのか」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「でも、誰も覚えてない」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "清掃員。通行人。近くの店員。\n誰に聞いても答えは同じだった。\n「そんな椅子、ありましたっけ。」", "speaker": null, "sprites": []}, {"text": "（おかしい——絶対に、おかしい。あの椅子は、確かにあった。）", "speaker": null, "sprites": []}, {"text": "ミオは軽く笑った。怖い時の笑い方だった。", "speaker": null, "sprites": []}, {"text": "「……わたしたち、あそこに座ったよね？　ね？」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「違う。ミオが怖がってる。それが証拠だ。」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「……そういうところ、ほんと変」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「でも、今のは嫌じゃない」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}]}, {"id": "ch01_060_choice", "type": "memory", "prompt": "どうする？", "options": [{"text": "観測する", "next": "ch01_070a_observe"}, {"text": "観測しない", "next": "ch01_070b_dont_look"}, {"text": "ミオに聴く", "next": "ch01_070c_listen"}, {"text": "待つ", "next": "ch01_070d_wait"}]}, {"id": "ch01_070a_observe", "type": "vn", "bg": "linear-gradient(180deg,#060610,#080818)", "beats": [{"text": "椅子の跡に手を伸ばした。\n指先が触れた瞬間、視界が白く弾ける。", "speaker": null, "sprites": []}, {"text": "（雨上がりの広場。濡れた椅子。ハンカチを敷く手。ミオの笑い声。でも、その笑い声の奥に、小さな震えがある。）", "speaker": null, "sprites": []}, {"text": "戻った時、ミオは胸元を押さえていた。", "speaker": null, "sprites": []}, {"text": "「悪い」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「見たの？」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "（責める声ではなかった。だから余計に痛かった。）", "speaker": null, "sprites": []}, {"text": "「……見すぎないで。」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}], "next": "ch01_070_reconstruction"}, {"id": "ch01_070b_dont_look", "type": "vn", "bg": "linear-gradient(180deg,#060610,#080818)", "beats": [{"text": "手を下ろした。", "speaker": null, "sprites": []}, {"text": "「見ないの？」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「ミオが不安そうだから」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「それ、理由になる？」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「なる」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「……ありがとう。」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}], "next": "ch01_070_reconstruction"}, {"id": "ch01_070c_listen", "type": "vn", "bg": "linear-gradient(180deg,#060610,#080818)", "beats": [{"text": "「ミオ、何を覚えてる？」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「椅子があって、私、そこに座って——誰かと話してた」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「誰か？」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「わからない。顔も、声も、名前も思い出せない」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「でも、その人といると、安心してた。世界から私だけが少し浮いてても、その人の隣なら大丈夫って思えた」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「覚えてないのに、寂しいんだ」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}], "next": "ch01_070_reconstruction"}, {"id": "ch01_070d_wait", "type": "vn", "bg": "linear-gradient(180deg,#060610,#080818)", "beats": [{"text": "すぐに答えを出すのをやめた。", "speaker": null, "sprites": []}, {"text": "「急がなくていい」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「でも、忘れちゃうかも」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「その時は、また一緒に探す」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「忘れても？」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「忘れても」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「……それ、ちょっとずるい」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「忘れても大丈夫って言われると、忘れるのが、少しだけ怖くなくなる」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「でも、怖くなくなるのも、少し怖い」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}], "next": "ch01_070_reconstruction"}, {"id": "ch01_070_reconstruction", "type": "memory", "prompt": "何が消えたのか——断片を選ぶ", "options": [{"text": "地面に残った四角い跡", "next": null}, {"text": "誰も椅子を覚えていない", "next": null}, {"text": "ミオだけが違和感を持っている", "next": null}, {"text": "ミオとトウがその椅子に座った記憶", "next": "ch01_080_truth"}]}, {"id": "ch01_080_truth", "type": "vn", "bg": "linear-gradient(180deg,#08080f,#0a0818)", "beats": [{"text": "断片がつながる。", "speaker": null, "sprites": []}, {"text": "「椅子が消えたんじゃない」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「椅子に結びついていた関係が、白く抜けてる」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「……消えるのは、物じゃないんだ」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「ミオがそこに座ったこと。誰かと話したこと。\nその椅子に意味があったこと——それが、消えてる」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「……じゃあ、私が寂しいのは\nそこに何かがあったからなんだね」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "（書き換えるのではなく——受け止め直すことが、できるだろうか。）", "speaker": null, "sprites": []}]}, {"id": "ch01_090_phone", "type": "phone", "messages": [{"from": "ミオ", "text": "今日はありがとう。", "delay": 700}, {"from": "ミオ", "text": "またね。", "delay": 1400}, {"unknown": true, "from_parts": [{"t": "ミ"}, {"b": "　　"}], "text_parts": [{"t": "ねえ、わたしの"}, {"b": "　　　"}, {"t": "こと、"}, {"b": "　　　　　"}, {"t": "ないでね。"}], "delay": 2200}]}, {"id": "ch01_099_continued", "type": "continued"}, {"id": "ch02_001_morning_log", "type": "vn", "bg": "linear-gradient(180deg,#10121c,#181a2a)", "beats": [{"text": "翌朝。\nスマホに昨日の生活ログが届いていた。", "speaker": null, "sprites": []}, {"text": "昨日 16:20　広場\n同行者: ＿＿\n会話ログ: 一部同期失敗\n感情タグ: 未分類", "speaker": null, "sprites": []}, {"text": "（また、ミオの部分だけ空白になっている。\nもう驚かなくなってきた自分が、少し怖い。）", "speaker": null, "sprites": []}, {"text": "「ミオは、いた」\n「僕は覚えてる」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}]}, {"id": "ch02_002_mio_talk", "type": "vn", "bg": "linear-gradient(180deg,#e8eede,#cdd8c0)", "beats": [{"text": "広場の端でミオを見つけた。\n今日もいつもの場所にいた。", "speaker": null, "sprites": []}, {"text": "「昨日の記録、ミオに関係するところだけ消えてるんだ」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「また同期異常かな。大丈夫だよ、たぶん」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「そのたぶんが信用できない」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「トウは心配しすぎ」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「ミオが心配させるんだろ」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "ミオは笑った。\nいつものように、怖くなさそうに。", "speaker": null, "sprites": []}]}, {"id": "ch02_003_city_blank", "type": "vn", "bg": "linear-gradient(180deg,#2a2c3a,#1e2030)", "beats": [{"text": "街を歩いていると、おかしなことに気づいた。", "speaker": null, "sprites": []}, {"text": "スマホの地図に、店名が入っていない場所がある。\n看板の写真を撮ると、文字の部分だけ白く抜ける。\n昨日すれ違った人の名前タグが、生活ログから消えている。", "speaker": null, "sprites": []}, {"text": "どれも、ミオが触れた場所だった。\nミオが悪いわけじゃない。\nただ、ミオがいた場所の記録だけが、なかったことになっていく。", "speaker": null, "sprites": []}, {"text": "「……これって、ずっとこうだったの？」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「最近は、少し早くなった気がする」\nミオは空を見ながら、静かに笑った。", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}]}, {"id": "ch02_004_rina_meet", "type": "vn", "bg": "linear-gradient(180deg,#2a2c3a,#1e2030)", "beats": [{"text": "「ちょっといい？」\n路地の出口で、女の子が立っていた。\nスマホをこちらに向けながら、メモを取っている。", "speaker": null, "sprites": []}, {"text": "「わたし、リナ。\n白峰の記録異常を三か月追ってる」", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "「今日だけで十一か所。\n全部、同じ方向に動いてる」\n画面を差し出してきた。今いる路地が、白く抜けていた。", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "「さっきから追いかけてた。\n——この異常、あなたと一緒に動いてる」\nリナはミオを見た。断定じゃなく、確認だった。", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "「責めてるわけじゃない。\nパターンとして、そうなってる」", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "ミオは少し黙ってから頷いた。", "speaker": null, "sprites": []}, {"text": "「……たぶん、そう。\n昔からちょっとこういうことが起きる」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「昔から？」\nリナが眉を上げた。メモの手が止まった。", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "「名前、聞いていい？\n記録に残したい。あなたたち二人とも」", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "「……ミオ」\n「トウ」", "speaker": {"name": "ミオ／トウ", "color": "#8898b8", "role": ""}, "sprites": []}, {"text": "「ミオ、トウ。\n管理局が来る前に動いたほうがいい。\n一緒に来てくれると助かる——あなたたちのことも、もっと調べたい」", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}]}, {"id": "ch02_005_market", "type": "vn", "bg": "linear-gradient(180deg,#c8b898,#b0a080)", "beats": [{"text": "「一緒に来て」\nリナに促されて、三人で路地を歩き始めた。", "speaker": null, "sprites": []}, {"text": "「記憶局って知ってる？\n正式名称は白峰市記録管理局。\n市民の生活ログを管理してる行政機関」", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "「白く抜けた場所を見つけると、\n『同期異常』として巡回端末を飛ばしてくる。\n異常の発生源だと判定したものは——保護、って名目で連れていく」", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "「連れていく？」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「一度連れていかれた人が\nどうなるかは——記録に残ってない」\nリナは短く言って、前を向いた。", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "「だから避ける。\n今日ミオの異常を検知したなら、もう端末が来てる可能性がある」", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "石畳の市場へ入った。\n野菜籠が並んで、焼きたてのパンの匂いがする。\n木の看板が風に揺れている。\n誰もが普通に暮らしている。", "speaker": null, "sprites": []}, {"text": "そこで、ミオが急に立ち止まった。\n路地の端で、小さな子どもが泣いていた。", "speaker": null, "sprites": []}, {"text": "「逃げてる途中に寄り道って、よくないよね」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「わかってるなら、なんで子どもに近づいてるの」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「泣いてたから」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「それだけ？」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「それだけで十分じゃない？」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "リナが小さく息を吐いた。\n「……調査対象が規格外すぎる」", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "（言い返せなかった。\nだから、放っておけなくなる。）", "speaker": null, "sprites": []}]}, {"id": "ch02_006_detection", "type": "phone", "messages": [{"from": "白峰市記録管理局", "text": [{"t": "同期異常の中心反応を確認。"}, {"b": "対象を保護します。"}, {"t": "市民の安全のため、移動を停止してください。"}], "delay": 1200}, {"from": "——", "text": [{"t": "エリアログ: 一括同期失敗"}], "delay": 800}], "next": "ch02_006b_after_detection"}, {"id": "ch02_006b_after_detection", "type": "vn", "bg": "linear-gradient(180deg,#1a1c28,#0e1020)", "beats": [{"text": "「私、また迷惑かけた？」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「違う」\n「君が悪いんじゃない」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「でも端末が——」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「ミオが悪いんじゃない」\nもう一度、言った。", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}]}, {"id": "ch02_007_escape", "type": "memory", "bg": "linear-gradient(180deg,#1a1c28,#0e1020)", "prompt": "記憶局の端末が近づいている。どうする？", "choices": [{"label": "路地に隠れる", "next": "ch02_007a_hide"}, {"label": "市場の人混みに紛れる", "next": "ch02_007b_crowd"}]}, {"id": "ch02_007a_hide", "type": "vn", "bg": "linear-gradient(180deg,#0a0c18,#080a14)", "beats": [{"text": "路地の奥、木箱の影に三人で身を潜めた。\n端末の光が目の前を通り過ぎていく。", "speaker": null, "sprites": []}, {"text": "「……行った」", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "ミオが小さく息を吐いた。\n手が少し震えていた。", "speaker": null, "sprites": []}]}, {"id": "ch02_007b_crowd", "type": "vn", "bg": "linear-gradient(180deg,#c8b898,#b0a080)", "beats": [{"text": "市場の人混みに紛れて、何事もない顔で歩いた。\n端末が近くを通り過ぎていく。", "speaker": null, "sprites": []}, {"text": "「……通った」", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "ミオが小さく息を吐いた。\n手が少し震えていた。", "speaker": null, "sprites": []}]}, {"id": "ch02_008_shelter", "type": "vn", "bg": "linear-gradient(180deg,#1e1a2a,#161222)", "beats": [{"text": "記録されない路地の奥。\n古い石造りの軒下で、三人は雨をやり過ごした。", "speaker": null, "sprites": []}, {"text": "スマホが圏外になっていた。\nここは地図にも、生活ログにも存在しない場所らしかった。", "speaker": null, "sprites": []}, {"text": "「ミオ」\n静かに呼んだ。", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "ミオが、少しだけ顔を上げた。\n笑顔じゃなかった。ほんの一瞬だけ。\nでもすぐに笑った。", "speaker": null, "sprites": []}, {"text": "「……うん」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "（その一瞬が、ずっと頭に残った。）", "speaker": null, "sprites": []}]}, {"id": "ch02_009_unlog_trace", "type": "vn", "bg": "linear-gradient(180deg,#1e1a2a,#161222)", "beats": [{"text": "路地の壁に、見慣れない落書きがあった。\n鐘のような形。その下に、「記録を信じるな」という文字。", "speaker": null, "sprites": []}, {"text": "「鐘砕き、か」\nリナが低い声で言った。", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "「知ってるの？」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「アンログの急進派。\n時計塔の鐘と関係があるらしい。それ以上は……記録が封鎖されてる」", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "ミオが時計塔の方角を見た。\n一瞬だけ、笑顔が消えた。", "speaker": null, "sprites": []}]}, {"id": "ch02_010_triangle", "type": "vn", "bg": "linear-gradient(180deg,#0a0c18,#080a14)", "beats": [{"text": "出口を確認しようとした時、\n広場の入口に記憶局の巡回端末が現れた。", "speaker": null, "sprites": []}, {"text": "「囲まれた」\nリナが小声で言った。", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "その時、街頭端末がノイズで乱れた。\n「記録を信じるな」という文字が一瞬映って、消えた。\n記憶局の端末が一斉に再起動を始める。", "speaker": null, "sprites": []}, {"text": "「今だ、逃げろ——」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "でも、ノイズの向こうから人影が現れた。\nフードを深く被った人たち。\nアンログだ。助けに来たんじゃなかった。", "speaker": null, "sprites": []}, {"text": "「やっと見つけた」\n「その子を管理局に渡すな。世界を戻す鍵だ」", "speaker": {"name": "???", "color": "#c87060", "role": ""}, "sprites": []}]}, {"id": "ch02_011_mio_helps", "type": "vn", "bg": "linear-gradient(180deg,#0a0c18,#080a14)", "beats": [{"text": "逃げようとした。\nしかしミオが立ち止まった。", "speaker": null, "sprites": []}, {"text": "路地の端に、小さな子どもがいた。\n混乱の中で転んで、動けなくなっていた。", "speaker": null, "sprites": []}, {"text": "「ミオ、来て——」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "ミオは振り返った。\n笑っていた。\n怖い時の、あの笑顔だった。", "speaker": null, "sprites": []}, {"text": "「大丈夫。すぐ行く」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}]}, {"id": "ch02_012_abduction", "type": "vn", "bg": "linear-gradient(180deg,#060810,#040608)", "beats": [{"text": "その隙だった。", "speaker": null, "sprites": []}, {"text": "アンログの人影がミオの腕を掴んだ。", "speaker": null, "sprites": []}, {"text": "「ミオ——！」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "手を伸ばした。\n届かなかった。", "speaker": null, "sprites": []}]}, {"id": "ch02_013_loss", "type": "vn", "bg": "linear-gradient(180deg,#060810,#040608)", "beats": [{"text": "連れていかれながら、ミオはこちらを見た。", "speaker": null, "sprites": []}, {"text": "「大丈夫」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "笑っていた。", "speaker": null, "sprites": []}, {"text": "「大丈夫じゃないだろ」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "届かなかった。", "speaker": null, "sprites": []}]}, {"id": "ch02_014_chapter03_hook", "type": "vn", "bg": "linear-gradient(180deg,#10121c,#0c0e18)", "beats": [{"text": "どのくらい時間が経ったか分からない。\nミオが連れて行かれた方角を、ただ見ていた。", "speaker": null, "sprites": []}, {"text": "「……追うよね」\nリナが言った。", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "「追うなら、記録にない道を行くしかない」", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "「——行く」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}]}, {"id": "ch02_099_continued", "type": "continued"}, {"id": "ch03_001_loss_after", "type": "vn", "bg": "linear-gradient(180deg,#060810,#040608)", "beats": [{"text": "【トウ側】", "speaker": null, "sprites": []}, {"text": "ミオが連れ去られた路地で、トウはしばらく動けなかった。", "speaker": null, "sprites": []}, {"text": "「……追う」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "リナが頷いた。\n「ログには残ってない。でも、消えた跡は残ってる」", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "「跡？」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「紙の地図、手書きのメモ、人の記憶」\n「記録じゃなくても、残るものはある」", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}]}, {"id": "ch03_002_paper_map", "type": "vn", "bg": "linear-gradient(180deg,#1a1c28,#10121c)", "beats": [{"text": "リナが古本屋の軒下で、紙の地図を広げた。\n手書きの文字で、知らない路地名が書かれている。", "speaker": null, "sprites": []}, {"text": "「鐘砕きが活動してる区域はログに出ない。\nでも、紙には残ってる」", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "地図の端に、小さな落書き。\n鐘のような形。その横に——「白層」という文字。", "speaker": null, "sprites": []}, {"text": "「ここに行く」\nトウが指さした。", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}]}, {"id": "ch03_003_unrecorded_road", "type": "vn", "bg": "linear-gradient(180deg,#0e1018,#080a12)", "beats": [{"text": "白く抜けた路地に入った瞬間、スマホの画面が白くなった。\nGPS圏外。生活ログ記録停止。", "speaker": null, "sprites": []}, {"text": "「ここから先は記録されない」\nリナが静かに言った。", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "「不安か？」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「データがない方が不安」\nでもリナは歩き続けた。", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "トウは、ミオのことを思い浮かべた。\nミオも、ずっとこの側にいた。\n記録されない場所に。", "speaker": null, "sprites": []}]}, {"id": "ch03_004_white_zone", "type": "vn", "bg": "linear-gradient(180deg,#f0f0f8,#e0e0f0)", "beats": [{"text": "白い霧のような区域に入った。\n看板の文字が読めない。家の表札に名前がない。", "speaker": null, "sprites": []}, {"text": "地面に、手書きの名前が刻まれていた。\nたくさんの名前。記録に残れなかった人たちのものらしかった。", "speaker": null, "sprites": []}, {"text": "「時計塔事件の後から、ここが白くなった」\nリナが地図を見ながら言った。", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "壁に、古い落書き。\n鐘のような形と、一行の文字——\n「消えた人を、なかったことにするな」", "speaker": null, "sprites": []}, {"text": "（これが、アンログの始まりだ）", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}]}, {"id": "ch03_005_mio_arrives", "type": "vn", "bg": "linear-gradient(180deg,#1a1a2e,#16213e)", "beats": [{"text": "【ミオ側】", "speaker": null, "sprites": []}, {"text": "連れてこられた場所は、地図にない街だった。\n石畳の路地。手書きの看板。暖炉の煙。", "speaker": null, "sprites": []}, {"text": "「ここが……アンログの街」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「鍵が来た」\nフードの人物が言った。", "speaker": {"name": "鐘砕き", "color": "#c87060", "role": ""}, "sprites": []}, {"text": "ミオは怖かった。\nだから笑った。", "speaker": null, "sprites": []}, {"text": "「わたし、ミオって言うんですけど」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "誰も笑わなかった。", "speaker": null, "sprites": []}]}, {"id": "ch03_006_nagi_appears", "type": "vn", "bg": "linear-gradient(180deg,#1a1a2e,#16213e)", "beats": [{"text": "「見張りは、わたしがする」\n入口の前に、女の子が立っていた。\n13か14歳くらい。腕を組んで、こちらを見ていた。", "speaker": null, "sprites": []}, {"text": "「ナギ」\n短く名乗った。「変なことしないで」", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "「……よろしく、ナギ」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「子ども扱いしないで」", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "「してないよ」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "ナギは少し黙ってから、続けた。\n「ここはわたしの父さんが作った場所。\n白層化で消えた人たちを、なかったことにしないために」", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "「お父さんが……」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「リーダーだから。\nだからわたしが見張りをする。父さんの代わりに、ちゃんとやる」\nナギは少し背伸びするように言った。", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}]}, {"id": "ch03_007_unlog_life", "type": "vn", "bg": "linear-gradient(180deg,#1e1a14,#16140e)", "beats": [{"text": "共同食堂から、パンとスープの匂いがした。\n木の器に盛られたスープを、人々が分け合っている。", "speaker": null, "sprites": []}, {"text": "壁には手書きの名前札。\n古い写真に名前を書き込んでいる人。\n紙の地図を修復している人。", "speaker": null, "sprites": []}, {"text": "不便だった。\nでも、誰かが誰かの名前を呼んでいた。", "speaker": null, "sprites": []}, {"text": "その時、ミオが足を止めた。\n路地の端に、白くにじんだ人が座っていた。\n白層化が進んで、周囲との記録がほとんど繋がっていない人。", "speaker": null, "sprites": []}, {"text": "ミオは近づいて、その人の隣にしゃがんだ。\n何も言わず、ただそこにいた。", "speaker": null, "sprites": []}, {"text": "「……何してるの」\nナギが後ろから言った。", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "「一緒にいる」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「なんで。あの人、あんたのこと分からないよ」", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "「分かんなくても、隣にいたら少し違うでしょ」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "ナギは黙った。\n何かを言いかけて、やめた。", "speaker": null, "sprites": []}]}, {"id": "ch03_007b_nagi_watches", "type": "vn", "bg": "linear-gradient(180deg,#1e1a14,#16140e)", "beats": [{"text": "ミオが戻ってくると、ナギはまだそこにいた。", "speaker": null, "sprites": []}, {"text": "「……怖くないの」\nナギが聞いた。", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "「怖いよ」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「じゃあなんで笑ってるの」", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "ミオは少し考えてから言った。\n「笑ってると、怖くなさそうに見えるから」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「……見えるだけでしょ」", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "「そう」\nミオは頷いた。「見えるだけ」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "ナギは何も言わなかった。\nでも、ミオを見る目が少しだけ変わった。\n「鍵」ではなく、別の何かとして。", "speaker": null, "sprites": []}]}, {"id": "ch03_008_mio_nagi_talk", "type": "vn", "bg": "linear-gradient(180deg,#1e1a14,#16140e)", "beats": [{"text": "「ここ、地図にないの？」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「地図に載ったら、消されるから」", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "「記録がないと、不安じゃない？」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「不安だよ。でも記録に残ったら、勝手に意味を決められる」", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "「意味を？」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「笑ってたら、大丈夫って記録される」\n「泣かなかったら、傷ついてないって記録される」", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "ミオは黙った。\n（そっか。わたしの「大丈夫」も、ずっとそう記録されてきたんだ）", "speaker": null, "sprites": []}, {"text": "「ナギは……怖い時どうするの」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "ナギは少し間を置いた。\n「黙る」", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "「黙る？」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「声が出なくなる。笑えないから」\n「あんたと逆だね」", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "二人は少し、黙った。\nその沈黙は、不思議と嫌じゃなかった。", "speaker": null, "sprites": []}]}, {"id": "ch03_009_about_sei", "type": "vn", "bg": "linear-gradient(180deg,#1e1a14,#16140e)", "beats": [{"text": "「父さんはね」\nナギが急に言った。\n「最初から、誰かを壊したかったわけじゃない」", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "「時計塔事件で、たくさんの人が消えた。\n記憶局はそれをなかったことにした。\n父さんは、その人たちの名前を手書きで残し始めた」\n「それがアンログの始まり」", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "「優しい人なんだね」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「うん」\n少し間があった。「だと思ってた」", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "「今は……違うの？」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「急進派が言ってるんだ。\nあんたを使えば、消えた人たちを戻せるかもしれないって」\nナギはミオを見た。直接だった。", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "「父さんは……止めてない」", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "ミオは黙った。\n「そっか」とだけ言った。", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「父さんが間違ってるとは、思いたくない」\n「でも、あんたを見てると」\nナギは言葉を切った。", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "「……わからなくなる」", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}]}, {"id": "ch03_010_approach", "type": "vn", "bg": "linear-gradient(180deg,#0a0c14,#080a10)", "beats": [{"text": "【トウ側】", "speaker": null, "sprites": []}, {"text": "白層の霧が薄くなり、遠くに灯りが見えた。\n暖炉の煙。手書きの看板。", "speaker": null, "sprites": []}, {"text": "「あそこだ」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "背後に、記憶局の端末の光。\n追跡が迫っていた。", "speaker": null, "sprites": []}, {"text": "「急いで。でも音を立てない」\nリナが小声で言った。", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}]}, {"id": "ch03_011_clocktower_scar", "type": "vn", "bg": "linear-gradient(180deg,#1a1a2e,#16213e)", "beats": [{"text": "街の奥に、救護室があった。\nベッドに横たわる人たち——白層化被害者。", "speaker": null, "sprites": []}, {"text": "壁に、手書きの名前がびっしりと貼られていた。\n時計塔事件の被害者たちのものらしかった。", "speaker": null, "sprites": []}, {"text": "「鐘砕きって……時計塔の鐘から来てるの？」\nトウが一人の老人に聞いた。", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "老人は少し黙って、答えた。\n「鐘が鳴った日から、全部が変わった」\n「記憶局はそれをなかったことにした」", "speaker": null, "sprites": []}, {"text": "「だから、鐘を砕くんだ」\n「なかったことにした連中への、答えとして」", "speaker": null, "sprites": []}]}, {"id": "ch03_012_infiltration", "type": "vn", "bg": "linear-gradient(180deg,#0a0c14,#080a10)", "beats": [{"text": "路地の奥に、ミオの声が聞こえた気がした。", "speaker": null, "sprites": []}, {"text": "「いた——」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「止まれ」\n小さな声が、前から聞こえた。", "speaker": null, "sprites": []}, {"text": "ナギだった。\n腕を広げて、二人の前に立っていた。", "speaker": null, "sprites": []}, {"text": "「……外から来たの？」\nナギはトウを見た。疑う目だった。", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "「ミオを迎えに来た」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「ミオの、何？」", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "「幼馴染だ」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}]}, {"id": "ch03_013_rescue", "type": "vn", "bg": "linear-gradient(180deg,#060810,#040608)", "beats": [{"text": "急進派がミオを連れ出そうとしていた。\n「計画の時間だ。鍵を使う」", "speaker": {"name": "鐘砕き", "color": "#c87060", "role": ""}, "sprites": []}, {"text": "「ひとりって言わないで」\nナギが前に出た。「この人には、名前がある」", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "「ナギ、邪魔をするな——」", "speaker": {"name": "鐘砕き", "color": "#c87060", "role": ""}, "sprites": []}, {"text": "トウが走り込んだ。", "speaker": null, "sprites": []}, {"text": "アンログは、ミオを鍵と呼んだ。\n記憶局は、ミオを異常値として扱った。\nどちらも、ミオを見ていなかった。\n\nミオが怖い時ほど笑うこと。\n自分の分のパンまで、誰かに分けてしまうこと。\n「大丈夫」と言う時ほど、大丈夫ではないこと。\n名前を呼ばれた時だけ、少しだけ安心した顔をすること。\n\nそれを、僕は知っている。\n\nだから今度は、飲み込まなかった。", "speaker": null, "sprites": []}, {"text": "「鍵じゃない！」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「異常値でもない！」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「ミオは、ミオだ！」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}]}, {"id": "ch03_014_nagi_choice", "type": "vn", "bg": "linear-gradient(180deg,#1a1a2e,#16213e)", "beats": [{"text": "ナギはセイを見た。\n父は、何も言わなかった。", "speaker": null, "sprites": []}, {"text": "「……父さんが救いたかったのも」\n「きっと、こういう人だった」", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "「父さんが教えたんだよ」\n「消えた人を、なかったことにしちゃいけないって」", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "セイは黙っていた。\n否定しなかった。", "speaker": null, "sprites": []}, {"text": "ナギはトウとミオの前に立った。\n「……行って」", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}]}, {"id": "ch03_015_white_spreads", "type": "vn", "bg": "linear-gradient(180deg,#f0f0f8,#e8e8f4)", "beats": [{"text": "ミオに触れた瞬間、周囲が白く揺れた。\n街の端の看板が白く抜ける。", "speaker": null, "sprites": []}, {"text": "「また広がってる」\nリナがスマホを見た。「記録異常、拡大中」", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "「ミオ——大丈夫か」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "ミオは少し黙った。\n今度は、笑わなかった。", "speaker": null, "sprites": []}, {"text": "「……たぶん、じゃないかもしれない」\n「でも、トウがいるから、大丈夫」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}]}, {"id": "ch03_016_ch04_hook", "type": "vn", "bg": "linear-gradient(180deg,#10121c,#0c0e18)", "beats": [{"text": "街を出た後、リナが立ち止まった。", "speaker": null, "sprites": []}, {"text": "「記録局の奥に、もう一つ仕組みがある」\n「ノア・ネット——記憶と意味を管理してるAIネットワーク」", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "「それが、ミオの記録を消してる？」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「分からない。でも、時計塔事件と繋がってる」\n「そして——あなたのお父さんも」", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "トウは黙った。", "speaker": null, "sprites": []}, {"text": "白いノイズの中で、一瞬だけ声が聞こえた気がした。\n「まだ早いよ」——ノアの声。", "speaker": null, "sprites": []}, {"text": "Chapter04「観測者」へ——", "speaker": null, "sprites": []}]}, {"id": "ch03_099_continued", "type": "continued"}, {"id": "ch04_001_aftermath", "type": "vn", "bg": "linear-gradient(180deg,#10121c,#0c0e18)", "beats": [{"text": "アンログの街を出てから、三日が経った。\n四人は記録に残らない路地の奥に身を潜めていた。", "speaker": null, "sprites": []}, {"text": "リナがスマホを閉じた。\n「ミオのログ欠落、また広がってる」\n「昨日より範囲が二倍以上」", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "ナギが壁に背を預けたまま言った。\n「記憶局が動き始めた。街のログ端末が増えてる」", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "ミオは自分のスマホを見ていた。\n画面に、自分の名前の欄が空白になっている時間が増えていた。", "speaker": null, "sprites": []}, {"text": "「ねえ」\nミオが静かに言った。", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「私、ちゃんとここにいるよね」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "誰も、すぐには答えられなかった。", "speaker": null, "sprites": []}, {"text": "「ミオ」\nトウが呼んだ。", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "ミオが少し顔を上げた。\nいつもの笑顔じゃなかった。", "speaker": null, "sprites": []}, {"text": "「ここにいる」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "ミオはしばらく黙っていた。\nそれから、小さく頷いた。", "speaker": null, "sprites": []}]}, {"id": "ch04_002_designation", "type": "phone", "messages": [{"from": "白峰市記録管理局", "text": [{"t": "白層化拡大防止のため、"}, {"b": "対象Mの保護"}, {"t": "を実施します。"}], "delay": 1000}, {"from": "白峰市記録管理局", "text": [{"t": "対象との接触記録は"}, {"b": "自動補正"}, {"t": "されます。"}], "delay": 1400}, {"from": "白峰市記録管理局", "text": [{"t": "市民の安全のため、記録管理局の指示に従ってください。"}], "delay": 1800}], "next": "ch04_002b_after_notice"}, {"id": "ch04_002b_after_notice", "type": "vn", "bg": "linear-gradient(180deg,#10121c,#0c0e18)", "beats": [{"text": "「『保護』か」\nリナが画面を見たまま言った。", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "「正しい言葉だ。\n怒れない。\n記憶局は暴力を使わない——言葉で人を消す」", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "「ミオは今、公式には『対象M』になった」\n「名前も、顔も、記録からは消えていく」", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "ナギがナイフのような目で言った。\n「だから最初から言ってた。記憶局は信用できないって」", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "（記憶局は暴力を使わない。\nでも、言葉で形を整えて、人を役割に変える。\nミオが「対象M」になった瞬間、ミオの名前は誰の記録にも残らなくなる。）", "speaker": null, "sprites": []}]}, {"id": "ch04_003_kaname", "type": "vn", "bg": "linear-gradient(180deg,#1a1c28,#10121c)", "beats": [{"text": "路地の入口に、人影があった。\n記憶局の制服ではなかった。\nでも、どこかそれに近い雰囲気があった。", "speaker": null, "sprites": []}, {"text": "「逃げなくていい」\n女性の声だった。落ち着いていた。", "speaker": null, "sprites": []}, {"text": "「カナメ。白峰記憶局・白層対策部の解析官です」\n「あなたたちを捕まえに来たわけじゃない」", "speaker": {"name": "カナメ", "color": "#b0c8b0", "role": ""}, "sprites": []}, {"text": "ナギが前に出た。\n「記憶局の人間が信用できるわけない」", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "「そうですね」\nカナメは静かに答えた。\n「私もそう思います」", "speaker": {"name": "カナメ", "color": "#b0c8b0", "role": ""}, "sprites": []}, {"text": "誰も言葉を返せなかった。", "speaker": null, "sprites": []}, {"text": "カナメはトウを見た。\n「君の父親も、同じことを言っていた」", "speaker": {"name": "カナメ", "color": "#b0c8b0", "role": ""}, "sprites": []}, {"text": "「記録に残らないものほど、見なければならないと」", "speaker": {"name": "カナメ", "color": "#b0c8b0", "role": ""}, "sprites": []}, {"text": "トウは動けなかった。", "speaker": null, "sprites": []}, {"text": "カナメは続けた。\n「今夜だけ、話を聞いてほしい」\n「信じるかどうかは、聞いてから決めてください」", "speaker": {"name": "カナメ", "color": "#b0c8b0", "role": ""}, "sprites": []}]}, {"id": "ch04_004_ideology", "type": "vn", "bg": "linear-gradient(180deg,#1a1c28,#10121c)", "beats": [{"text": "カナメが話し始めた。\n「記憶局がなければ、この街はとっくに壊れていた」", "speaker": {"name": "カナメ", "color": "#b0c8b0", "role": ""}, "sprites": []}, {"text": "「暴力衝動、喪失の痛み、戦争の記憶——\n全部を人が抱えたままでは、社会は保たない」\n「記憶補助と感情調整は、この街を守ってきた」", "speaker": {"name": "カナメ", "color": "#b0c8b0", "role": ""}, "sprites": []}, {"text": "「それは本当のことだ」\nリナが静かに言った。「否定しない」", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "「でも」\nカナメは続けた。\n「守るために、分類し続けた」", "speaker": {"name": "カナメ", "color": "#b0c8b0", "role": ""}, "sprites": []}, {"text": "「分類できないものを、異常と呼ぶようになった」\n「ミオのような存在を、バグとして扱うようになった」", "speaker": {"name": "カナメ", "color": "#b0c8b0", "role": ""}, "sprites": []}, {"text": "「あなたも、そう思ってるんですか」\nナギが言った。疑うような目で。", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "「私はノア・ネットの深層ロジックを知っている」\n「14歳からずっと、解析してきた」\n「だから、仕組みの怖さを誰よりも知っている」", "speaker": {"name": "カナメ", "color": "#b0c8b0", "role": ""}, "sprites": []}, {"text": "「——それが、私がここを離れられない理由でもある」", "speaker": {"name": "カナメ", "color": "#b0c8b0", "role": ""}, "sprites": []}]}, {"id": "ch04_005_facility", "type": "vn", "bg": "linear-gradient(180deg,#f4f4f8,#e8e8f0)", "beats": [{"text": "カナメの案内で、記憶局の施設に入った。\n白い廊下。清潔な端末。\nアンログの街とは何もかもが逆だった。", "speaker": null, "sprites": []}, {"text": "「人の気配が、薄い」\nトウが言った。", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「ほとんどが自動化されている」\n「人が決断する前に、システムが処理する」", "speaker": {"name": "カナメ", "color": "#b0c8b0", "role": ""}, "sprites": []}, {"text": "ガラス越しに、観測室が見えた。\nベッドに横たわる人たち——白層化患者。\n端末が淡く光りながら、状態を記録し続けていた。", "speaker": null, "sprites": []}, {"text": "「保護、されてる」\nミオが呟いた。", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「そう」\nカナメは窓から目を離さなかった。\n「保護、という言葉で」", "speaker": {"name": "カナメ", "color": "#b0c8b0", "role": ""}, "sprites": []}]}, {"id": "ch04_006_mothers_record", "type": "phone", "messages": [{"from": "白峰記憶局 / 調整医療部", "text": [{"t": "対象記録 閲覧モード"}], "delay": 600}, {"from": "対象記録", "text": [{"t": "状態: 安定\n感情反応: 未検出\n面会記録: 保持\n調整医療部: 定期観測中\n処理区分: "}, {"b": "時計塔同期事故関連"}, {"t": "\n閲覧制限: "}, {"b": "上位承認必要"}], "delay": 1200}], "next": "ch04_006b_after_record"}, {"id": "ch04_006b_after_record", "type": "vn", "bg": "linear-gradient(180deg,#1a1c28,#10121c)", "beats": [{"text": "「時計塔同期事故関連……」\nトウの手が止まった。", "speaker": null, "sprites": []}, {"text": "「お母さんの仮死状態は、単なる事故じゃなかった」\n「時計塔事件と関係している」", "speaker": {"name": "カナメ", "color": "#b0c8b0", "role": ""}, "sprites": []}, {"text": "「なんで、それを——」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「私がトウの父と同じチームにいたから」\n「事件の直後、彼はこの記録を見ようとした」\n「でもその後、姿を消した」", "speaker": {"name": "カナメ", "color": "#b0c8b0", "role": ""}, "sprites": []}, {"text": "トウは画面を見つめたまま、何も言えなかった。\n（記録には「事故」と書かれていない。\nでも、「時計塔同期事故関連」とは書かれている。\n一体、何があった。）", "speaker": null, "sprites": []}]}, {"id": "ch04_007_hardliner", "type": "vn", "bg": "linear-gradient(180deg,#f4f4f8,#e8e8f0)", "beats": [{"text": "廊下の奥から、足音が聞こえた。\n記憶局の上層部らしき人物が近づいてくる。", "speaker": null, "sprites": []}, {"text": "「対象Mを確認した」\n「カナメ解析官、対象を引き渡してください」\n「これは保護処置です」", "speaker": {"name": "記憶局上層", "color": "#909090", "role": ""}, "sprites": []}, {"text": "「対象の意思は？」\nトウが言った。", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「異常値の意思は、安定後に確認されます」\n「現時点では、社会全体の安全が優先されます」", "speaker": {"name": "記憶局上層", "color": "#909090", "role": ""}, "sprites": []}, {"text": "（正しい言葉だ。\nでも、この言葉の中に、ミオの名前はない。\nミオは「対象」で、「異常値」で、「保護処置の対象」だ。\nミオじゃない。）", "speaker": null, "sprites": [
