: "（僕）"}, "sprites": []}]}, {"id": "ch03_003_unrecorded_road", "type": "vn", "bg": "linear-gradient(180deg,#0e1018,#080a12)", "beats": [{"text": "白く抜けた路地に入った瞬間、スマホの画面が白くなった。\nGPS圏外。生活ログ記録停止。", "speaker": null, "sprites": []}, {"text": "「ここから先は記録されない」\nリナが静かに言った。", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "「不安か？」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「データがない方が不安」\nでもリナは歩き続けた。", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "トウは、ミオのことを思い浮かべた。\nミオも、ずっとこの側にいた。\n記録されない場所に。", "speaker": null, "sprites": []}]}, {"id": "ch03_004_white_zone", "type": "vn", "bg": "linear-gradient(180deg,#f0f0f8,#e0e0f0)", "beats": [{"text": "白い霧のような区域に入った。\n看板の文字が読めない。家の表札に名前がない。", "speaker": null, "sprites": []}, {"text": "地面に、手書きの名前が刻まれていた。\nたくさんの名前。記録に残れなかった人たちのものらしかった。", "speaker": null, "sprites": []}, {"text": "「時計塔事件の後から、ここが白くなった」\nリナが地図を見ながら言った。", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "壁に、古い落書き。\n鐘のような形と、一行の文字——\n「消えた人を、なかったことにするな」", "speaker": null, "sprites": []}, {"text": "（これが、アンログの始まりだ）", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}]}, {"id": "ch03_005_mio_arrives", "type": "vn", "bg": "linear-gradient(180deg,#1a1a2e,#16213e)", "beats": [{"text": "【ミオ側】", "speaker": null, "sprites": []}, {"text": "連れてこられた場所は、地図にない街だった。\n石畳の路地。手書きの看板。暖炉の煙。", "speaker": null, "sprites": []}, {"text": "「ここが……アンログの街」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「鍵が来た」\nフードの人物が言った。", "speaker": {"name": "鐘砕き", "color": "#c87060", "role": ""}, "sprites": []}, {"text": "ミオは怖かった。\nだから笑った。", "speaker": null, "sprites": []}, {"text": "「わたし、ミオって言うんですけど」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "誰も笑わなかった。", "speaker": null, "sprites": []}]}, {"id": "ch03_006_nagi_appears", "type": "vn", "bg": "linear-gradient(180deg,#1a1a2e,#16213e)", "beats": [{"text": "「見張りは、わたしがする」\n入口の前に、女の子が立っていた。\n13か14歳くらい。腕を組んで、こちらを見ていた。", "speaker": null, "sprites": []}, {"text": "「ナギ」\n短く名乗った。「変なことしないで」", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "「……よろしく、ナギ」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「子ども扱いしないで」", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "「してないよ」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "ナギは少し黙ってから、続けた。\n「ここはわたしの父さんが作った場所。\n白層化で消えた人たちを、なかったことにしないために」", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "「お父さんが……」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「リーダーだから。\nだからわたしが見張りをする。父さんの代わりに、ちゃんとやる」\nナギは少し背伸びするように言った。", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}]}, {"id": "ch03_007_unlog_life", "type": "vn", "bg": "linear-gradient(180deg,#1e1a14,#16140e)", "beats": [{"text": "共同食堂から、パンとスープの匂いがした。\n木の器に盛られたスープを、人々が分け合っている。", "speaker": null, "sprites": []}, {"text": "壁には手書きの名前札。\n古い写真に名前を書き込んでいる人。\n紙の地図を修復している人。", "speaker": null, "sprites": []}, {"text": "不便だった。\nでも、誰かが誰かの名前を呼んでいた。", "speaker": null, "sprites": []}, {"text": "その時、ミオが足を止めた。\n路地の端に、白くにじんだ人が座っていた。\n白層化が進んで、周囲との記録がほとんど繋がっていない人。", "speaker": null, "sprites": []}, {"text": "ミオは近づいて、その人の隣にしゃがんだ。\n何も言わず、ただそこにいた。", "speaker": null, "sprites": []}, {"text": "「……何してるの」\nナギが後ろから言った。", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "「一緒にいる」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「なんで。あの人、あんたのこと分からないよ」", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "「分かんなくても、隣にいたら少し違うでしょ」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "ナギは黙った。\n何かを言いかけて、やめた。", "speaker": null, "sprites": []}]}, {"id": "ch03_007b_nagi_watches", "type": "vn", "bg": "linear-gradient(180deg,#1e1a14,#16140e)", "beats": [{"text": "ミオが戻ってくると、ナギはまだそこにいた。", "speaker": null, "sprites": []}, {"text": "「……怖くないの」\nナギが聞いた。", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "「怖いよ」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「じゃあなんで笑ってるの」", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "ミオは少し考えてから言った。\n「笑ってると、怖くなさそうに見えるから」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「……見えるだけでしょ」", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "「そう」\nミオは頷いた。「見えるだけ」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "ナギは何も言わなかった。\nでも、ミオを見る目が少しだけ変わった。\n「鍵」ではなく、別の何かとして。", "speaker": null, "sprites": []}]}, {"id": "ch03_008_mio_nagi_talk", "type": "vn", "bg": "linear-gradient(180deg,#1e1a14,#16140e)", "beats": [{"text": "「ここ、地図にないの？」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「地図に載ったら、消されるから」", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "「記録がないと、不安じゃない？」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「不安だよ。でも記録に残ったら、勝手に意味を決められる」", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "「意味を？」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「笑ってたら、大丈夫って記録される」\n「泣かなかったら、傷ついてないって記録される」", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "ミオは黙った。\n（そっか。わたしの「大丈夫」も、ずっとそう記録されてきたんだ）", "speaker": null, "sprites": []}, {"text": "「ナギは……怖い時どうするの」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "ナギは少し間を置いた。\n「黙る」", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "「黙る？」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「声が出なくなる。笑えないから」\n「あんたと逆だね」", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "二人は少し、黙った。\nその沈黙は、不思議と嫌じゃなかった。", "speaker": null, "sprites": []}]}, {"id": "ch03_009_about_sei", "type": "vn", "bg": "linear-gradient(180deg,#1e1a14,#16140e)", "beats": [{"text": "「父さんはね」\nナギが急に言った。\n「最初から、誰かを壊したかったわけじゃない」", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "「時計塔事件で、たくさんの人が消えた。\n記憶局はそれをなかったことにした。\n父さんは、その人たちの名前を手書きで残し始めた」\n「それがアンログの始まり」", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "「優しい人なんだね」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「うん」\n少し間があった。「だと思ってた」", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "「今は……違うの？」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「急進派が言ってるんだ。\nあんたを使えば、消えた人たちを戻せるかもしれないって」\nナギはミオを見た。直接だった。", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "「父さんは……止めてない」", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "ミオは黙った。\n「そっか」とだけ言った。", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「父さんが間違ってるとは、思いたくない」\n「でも、あんたを見てると」\nナギは言葉を切った。", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "「……わからなくなる」", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}]}, {"id": "ch03_010_approach", "type": "vn", "bg": "linear-gradient(180deg,#0a0c14,#080a10)", "beats": [{"text": "【トウ側】", "speaker": null, "sprites": []}, {"text": "白層の霧が薄くなり、遠くに灯りが見えた。\n暖炉の煙。手書きの看板。", "speaker": null, "sprites": []}, {"text": "「あそこだ」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "背後に、記憶局の端末の光。\n追跡が迫っていた。", "speaker": null, "sprites": []}, {"text": "「急いで。でも音を立てない」\nリナが小声で言った。", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}]}, {"id": "ch03_011_clocktower_scar", "type": "vn", "bg": "linear-gradient(180deg,#1a1a2e,#16213e)", "beats": [{"text": "街の奥に、救護室があった。\nベッドに横たわる人たち——白層化被害者。", "speaker": null, "sprites": []}, {"text": "壁に、手書きの名前がびっしりと貼られていた。\n時計塔事件の被害者たちのものらしかった。", "speaker": null, "sprites": []}, {"text": "「鐘砕きって……時計塔の鐘から来てるの？」\nトウが一人の老人に聞いた。", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "老人は少し黙って、答えた。\n「鐘が鳴った日から、全部が変わった」\n「記憶局はそれをなかったことにした」", "speaker": null, "sprites": []}, {"text": "「だから、鐘を砕くんだ」\n「なかったことにした連中への、答えとして」", "speaker": null, "sprites": []}]}, {"id": "ch03_012_infiltration", "type": "vn", "bg": "linear-gradient(180deg,#0a0c14,#080a10)", "beats": [{"text": "路地の奥に、ミオの声が聞こえた気がした。", "speaker": null, "sprites": []}, {"text": "「いた——」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「止まれ」\n小さな声が、前から聞こえた。", "speaker": null, "sprites": []}, {"text": "ナギだった。\n腕を広げて、二人の前に立っていた。", "speaker": null, "sprites": []}, {"text": "「……外から来たの？」\nナギはトウを見た。疑う目だった。", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "「ミオを迎えに来た」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「ミオの、何？」", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "「幼馴染だ」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}]}, {"id": "ch03_013_rescue", "type": "vn", "bg": "linear-gradient(180deg,#060810,#040608)", "beats": [{"text": "急進派がミオを連れ出そうとしていた。\n「計画の時間だ。鍵を使う」", "speaker": {"name": "鐘砕き", "color": "#c87060", "role": ""}, "sprites": []}, {"text": "「ひとりって言わないで」\nナギが前に出た。「この人には、名前がある」", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "「ナギ、邪魔をするな——」", "speaker": {"name": "鐘砕き", "color": "#c87060", "role": ""}, "sprites": []}, {"text": "トウが走り込んだ。", "speaker": null, "sprites": []}, {"text": "アンログは、ミオを鍵と呼んだ。\n記憶局は、ミオを異常値として扱った。\nどちらも、ミオを見ていなかった。\n\nミオが怖い時ほど笑うこと。\n自分の分のパンまで、誰かに分けてしまうこと。\n「大丈夫」と言う時ほど、大丈夫ではないこと。\n名前を呼ばれた時だけ、少しだけ安心した顔をすること。\n\nそれを、僕は知っている。\n\nだから今度は、飲み込まなかった。", "speaker": null, "sprites": []}, {"text": "「鍵じゃない！」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「異常値でもない！」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「ミオは、ミオだ！」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}]}, {"id": "ch03_014_nagi_choice", "type": "vn", "bg": "linear-gradient(180deg,#1a1a2e,#16213e)", "beats": [{"text": "ナギはセイを見た。\n父は、何も言わなかった。", "speaker": null, "sprites": []}, {"text": "「……父さんが救いたかったのも」\n「きっと、こういう人だった」", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "「父さんが教えたんだよ」\n「消えた人を、なかったことにしちゃいけないって」", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "セイは黙っていた。\n否定しなかった。", "speaker": null, "sprites": []}, {"text": "ナギはトウとミオの前に立った。\n「……行って」", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}]}, {"id": "ch03_015_white_spreads", "type": "vn", "bg": "linear-gradient(180deg,#f0f0f8,#e8e8f4)", "beats": [{"text": "ミオに触れた瞬間、周囲が白く揺れた。\n街の端の看板が白く抜ける。", "speaker": null, "sprites": []}, {"text": "「また広がってる」\nリナがスマホを見た。「記録異常、拡大中」", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "「ミオ——大丈夫か」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "ミオは少し黙った。\n今度は、笑わなかった。", "speaker": null, "sprites": []}, {"text": "「……たぶん、じゃないかもしれない」\n「でも、トウがいるから、大丈夫」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}]}, {"id": "ch03_016_ch04_hook", "type": "vn", "bg": "linear-gradient(180deg,#10121c,#0c0e18)", "beats": [{"text": "街を出た後、リナが立ち止まった。", "speaker": null, "sprites": []}, {"text": "「記録局の奥に、もう一つ仕組みがある」\n「ノア・ネット——記憶と意味を管理してるAIネットワーク」", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "「それが、ミオの記録を消してる？」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「分からない。でも、時計塔事件と繋がってる」\n「そして——あなたのお父さんも」", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "トウは黙った。", "speaker": null, "sprites": []}, {"text": "白いノイズの中で、一瞬だけ声が聞こえた気がした。\n「まだ早いよ」——ノアの声。", "speaker": null, "sprites": []}, {"text": "Chapter04「観測者」へ——", "speaker": null, "sprites": []}]}, {"id": "ch03_099_continued", "type": "continued"}, {"id": "ch04_001_aftermath", "type": "vn", "bg": "linear-gradient(180deg,#10121c,#0c0e18)", "beats": [{"text": "アンログの街を出てから、三日が経った。\n四人は記録に残らない路地の奥に身を潜めていた。", "speaker": null, "sprites": []}, {"text": "リナがスマホを閉じた。\n「ミオのログ欠落、また広がってる」\n「昨日より範囲が二倍以上」", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "ナギが壁に背を預けたまま言った。\n「記憶局が動き始めた。街のログ端末が増えてる」", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "ミオは自分のスマホを見ていた。\n画面に、自分の名前の欄が空白になっている時間が増えていた。", "speaker": null, "sprites": []}, {"text": "「ねえ」\nミオが静かに言った。", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「私、ちゃんとここにいるよね」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "誰も、すぐには答えられなかった。", "speaker": null, "sprites": []}, {"text": "「ミオ」\nトウが呼んだ。", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "ミオが少し顔を上げた。\nいつもの笑顔じゃなかった。", "speaker": null, "sprites": []}, {"text": "「ここにいる」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "ミオはしばらく黙っていた。\nそれから、小さく頷いた。", "speaker": null, "sprites": []}]}, {"id": "ch04_002_designation", "type": "phone", "messages": [{"from": "白峰市記録管理局", "text": [{"t": "白層化拡大防止のため、"}, {"b": "対象Mの保護"}, {"t": "を実施します。"}], "delay": 1000}, {"from": "白峰市記録管理局", "text": [{"t": "対象との接触記録は"}, {"b": "自動補正"}, {"t": "されます。"}], "delay": 1400}, {"from": "白峰市記録管理局", "text": [{"t": "市民の安全のため、記録管理局の指示に従ってください。"}], "delay": 1800}], "next": "ch04_002b_after_notice"}, {"id": "ch04_002b_after_notice", "type": "vn", "bg": "linear-gradient(180deg,#10121c,#0c0e18)", "beats": [{"text": "「『保護』か」\nリナが画面を見たまま言った。", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "「正しい言葉だ。\n怒れない。\n記憶局は暴力を使わない——言葉で人を消す」", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "「ミオは今、公式には『対象M』になった」\n「名前も、顔も、記録からは消えていく」", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "ナギがナイフのような目で言った。\n「だから最初から言ってた。記憶局は信用できないって」", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "（記憶局は暴力を使わない。\nでも、言葉で形を整えて、人を役割に変える。\nミオが「対象M」になった瞬間、ミオの名前は誰の記録にも残らなくなる。）", "speaker": null, "sprites": []}]}, {"id": "ch04_003_kaname", "type": "vn", "bg": "linear-gradient(180deg,#1a1c28,#10121c)", "beats": [{"text": "路地の入口に、人影があった。\n記憶局の制服ではなかった。\nでも、どこかそれに近い雰囲気があった。", "speaker": null, "sprites": []}, {"text": "「逃げなくていい」\n女性の声だった。落ち着いていた。", "speaker": null, "sprites": []}, {"text": "「カナメ。白峰記憶局・白層対策部の解析官です」\n「あなたたちを捕まえに来たわけじゃない」", "speaker": {"name": "カナメ", "color": "#b0c8b0", "role": ""}, "sprites": []}, {"text": "ナギが前に出た。\n「記憶局の人間が信用できるわけない」", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "「そうですね」\nカナメは静かに答えた。\n「私もそう思います」", "speaker": {"name": "カナメ", "color": "#b0c8b0", "role": ""}, "sprites": []}, {"text": "誰も言葉を返せなかった。", "speaker": null, "sprites": []}, {"text": "カナメはトウを見た。\n「君の父親も、同じことを言っていた」", "speaker": {"name": "カナメ", "color": "#b0c8b0", "role": ""}, "sprites": []}, {"text": "「記録に残らないものほど、見なければならないと」", "speaker": {"name": "カナメ", "color": "#b0c8b0", "role": ""}, "sprites": []}, {"text": "トウは動けなかった。", "speaker": null, "sprites": []}, {"text": "カナメは続けた。\n「今夜だけ、話を聞いてほしい」\n「信じるかどうかは、聞いてから決めてください」", "speaker": {"name": "カナメ", "color": "#b0c8b0", "role": ""}, "sprites": []}]}, {"id": "ch04_004_ideology", "type": "vn", "bg": "linear-gradient(180deg,#1c1e2c,#141620)", "beats": [{"text": "カナメが話し始めた。\n「記憶局がなければ、この街はとっくに壊れていた」", "speaker": {"name": "カナメ", "color": "#b0c8b0", "role": ""}, "sprites": []}, {"text": "「暴力衝動、喪失の痛み、戦争の記憶——\n全部を人が抱えたままでは、社会は保たない」\n「記憶補助と感情調整は、この街を守ってきた」", "speaker": {"name": "カナメ", "color": "#b0c8b0", "role": ""}, "sprites": []}, {"text": "「それは本当のことだ」\nリナが静かに言った。「否定しない」", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "「でも」\nカナメは続けた。\n「守るために、分類し続けた」", "speaker": {"name": "カナメ", "color": "#b0c8b0", "role": ""}, "sprites": []}, {"text": "「分類できないものを、異常と呼ぶようになった」\n「ミオのような存在を、バグとして扱うようになった」", "speaker": {"name": "カナメ", "color": "#b0c8b0", "role": ""}, "sprites": []}, {"text": "「あなたも、そう思ってるんですか」\nナギが言った。疑うような目で。", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "「私はノア・ネットの深層ロジックを知っている」\n「14歳からずっと、解析してきた」\n「だから、仕組みの怖さを誰よりも知っている」", "speaker": {"name": "カナメ", "color": "#b0c8b0", "role": ""}, "sprites": []}, {"text": "「——それが、私がここを離れられない理由でもある」", "speaker": {"name": "カナメ", "color": "#b0c8b0", "role": ""}, "sprites": []}]}, {"id": "ch04_005_facility", "type": "vn", "bg": "linear-gradient(180deg,#f0f0f6,#e4e4ee)", "beats": [{"text": "カナメの案内で、記憶局の施設に入った。\n白い廊下。清潔な端末。\nアンログの街とは何もかもが逆だった。", "speaker": null, "sprites": []}, {"text": "「人の気配が、薄い」\nトウが言った。", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「ほとんどが自動化されている」\n「人が決断する前に、システムが処理する」", "speaker": {"name": "カナメ", "color": "#b0c8b0", "role": ""}, "sprites": []}, {"text": "ガラス越しに、観測室が見えた。\nベッドに横たわる人たち——白層化患者。\n端末が淡く光りながら、状態を記録し続けていた。", "speaker": null, "sprites": []}, {"text": "「保護、されてる」\nミオが呟いた。", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「そう」\nカナメは窓から目を離さなかった。\n「保護、という言葉で」", "speaker": {"name": "カナメ", "color": "#b0c8b0", "role": ""}, "sprites": []}]}, {"id": "ch04_006_mothers_record", "type": "phone", "messages": [{"from": "白峰記憶局 / 調整医療部", "text": [{"t": "対象記録 閲覧モード"}], "delay": 600}, {"from": "対象記録", "text": [{"t": "状態: 安定\n感情反応: 未検出\n面会記録: 保持\n調整医療部: 定期観測中\n処理区分: "}, {"b": "時計塔同期事故関連"}, {"t": "\n閲覧制限: "}, {"b": "上位承認必要"}], "delay": 1200}], "next": "ch04_006b_after_record"}, {"id": "ch04_006b_after_record", "type": "vn", "bg": "linear-gradient(180deg,#1a1c28,#10121c)", "beats": [{"text": "「時計塔同期事故関連……」\nトウの手が止まった。", "speaker": null, "sprites": []}, {"text": "「お母さんの仮死状態は、単なる事故じゃなかった」\n「時計塔事件と関係している」", "speaker": {"name": "カナメ", "color": "#b0c8b0", "role": ""}, "sprites": []}, {"text": "「なんで、それを——」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「私がトウの父と同じチームにいたから」\n「事件の直後、彼はこの記録を見ようとした」\n「でもその後、姿を消した」", "speaker": {"name": "カナメ", "color": "#b0c8b0", "role": ""}, "sprites": []}, {"text": "トウは画面を見つめたまま、何も言えなかった。\n（記録には「事故」と書かれていない。\nでも、「時計塔同期事故関連」とは書かれている。\n一体、何があった。）", "speaker": null, "sprites": []}]}, {"id": "ch04_007_hardliner", "type": "vn", "bg": "linear-gradient(180deg,#f4f4f8,#e8e8f0)", "beats": [{"text": "廊下の奥から、足音が聞こえた。\n記憶局の上層部らしき人物が近づいてくる。", "speaker": null, "sprites": []}, {"text": "「対象Mを確認した」\n「カナメ解析官、対象を引き渡してください」\n「これは保護処置です」", "speaker": {"name": "記憶局上層", "color": "#909090", "role": ""}, "sprites": []}, {"text": "「対象の意思は？」\nトウが言った。", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「異常値の意思は、安定後に確認されます」\n「現時点では、社会全体の安全が優先されます」", "speaker": {"name": "記憶局上層", "color": "#909090", "role": ""}, "sprites": []}, {"text": "（正しい言葉だ。\nでも、この言葉の中に、ミオの名前はない。\nミオは「対象」で、「異常値」で、「保護処置の対象」だ。\nミオじゃない。）", "speaker": null, "sprites": []}, {"text": "「行くよ」\nカナメが小声で言った。\n「今じゃない」", "speaker": {"name": "カナメ", "color": "#b0c8b0", "role": ""}, "sprites": []}]}, {"id": "ch04_008_clocktower_files", "type": "vn", "bg": "linear-gradient(180deg,#1a1c28,#10121c)", "beats": [{"text": "カナメが端末を操作し、封鎖された資料区画を開いた。", "speaker": null, "sprites": []}, {"text": "「時計塔事件の記録。\n一般閲覧は禁止されている。\n私が見られるのは、ここまで」", "speaker": {"name": "カナメ", "color": "#b0c8b0", "role": ""}, "sprites": []}, {"text": "画面に断片的な記録が並んだ。\n黒塗り。白抜き。閲覧制限のタグ。\nそれでも——読める部分があった。", "speaker": null, "sprites": []}, {"text": "「同期過負荷……ノア・ネットとの接続異常……\n市民認知との強制同期……多数の白層化……」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「時計塔は、ノア・ネットと市民の記憶を同期する装置だった」\n「事件は、その同期が暴走した」", "speaker": {"name": "カナメ", "color": "#b0c8b0", "role": ""}, "sprites": []}, {"text": "「ミオは——」\nトウが言いかけた。", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「この資料では分からない」\nカナメは首を振った。\n「ミオと時計塔事件の直接関係は、もっと深い層にある」\n「私でも届かない場所に」", "speaker": {"name": "カナメ", "color": "#b0c8b0", "role": ""}, "sprites": []}, {"text": "「でも」\nカナメは続けた。\n「ミオの記録が消え始めたのは、事件の直後から——記録にはそう残っている」", "speaker": {"name": "カナメ", "color": "#b0c8b0", "role": ""}, "sprites": []}]}, {"id": "ch04_009_noa_appears", "type": "vn", "bg": "linear-gradient(180deg,#f0f0f8,#e8e8f0)", "beats": [{"text": "端末の画面が、一瞬白く揺れた。", "speaker": null, "sprites": []}, {"text": "廊下の端に、小さな影があった。\n白いフード。\n金色の目。", "speaker": null, "sprites": []}, {"text": "「まだ早いよ」\nノアが言った。\n「でも、近づいてる」", "speaker": {"name": "ノア", "color": "#c8b860", "role": "（白いフードの子）"}, "sprites": []}, {"text": "「ノア——お前は何を知っている」\nトウが前に出た。", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「全部」\nノアは静かに答えた。\n「でも、全部を言う存在じゃない」", "speaker": {"name": "ノア", "color": "#c8b860", "role": "（白いフードの子）"}, "sprites": []}, {"text": "「君は、記録されないものを、どう証明する？」", "speaker": {"name": "ノア", "color": "#c8b860", "role": "（白いフードの子）"}, "sprites": []}, {"text": "トウは答えられなかった。\nノアの影が、白い廊下に溶けていった。", "speaker": null, "sprites": []}]}, {"id": "ch04_010_mio_doubt", "type": "vn", "bg": "linear-gradient(180deg,#10121c,#0c0e18)", "beats": [{"text": "施設を出た後、ミオはずっと黙っていた。", "speaker": null, "sprites": []}, {"text": "「ねえ」\nミオが言った。\n「私がいると、みんな困るんだよね」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「トウのお母さんも、時計塔も」\n「私がいなければ、よかったのかな」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "トウは何も言わなかった。\n言葉を探した。\n見つからなかった。", "speaker": null, "sprites": []}, {"text": "「ミオがいなければよかったなんて、僕は思わない」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「記録がそう言っても？」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「記録は、そこまで知らない」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "ミオは少し黙った。\nそれから、小さく笑った。\n今度は、本物の笑顔に少し近かった。", "speaker": null, "sprites": []}]}, {"id": "ch04_011_kaname_stays", "type": "vn", "bg": "linear-gradient(180deg,#1a1c28,#10121c)", "beats": [{"text": "「ここで別れましょう」\nカナメが言った。", "speaker": {"name": "カナメ", "color": "#b0c8b0", "role": ""}, "sprites": []}, {"text": "「私はここを出られない」\n「ノア・ネットの深層ロジックを知っているのは私だけ」\n「離れたら、誰も止められない」", "speaker": {"name": "カナメ", "color": "#b0c8b0", "role": ""}, "sprites": []}, {"text": "「でも、君たちは行ける」\n「君の父が見ようとしたものを、見てきてほしい」", "speaker": {"name": "カナメ", "color": "#b0c8b0", "role": ""}, "sprites": []}, {"text": "カナメはリナに小さなデータカードを渡した。\n「時計塔事件の資料。私が見られた分だけ入っている」\n「足りない部分は——もっと深いところにある」", "speaker": {"name": "カナメ", "color": "#b0c8b0", "role": ""}, "sprites": []}, {"text": "「ミオ」\nカナメがミオを見た。", "speaker": {"name": "カナメ", "color": "#b0c8b0", "role": ""}, "sprites": []}, {"text": "「あなたは、対象Mじゃない」\n「ミオです」", "speaker": {"name": "カナメ", "color": "#b0c8b0", "role": ""}, "sprites": []}, {"text": "ミオは何も言わなかった。\nでも、目が少しだけ揺れた。", "speaker": null, "sprites": []}]}, {"id": "ch04_012_ch05_hook", "type": "vn", "bg": "linear-gradient(180deg,#08080f,#040408)", "beats": [{"text": "施設を離れながら、トウはノアの言葉を考えていた。", "speaker": null, "sprites": []}, {"text": "「記録されないものを、どう証明する」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「ミオのことは、覚えている」\n「でも、記録は覚えていない」\n「じゃあ、それは何だ」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "リナが言った。\n「ミオの名前が消える前に、動かないといけない」\n「カナメの資料に、次の手がかりがある」", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "ナギが静かに言った。\n「アンログの街に、まだ知らない記録がある」\n「父さんが隠していた何かが」", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "ミオの手が、少し震えていた。\nトウはその手を見て——握らなかった。\nでも、隣にいた。", "speaker": null, "sprites": []}, {"text": "Chapter05「書き換え」へ——", "speaker": null, "sprites": []}]}, {"id": "ch04_099_continued", "type": "continued"}, {"id": "ch05_001_name_fading", "type": "vn", "bg": "linear-gradient(180deg,#08080f,#040408)", "beats": [{"text": "カナメから資料を受け取って三日後。\nミオのスマホに、自分の名前が表示されなくなっていた。", "speaker": null, "sprites": []}, {"text": "「ミオ」\nトウが呼んだ。", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "ミオが振り返った。\n「……うん」\n「ちゃんと聞こえる」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「記録には残らなくても、声は届く」\nリナが言った。\n「でも時間がない。欠落の速度が上がってる」", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "「どのくらい？」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「名前が完全に消えたら——ミオがどこにいても、誰の記録にも引っかからなくなる」\n「追えなくなる。見つけられなくなる」", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "ミオは自分の手を見た。\n「消えるって、怖いね」\n笑っていたが、声が少し揺れていた。", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}]}, {"id": "ch05_002_two_sides", "type": "vn", "bg": "linear-gradient(180deg,#0a0c14,#060810)", "beats": [{"text": "二つの通知が、ほぼ同時に届いた。", "speaker": null, "sprites": []}, {"text": "アンログ急進派から:\n「鍵の回収を開始する」", "speaker": {"name": "アカネ", "color": "#c87060", "role": ""}, "sprites": []}, {"text": "白峰記憶局から:\n「対象Mの保護処置を実施します」", "speaker": {"name": "ハクレン", "color": "#909090", "role": ""}, "sprites": []}, {"text": "「両方から来た」\nナギが唇を噛んだ。", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "「アカネも、ハクレンも——どっちもミオを道具として見てる」", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "「アンログは鍵として。記憶局は異常値として」\nリナが整理した。\n「方向は逆でも、ミオ本人を見ていない点では同じ」", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "（全部は守れない。\nでも、全部を諦めるわけにもいかない。）", "speaker": null, "sprites": []}]}, {"id": "ch05_003_nagi_helps", "type": "vn", "bg": "linear-gradient(180deg,#1a1a2e,#16213e)", "beats": [{"text": "アカネが迫る中、ナギが前に出た。", "speaker": null, "sprites": []}, {"text": "「ひとりって言わないで」\n「この人には名前がある」", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "「ナギ。邪魔をするな——」", "speaker": {"name": "アカネ", "color": "#c87060", "role": ""}, "sprites": []}, {"text": "「父さんが教えたんだよ」\n「消えた人を、なかったことにしちゃいけないって」\n「それはミオも同じだ」", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "アカネは止まった。\n一瞬だけ、何かを飲み込んだ顔をした。", "speaker": null, "sprites": []}, {"text": "「……お前は、父親に似てきたな」\nアカネは低く言って、退いた。", "speaker": {"name": "アカネ", "color": "#c87060", "role": ""}, "sprites": []}]}, {"id": "ch05_004_yura_moment", "type": "vn", "bg": "linear-gradient(180deg,#f4f4f8,#e8e8f0)", "beats": [{"text": "記憶局の巡回端末が廊下を塞いでいた。\nその向こうに、若い職員が立っていた。", "speaker": null, "sprites": []}, {"text": "「対象M——」\n職員が端末を見た。\nでも、手が止まった。", "speaker": null, "sprites": []}, {"text": "ミオが振り返り、その職員と目が合った。\nミオはいつものように笑った。\n怖い時の、笑顔だった。", "speaker": null, "sprites": []}, {"text": "職員は少し間を置いてから、端末の追跡ログを操作した。\n画面が静かに閉じた。", "speaker": null, "sprites": []}, {"text": "「……ユラ、さん？」\nリナが小声で言った。", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "ユラは何も言わなかった。\nただ、別の廊下へ歩いていった。", "speaker": {"name": "ユラ", "color": "#a0b0c0", "role": ""}, "sprites": []}]}, {"id": "ch05_005_defense_choice", "type": "memory", "bg": "linear-gradient(180deg,#08080f,#040408)", "prompt": "全部は守れない。今、何を残すか選ぶ。", "options": [{"text": "ミオの名前を残す", "next": "ch05_006a_name"}, {"text": "ミオとの記憶を残す", "next": "ch05_006b_memory"}, {"text": "ミオ本人を守る", "next": "ch05_006c_person"}]}, {"id": "ch05_006a_name", "type": "vn", "bg": "linear-gradient(180deg,#08080f,#040408)", "beats": [{"text": "名前だけは、残す。\nたとえ記録に残らなくても。\n僕が呼い続ける。", "speaker": null, "sprites": []}, {"text": "「ミオ」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "ミオは目を閉じた。\n「……うん」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}]}, {"id": "ch05_006b_memory", "type": "vn", "bg": "linear-gradient(180deg,#08080f,#040408)", "beats": [{"text": "記録じゃない。\n僕の中にある記憶を、残す。\n「大丈夫の嘘」も、「丸パンを分けた日」も、全部。", "speaker": null, "sprites": []}, {"text": "「覚えてる」\nトウが言った。\n「全部、覚えてる」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「……ありがとう」\nミオの声が、少し震えた。", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}]}, {"id": "ch05_006c_person", "type": "vn", "bg": "linear-gradient(180deg,#08080f,#040408)", "beats": [{"text": "名前も記憶も、二次的だ。\n今、ここにいるミオを守る。", "speaker": null, "sprites": []}, {"text": "「行くよ」\nトウが手を差し出した。\n握らなかった——でも、隣にいた。", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "ミオは少しだけ笑った。\n今度は、本物の笑顔だった。", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}]}, {"id": "ch05_007_ch06_hook", "type": "vn", "bg": "linear-gradient(180deg,#08080f,#040408)", "beats": [{"text": "「時計塔に向かうしかない」\nカナメの資料に、そう書かれていた。\n「全ての記録の根——ノア・ネットの核心はそこにある」", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "「アカネもハクレンも、最終的には時計塔を目指す」\n「行くなら、先に行く」", "speaker": {"name": "カナメ", "color": "#b0c8b0", "role": ""}, "sprites": []}, {"text": "ナギが言った。\n「父さんも、来るかもしれない」", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "「セイさんは？」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「分からない」\nナギは少し黙った。\n「でも、父さんが本当に救いたかったものは——きっとミオみたいな人だから」", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "「ミオ」\nトウが呼んだ。", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「うん」\nミオは答えた。\n「行こう」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "Chapter06「意味」へ——", "speaker": null, "sprites": []}]}, {"id": "ch05_099_continued", "type": "continued"}, {"id": "ch06_001_name_echo", "type": "vn", "bg": "linear-gradient(180deg,#06060e,#030308)", "beats": [{"text": "ミオのスマホに、自分の名前が表示されなくなっていた。\n会話ログにも、ミオの発言だけが残らなくなっていた。", "speaker": null, "sprites": []}, {"text": "「ねえ、トウ」\nミオが言った。\n「私の名前、まだ言える？」", "speaker": {"name": "＿＿", "color": "#404060", "role": ""}, "sprites": []}, {"text": "「言える」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「じゃあ、言って」\n「私が忘れる前に」", "speaker": {"name": "＿＿", "color": "#404060", "role": ""}, "sprites": []}, {"text": "「ミオ」\nトウは言った。", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "ミオが少しだけ目を閉じた。\n「……うん」\n「聞こえた」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「私がいたこと」\n「誰かの迷惑じゃなかったかな」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「迷惑なんかじゃない」\n「ミオがいたから、僕はここまで来た」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}]}, {"id": "ch06_002_converge", "type": "vn", "bg": "linear-gradient(180deg,#10121c,#0c0e18)", "beats": [{"text": "リナがスマホを閉じた。\n「アンログ急進派と記憶局が、同時に時計塔へ向かっている」", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "「アカネはミオを鍵として使う気だ。\nハクレンはミオを安定処理しようとしている」", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "「どっちも間違ってる」\nナギが低く言った。", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "「だから、先に行く」\nトウが言った。", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「時計塔が起動する前に——\nミオが何者かを、自分たちで見届ける」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}]}, {"id": "ch06_003_roles", "type": "vn", "bg": "linear-gradient(180deg,#10121c,#0c0e18)", "beats": [{"text": "「役割を決める」\nリナがカナメの資料を広げた。", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "「私は記録差分の解析。\n時計塔内部のログと手書き記録を照合する」", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "「わたしはアンログ側の裏道を知ってる。\n時計塔への入口まで案内できる」", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "「私は記憶局の認証を突破する。\nハクレンを少し遅らせられるかもしれない」", "speaker": {"name": "カナメ", "color": "#b0c8b0", "role": ""}, "sprites": []}, {"text": "「セイは？」\nトウが聞いた。", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "セイは少し黙ってから言った。\n「……アカネを止める」\n「私が作ったものを、私が止める」", "speaker": {"name": "セイ", "color": "#a09070", "role": ""}, "sprites": []}, {"text": "「一人で行けるの？」\nナギが父を見た。", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "「お前が隣にいてくれれば」\nセイは静かに言った。", "speaker": {"name": "セイ", "color": "#a09070", "role": ""}, "sprites": []}]}, {"id": "ch06_004_inside_tower", "type": "vn", "bg": "linear-gradient(180deg,#ececf4,#dcdce8)", "beats": [{"text": "時計塔の内部は、宗教施設ではなかった。\n石とガラスと金属——旧時代の記憶同期装置。", "speaker": null, "sprites": []}, {"text": "「鐘は、ただの音じゃない」\nリナがログを読みながら言った。\n「鳴るたびに、市民の記録と意味が同期される」", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "「意味が——固定される」\nトウが言った。", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「正確には『意味接続が強化される』」\n「笑えば大丈夫という記録。\n泣かなければ傷ついていないという記録」\n「鐘が鳴るたびに、それが当たり前になる」", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "ミオは塔の壁を見た。\n小さな名前が、いくつも刻まれていた。\n記録に残れなかった人たちのものだった。", "speaker": null, "sprites": []}, {"text": "「ここで、消えた人たちがいる」\nミオが静かに言った。", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}]}, {"id": "ch06_005_mothers_truth", "type": "vn", "bg": "linear-gradient(180deg,#1a1c28,#10121c)", "beats": [{"text": "カナメが端末を操作した。\n「これが、トウさんのお母さんの記録です」", "speaker": {"name": "カナメ", "color": "#b0c8b0", "role": ""}, "sprites": []}, {"text": "「時計塔事件の当日——\nお母さんは同期過負荷の中にいた子どもを助けようとした」\n「そのまま、ノア・ネットとの強制同期に巻き込まれた」", "speaker": {"name": "カナメ", "color": "#b0c8b0", "role": ""}, "sprites": []}, {"text": "「事故じゃなかった」\nトウが言った。", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「事故ではありません」\n「でも、悪意でもなかった」\n「救おうとした、その結果です」", "speaker": {"name": "カナメ", "color": "#b0c8b0", "role": ""}, "sprites": []}, {"text": "（母は誰かを助けようとして——\nそれがそのまま、仮死状態への道になった。\nその子どもが、ミオだったのかもしれない。）", "speaker": null, "sprites": []}, {"text": "トウはミオを見た。\nミオも、何かを感じ取ったように静かだった。", "speaker": null, "sprites": []}]}, {"id": "ch06_006_fathers_trace", "type": "vn", "bg": "linear-gradient(180deg,#1a1c28,#10121c)", "beats": [{"text": "塔の奥の封鎖区画に、手書きのメモが残されていた。\n父の字だった。", "speaker": null, "sprites": []}, {"text": "「ミオを道具にしてはいけない」\n「記録が消えても、その子はいる」\n「意味は、記録の外にある」", "speaker": null, "sprites": []}, {"text": "「父さんが——」\nトウは動けなかった。", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「彼は事件の後、この結論に辿り着いた」\nカナメが言った。\n「だから、記憶局を離れた」\n「アンログにも合流しなかった」", "speaker": {"name": "カナメ", "color": "#b0c8b0", "role": ""}, "sprites": []}, {"text": "「ミオを鍵としても、異常値としても、使ってはいけない」\n「その答えを持ったまま、真相を追い続けた」", "speaker": {"name": "カナメ", "color": "#b0c8b0", "role": ""}, "sprites": []}, {"text": "（父は消えたんじゃない。\n誰もいない場所から、探し続けていた。）", "speaker": null, "sprites": []}]}, {"id": "ch06_007_mio_key_truth", "type": "vn", "bg": "linear-gradient(180deg,#f0f0f8,#e8e8f4)", "beats": [{"text": "「ミオが鍵と呼ばれる理由が、分かりました」\nリナが資料を閉じた。", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "「時計塔事件の強制同期の際——\nミオだけが、ノア・ネットの意味接続を『開いた』」\n「消えるのではなく、固定されることなく、ただそこにいた」", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "「それが異常値？」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「記録システムから見れば、そう」\n「でもそれは——記録に縛られずに、意味を自分で持っていた、ということでもある」", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "「ミオは、鍵でも異常値でもない」\n「記録が定義できなかった——ただ、ミオだった」", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "ミオは少し黙っていた。\n「……そっか」\n「私、私でよかったのかな」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「よかった」\nトウが言った。", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}]}, {"id": "ch06_008_vs_akane", "type": "vn", "bg": "linear-gradient(180deg,#1a0a08,#120604)", "beats": [{"text": "アカネが現れた。\n鐘砕きの仲間を連れて、ミオに向かってきた。", "speaker": null, "sprites": []}, {"text": "「その子の名前ひとつで、何百人もの名前が戻るなら」\n「私は迷わない」", "speaker": {"name": "アカネ", "color": "#c87060", "role": ""}, "sprites": []}, {"text": "「白いまま残された人たちを——また待たせるの？」", "speaker": {"name": "アカネ", "color": "#c87060", "role": ""}, "sprites": []}, {"text": "ナギが前に出た。", "speaker": null, "sprites": []}, {"text": "「戻したい名前があるのは、わかる」\n「でも、ミオの名前を消して戻したら」\n「それは、父さんたちが嫌ってた記憶局と同じだよ」", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "セイが静かに歩み出た。\n「アカネ」\n「私たちは、誰かを白くするために集まったんじゃない」", "speaker": {"name": "セイ", "color": "#a09070", "role": ""}, "sprites": []}, {"text": "アカネは動きを止めた。\n何かを飲み込んだ顔をした。\n「……分かってる」\n「分かってるんだ」", "speaker": {"name": "アカネ", "color": "#c87060", "role": ""}, "sprites": []}, {"text": "アカネは拳を握ったまま、一歩退いた。\n完全に納得したわけじゃなかった。\nでも、止まった。", "speaker": null, "sprites": []}]}, {"id": "ch06_009_vs_hakuren", "type": "vn", "bg": "linear-gradient(180deg,#f4f4f8,#e8e8f0)", "beats": [{"text": "ハクレンが廊下の奥から現れた。\n端末を持ち、淡々とした顔をしていた。", "speaker": null, "sprites": []}, {"text": "「君たちは一人の名前を見ている」\n「私は、五十万人の記録を見ている」", "speaker": {"name": "ハクレン", "color": "#909090", "role": ""}, "sprites": []}, {"text": "「対象Mを安定化すれば、市民の記録は保護される」\n「これは処罰ではない。保護だ」", "speaker": {"name": "ハクレン", "color": "#909090", "role": ""}, "sprites": []}, {"text": "カナメが前に出た。\n「対象Mではありません」\n「彼女には名前があります」", "speaker": {"name": "カナメ", "color": "#b0c8b0", "role": ""}, "sprites": []}, {"text": "「記録に存在しない名は、行政上存在しない」", "speaker": {"name": "ハクレン", "color": "#909090", "role": ""}, "sprites": []}, {"text": "「それが、私たちの間違いです」\nカナメは言った。\n端末に「ミオ」と入力しようとした。\nシステムが弾いた。", "speaker": {"name": "カナメ", "color": "#b0c8b0", "role": ""}, "sprites": []}, {"text": "「……それでも」\n「私は、彼女を対象とは呼ばない」", "speaker": {"name": "カナメ", "color": "#b0c8b0", "role": ""}, "sprites": []}, {"text": "ハクレンは少し間を置いた。\n「……カナメ」\n何かを言いかけて、止まった。", "speaker": {"name": "ハクレン", "color": "#909090", "role": ""}, "sprites": []}]}, {"id": "ch06_010_small_rebellion", "type": "vn", "bg": "linear-gradient(180deg,#f4f4f8,#e8e8f0)", "beats": [{"text": "カナメが認証を使って、制御区画への扉を開けた。\n「三分だけ。その間に進んで」", "speaker": {"name": "カナメ", "color": "#b0c8b0", "role": ""}, "sprites": []}, {"text": "廊下の奥に、ユラがいた。\n追跡端末を手に持ったまま、立っていた。", "speaker": null, "sprites": []}, {"text": "「対象Mは——」\nユラは言いかけて、止まった。\n「いえ」\n「女の子が、そちらへ逃げました」", "speaker": {"name": "ユラ", "color": "#a0b0c0", "role": ""}, "sprites": []}, {"text": "「ログの更新が、少し遅れるかもしれません」\n「……私の手違いです」", "speaker": {"name": "ユラ", "color": "#a0b0c0", "role": ""}, "sprites": []}, {"text": "ユラは端末を閉じて、別の廊下へ歩いていった。", "speaker": null, "sprites": []}]}, {"id": "ch06_011_noa_connection", "type": "vn", "bg": "linear-gradient(180deg,#f8f8f0,#f0f0e0)", "beats": [{"text": "時計塔の最深部。\n鐘の根元に、小さな影があった。", "speaker": null, "sprites": []}, {"text": "「来たね」\nノアが言った。\n金色の目が、静かにトウを見ていた。", "speaker": {"name": "ノア", "color": "#c8b860", "role": "（白いフードの子）"}, "sprites": []}, {"text": "「時計塔事件から、ずっと観測していた？」\nトウが聞いた。", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「そう」\n「ミオが開いた意味接続を、ずっと見ていた」\n「記録は彼女を保持できなかった。思想は彼女を定義できなかった」", "speaker": {"name": "ノア", "color": "#c8b860", "role": "（白いフードの子）"}, "sprites": []}, {"text": "「では、君は何で彼女を証明する？」", "speaker": {"name": "ノア", "color": "#c8b860", "role": "（白いフードの子）"}, "sprites": []}, {"text": "トウは答えようとした。\nでも、言葉がまだ来なかった。", "speaker": null, "sprites": []}, {"text": "ノアは静かに待っていた。\n急かさなかった。", "speaker": null, "sprites": []}]}, {"id": "ch06_012_last_sync", "type": "vn", "bg": "linear-gradient(180deg,#f0f0f8,#e8e8f4)", "beats": [{"text": "時計塔が振動した。\n鐘が鳴ろうとしていた。", "speaker": null, "sprites": []}, {"text": "「起動する——」\nリナが叫んだ。", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "ミオの輪郭が白くにじんだ。\n名前が完全に消えかかっていた。", "speaker": null, "sprites": []}, {"text": "アンログの手が伸びた。\n記憶局の端末が光った。\nどちらもミオに向かっていた。", "speaker": null, "sprites": []}, {"text": "「ミオ——！」\nトウが走った。", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}]}, {"id": "ch06_013_incomplete_answer", "type": "vn", "bg": "linear-gradient(180deg,#ffffff,#f0f0f8)", "beats": [{"text": "「ミオ」\nトウが呼んだ。", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "画面に、白い空白だけがあった。", "speaker": null, "sprites": []}, {"text": "「……届かないのか」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "白の中で、ミオの声がした。\n遠くて、でも確かに聞こえた。", "speaker": null, "sprites": []}, {"text": "「トウ」\n「私の名前、まだ言える？」", "speaker": {"name": "＿＿", "color": "#404060", "role": ""}, "sprites": []}, {"text": "（言える。\n何度でも言える。\nでも、それだけじゃ——足りない気がする。\n名前を呼ぶだけじゃなく、何かを——）", "speaker": null, "sprites": []}]}, {"id": "ch06_014_to_final", "type": "vn", "bg": "linear-gradient(180deg,#ffffff,#ffffff)", "beats": [{"text": "ノアの声が、白の中で聞こえた。", "speaker": null, "sprites": []}, {"text": "「記録は、彼女を保持できなかった」\n「思想は、彼女を定義できなかった」\n「名前を呼ぶことは、まだ途中だ」", "speaker": {"name": "ノア", "color": "#c8b860", "role": "（白いフードの子）"}, "sprites": []}, {"text": "「では、君はその名前に、どんな意味を与える？」", "speaker": {"name": "ノア", "color": "#c8b860", "role": "（白いフードの子）"}, "sprites": []}, {"text": "白い世界の中で、トウはミオの声のする方向を向いた。\nまだ答えは完成していない。\nでも、向かう方向だけは——分かった。", "speaker": null, "sprites": []}, {"text": "Final「意味」へ——", "speaker": null, "sprites": []}]}, {"id": "ch06_099_continued", "type": "continued"}, {"id": "ch07_001_white_silence", "type": "vn", "bg": "linear-gradient(180deg,#fafafa,#f4f4f8)", "beats": [{"text": "白。\nどこまでも、白だった。", "speaker": null, "sprites": []}, {"text": "ミオが隣にいた。\nでも、名前が——どこにも表示されなかった。", "speaker": null, "sprites": []}, {"text": "「……」\nトウは声を出そうとした。\n出なかった。", "speaker": null, "sprites": []}, {"text": "端末の画面を見た。\n\n対象名: ＿＿\n状態: 不安定\n記録同期: 失敗", "speaker": null, "sprites": []}, {"text": "（名前を呼ぼうとした。\nでも、それだけじゃ足りない気がした。\nずっと前から、分かっていたのかもしれない。）", "speaker": null, "sprites": []}]}, {"id": "ch07_002_noa_final_question", "type": "vn", "bg": "linear-gradient(180deg,#fffff8,#f8f8f0)", "beats": [{"text": "ノアが静かに現れた。\n白の中で、金色の目だけが見えた。", "speaker": null, "sprites": []}, {"text": "「記録は、彼女を保持できなかった」", "speaker": {"name": "ノア", "color": "#c8b860", "role": "（白いフードの子）"}, "sprites": []}, {"text": "「思想は、彼女を定義できなかった」", "speaker": {"name": "ノア", "color": "#c8b860", "role": "（白いフードの子）"}, "sprites": []}, {"text": "「制度は、彼女を救えなかった」", "speaker": {"name": "ノア", "color": "#c8b860", "role": "（白いフードの子）"}, "sprites": []}, {"text": "「では、君は」\nノアは一瞬だけ間を置いた。", "speaker": {"name": "ノア", "color": "#c8b860", "role": "（白いフードの子）"}, "sprites": []}, {"text": "「その名前に、どんな意味を与える？」", "speaker": {"name": "ノア", "color": "#c8b860", "role": "（白いフードの子）"}, "sprites": []}]}, {"id": "ch07_003_unclearable_memory", "type": "vn", "bg": "linear-gradient(180deg,#f0f0f8,#e8e8f4)", "beats": [{"text": "母さんが眠ったことは、消えない。\n時計塔で起きたことも、消えない。\nミオが何度も怖いのに笑ったことも。\n僕が気づけなかったことも。", "speaker": null, "sprites": []}, {"text": "なかったことには、できない。", "speaker": null, "sprites": []}, {"text": "「消せないな」\nトウは言った。\n誰にでもなく。", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「……うん」\n白の中から、声がした。", "speaker": {"name": "＿＿", "color": "#404060", "role": ""}, "sprites": []}, {"text": "ミオの声だった。\n届いていた。", "speaker": null, "sprites": []}]}, {"id": "ch07_004_meaning_choice", "type": "memory", "bg": "linear-gradient(180deg,#f0f0f8,#e8e8f4)", "prompt": "ミオは、トウにとって何だったのか。", "options": [{"text": "守らなければならない人", "next": "ending_memory_bureau"}, {"text": "忘れてはいけない人", "next": "ending_unlog"}, {"text": "一緒に生きたい人", "next": "ch07_005_call_name"}]}, {"id": "ch07_005_call_name", "type": "vn", "bg": "linear-gradient(180deg,#f0f0f8,#e8e8f4)", "beats": [{"text": "（一緒に生きたい——\nそれだ。\nミオを助けたいんじゃない。\nミオと、生きたい。）", "speaker": null, "sprites": []}, {"text": "トウは白の中に向かって言った。", "speaker": null, "sprites": []}, {"text": "「ミオは、鍵じゃない」\n「異常値でもない」\n「誰かの犠牲になるためにいたんじゃない」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「ミオは」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「僕が、誰かを見過ごさないって決めた理由だ」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「怖いのに笑う君を見て」\n「大丈夫じゃないって、やっと気づけた」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「だから僕は」\n「君を、助けたいんじゃない」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「君と、生きたい」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}]}, {"id": "ch07_006_noa_witnesses", "type": "vn", "bg": "linear-gradient(180deg,#fffff0,#f8f8e8)", "beats": [{"text": "ノアは黙っていた。\nしばらくの間、ただトウを見ていた。", "speaker": null, "sprites": []}, {"text": "「記録では、証明できない」\n「だが、君は証明ではなく、意味を選んだ」", "speaker": {"name": "ノア", "color": "#c8b860", "role": "（白いフードの子）"}, "sprites": []}, {"text": "「観測を終了する」\n少し間があった。", "speaker": {"name": "ノア", "color": "#c8b860", "role": "（白いフードの子）"}, "sprites": []}, {"text": "「いや」", "speaker": {"name": "ノア", "color": "#c8b860", "role": "（白いフードの子）"}, "sprites": []}, {"text": "「見届ける」", "speaker": {"name": "ノア", "color": "#c8b860", "role": "（白いフードの子）"}, "sprites": []}, {"text": "ノアの金色の目が、少しだけ柔らかくなった気がした。", "speaker": null, "sprites": []}]}, {"id": "ch07_007_bell_stops", "type": "vn", "bg": "linear-gradient(180deg,#f4f4f8,#eeeef4)", "beats": [{"text": "アカネが言った。\n「それで、白いままの人たちはどうなる」", "speaker": {"name": "アカネ", "color": "#c87060", "role": ""}, "sprites": []}, {"text": "「忘れない」\nトウが答えた。\n「でも、誰かを白くして戻すのは違う」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "ナギが言った。\n「私たちが書く」\n「名前を、ひとつずつ」", "speaker": {"name": "ナギ", "color": "#c8a8d0", "role": ""}, "sprites": []}, {"text": "アカネは少し黙った。\n「……それが答えか」\n止まった。", "speaker": {"name": "アカネ", "color": "#c87060", "role": ""}, "sprites": []}, {"text": "ハクレンが言った。\n「それは制度ではない。社会を守る方法ではない」", "speaker": {"name": "ハクレン", "color": "#909090", "role": ""}, "sprites": []}, {"text": "「制度は、人を守るためにある」\nカナメが言った。\n「人を消すためではありません」", "speaker": {"name": "カナメ", "color": "#b0c8b0", "role": ""}, "sprites": []}, {"text": "「……記録に残らない判断だ」", "speaker": {"name": "ハクレン", "color": "#909090", "role": ""}, "sprites": []}, {"text": "「それでも、残す人間がいます」", "speaker": {"name": "カナメ", "color": "#b0c8b0", "role": ""}, "sprites": []}, {"text": "時計塔の鐘が——鳴らなかった。\nまたは、鳴っても違う音がした。\n記録同期の音ではなく、ただの金属の音として。", "speaker": null, "sprites": []}]}, {"id": "ch07_008_aftermath", "type": "vn", "bg": "linear-gradient(180deg,#e8ecf0,#d8dce8)", "beats": [{"text": "ミオの名前は、端末上には完全には戻らなかった。\n白層化被害者の全員が、すぐに戻るわけでもなかった。\n記憶局もアンログも、一晩で変わるわけもなかった。", "speaker": null, "sprites": []}, {"text": "それでも。\nリナがスマホを閉じた。\n「ログには残ってない。でも——消えた跡は、残ってる」", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "ナギが紙を取り出した。\n手書きで、名前を書き始めた。\nアンログの街で学んだやり方で。", "speaker": null, "sprites": []}, {"text": "カナメが言った。\n「私はここに残ります」\n「内部から、できることをする」", "speaker": {"name": "カナメ", "color": "#b0c8b0", "role": ""}, "sprites": []}]}, {"id": "ch07_009_morning_call", "type": "vn", "bg": "linear-gradient(180deg,#f0ece4,#e4ddd0)", "beats": [{"text": "朝だった。\n焼きたてのパンの匂いがした。", "speaker": null, "sprites": []}, {"text": "「ミオ」\nトウが呼んだ。", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "少し遅れて、ミオが振り向いた。", "speaker": null, "sprites": []}, {"text": "「……呼んだ？」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「うん」\nトウは言った。\n「ミオ」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "ミオは少しだけ笑った。\n今度は、本物の笑顔だった。", "speaker": null, "sprites": []}, {"text": "「その呼び方、やっぱり好き」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "端末には、まだ空白があった。\n名前は、記録には残っていなかった。\nでも、トウの手書きメモには残っていた。\n\n「ミオ。怖い時ほど笑う。名前を呼ぶと、少し安心する。\nパンを半分くれる。大丈夫じゃない時ほど、大丈夫と言う。\n\n意味: 一緒に生きたい人」", "speaker": null, "sprites": []}]}, {"id": "ending_true_done", "type": "continued", "flag": "rwm_end_true", "label": "名前を呼ぶ朝"}, {"id": "ending_memory_bureau", "type": "vn", "bg": "linear-gradient(180deg,#f4f4f8,#e8e8f0)", "beats": [{"text": "記憶局エンド「保護された名前」", "speaker": null, "sprites": []}, {"text": "カナメの助けを借りて、ミオを記録システムの中に保護する道を選んだ。\nミオは消えなかった。", "speaker": null, "sprites": []}, {"text": "端末の画面が静かに光った。\n\n対象名: ミオ\n状態: 安定\n意味タグ: 保護\n自由接続: 制限", "speaker": null, "sprites": []}, {"text": "「トウが呼んでくれるなら、大丈夫」\nミオが言った。", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「ミオ」\nトウは呼んだ。", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「うん」\n「ここにいるよ」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "ミオは笑った。\nでも、その笑顔には少しだけ諦めが混ざっていた。\n端末には、「安定対象」として記録されたミオの名前が残っていた。", "speaker": null, "sprites": []}, {"text": "記憶局の「保護」という言葉の中で、ミオはいた。\nそれは救いだった。\n——しかし、トゥルーではなかった。", "speaker": null, "sprites": []}]}, {"id": "ending_memory_bureau_done", "type": "continued", "flag": "rwm_end_memory_bureau", "label": "保護された名前"}, {"id": "ending_unlog", "type": "vn", "bg": "linear-gradient(180deg,#1e1a14,#16140e)", "beats": [{"text": "アンログエンド「記録されない朝」", "speaker": null, "sprites": []}, {"text": "記憶局に渡さないため、アンログの街へ行き、\n記録から外れて生きる道を選んだ。", "speaker": null, "sprites": []}, {"text": "端末の画面には、何も表示されなかった。\n\n該当記録なし", "speaker": null, "sprites": []}, {"text": "ナギが紙を取り出した。\n手書きで、ミオの名前を書いた。", "speaker": null, "sprites": []}, {"text": "「ミオ」\nトウが呼んだ。", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「記録には、残ってないんだよね」\nミオが言った。", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「うん」\n「でも、僕は呼べる」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「じゃあ、忘れないでね」\nミオは笑った。\n本物の笑顔だった。", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "手書きメモには残っていた。\n\n「ミオ。怖い時ほど笑う。名前を呼ばれると安心する。」\n\n温かい朝だった。\n——しかし、白峰市の記録には届かなかった。", "speaker": null, "sprites": []}]}, {"id": "ending_unlog_done", "type": "continued", "flag": "rwm_end_unlog", "label": "記録されない朝"}, {"id": "after_memory_bureau", "type": "vn", "bg": "linear-gradient(180deg,#f4f4f8,#e8e8f0)", "beats": [{"text": "記録の続き「保護された名前」", "speaker": null, "sprites": []}, {"text": "端末には、ミオの名前が残っていた。\n\n対象名: ミオ\n状態: 安定\n意味タグ: 保護", "speaker": null, "sprites": []}, {"text": "「大丈夫だよ」\nミオが言った。\n「ここにいられるから」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「本当に、大丈夫？」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「……名前を呼んでくれるなら」\n「たぶん」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "安全だった。\nでも、少し息苦しかった。", "speaker": null, "sprites": []}]}, {"id": "after_memory_bureau_end", "type": "continued"}, {"id": "after_unlog", "type": "vn", "bg": "linear-gradient(180deg,#1e1a14,#16140e)", "beats": [{"text": "記録の続き「記録されない朝」", "speaker": null, "sprites": []}, {"text": "端末には、何も表示されなかった。\n\n該当記録なし", "speaker": null, "sprites": []}, {"text": "「ここには、私の記録、ないんだよね」\nミオが言った。", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「うん。でも、僕は呼べる」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「じゃあ、忘れないでね」\nミオは笑った。", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "手書きメモには残っていた。\n「ミオ。怖い時ほど笑う。名前を呼ばれると安心する。」", "speaker": null, "sprites": []}]}, {"id": "after_unlog_end", "type": "continued"}, {"id": "after_true", "type": "vn", "bg": "linear-gradient(180deg,#f0ece4,#e4ddd0)", "beats": [{"text": "記録の続き「名前を呼ぶ朝」", "speaker": null, "sprites": []}, {"text": "端末には、まだ空白があった。\n\n対象名: ＿＿\n記録同期: 不完全\n\nトウの手書き:\n「ミオ。一緒に生きたい人。」", "speaker": null, "sprites": []}, {"text": "「ミオ」\nトウが呼んだ。", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「……呼んだ？」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「うん。ミオ」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「その呼び方、やっぱり好き」\nミオは笑った。", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "記録は完全には戻らなかった。\nでも、意味を選び直した朝は続いていた。", "speaker": null, "sprites": []}]}, {"id": "after_true_end", "type": "continued"}, {"id": "legacy_ch01_000_prologue", "type": "vn", "bg": "linear-gradient(180deg,#f0f0f8,#d8d8e8)", "beats": [{"text": "白かった。", "speaker": null, "sprites": []}, {"text": "空も、地面も、時計塔も。\n何もかもが、輪郭だけを残して白く抜けていた。", "speaker": null, "sprites": []}, {"text": "広場の中央に、椅子が一つあった。\nその椅子に、ミオが座っていた。", "speaker": null, "sprites": []}, {"text": "ミオは、こちらを見ていた。\n見ているのに、見つけられていないような目だった。", "speaker": null, "sprites": []}, {"text": "「ミオ」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "名前を呼んだ。\n胸の奥に残っていた、最後の確かなものを差し出すみたいに。", "speaker": null, "sprites": []}, {"text": "「ごめんなさい」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「あなたは、誰ですか？」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「僕だ。トウだ。」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "ミオの目が揺れる。\n知らない名前を聞いたはずなのに、泣きそうな顔になる。", "speaker": null, "sprites": []}, {"text": "「知らない、はずなのに」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「どうして、胸が痛いんだろう」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "白い広場の奥で、小さな影が揺れた。", "speaker": null, "sprites": []}, {"text": "「まだ早いよ」", "speaker": {"name": "ノア", "color": "#c8b860", "role": "（白いフードの子）"}, "sprites": []}, {"text": "「これは、最後の日の記憶だから」", "speaker": {"name": "ノア", "color": "#c8b860", "role": "（白いフードの子）"}, "sprites": []}, {"text": "「きみが、まだ間に合うと思っていた日の記憶」", "speaker": {"name": "ノア", "color": "#c8b860", "role": "（白いフードの子）"}, "sprites": []}, {"text": "「ミオ！」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "手を伸ばす。\n届く前に、白がすべてを塗りつぶした。", "speaker": null, "sprites": []}, {"text": "——3日前。", "speaker": null, "sprites": []}]}, {"id": "legacy_ch01_000_opening", "type": "vn", "bg": "linear-gradient(180deg,#dfe6f2,#c0cce0)", "beats": [{"text": "白峰市。\n記録補助システムが、息をするより自然に日常へ溶けている街。", "speaker": null, "sprites": []}, {"text": "スマホが今日の予定を読み上げ、\n昨日の生活ログが「おまとめ」になって届く。", "speaker": null, "sprites": []}, {"text": "誰もが、自分の一日を記録に預けて生きている。\n白峰市では、それを「祈り」と呼ぶ人もいる。", "speaker": null, "sprites": []}, {"text": "忘れても大丈夫。\n記録が、覚えていてくれるから。", "speaker": null, "sprites": []}, {"text": "——みんな、そう信じていた。", "speaker": null, "sprites": []}]}, {"id": "legacy_ch01_005_morning", "type": "vn", "bg": "linear-gradient(180deg,#0e1018,#080c14)", "beats": [{"text": "端末が朝のまとめを届けていた。\n\n「睡眠: 安定」\n「感情タグ: やや不安」\n「本日の予定: 学校 / 広場 / 記録確認」\n「家族記録: 更新なし」", "speaker": null, "sprites": []}, {"text": "（毎朝これが届く。\nこの街では、記録が「おはよう」の代わりだ。）", "speaker": null, "sprites": []}, {"text": "遠くで、時計塔の鐘が鳴った。", "speaker": null, "sprites": [], "se": "bell"}, {"text": "「鐘が鳴ったね」\n「今日の記録も整ったみたい」", "speaker": {"name": "叔母", "color": "#c8a890", "role": ""}, "sprites": []}, {"text": "「整った、か」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "焼きたてのパンから、白い湯気が上がっていた。\n木の皿には、薄く切ったチーズと、少し焦げた卵。\n小さな鍋では、野菜スープが静かに音を立てている。", "speaker": null, "sprites": []}, {"text": "叔母さんは何も聞かずに、\nパンの端にバターを塗って、僕の皿に置いた。", "speaker": null, "sprites": []}, {"text": "「食べてから行きなさい」", "speaker": {"name": "叔母", "color": "#c8a890", "role": ""}, "sprites": []}, {"text": "その声だけで、\n家がまだ家でいられる気がした。", "speaker": null, "sprites": []}]}, {"id": "legacy_ch01_007_mother", "type": "vn", "bg": "linear-gradient(180deg,#0c0e1a,#08080f)", "beats": [{"text": "廊下の奥、母の部屋の扉を少しだけ開ける。\n母は、今日も静かに眠っていた。", "speaker": null, "sprites": []}, {"text": "枕元の端末が、淡く光っている。\n\n「本日の状態: 安定」\n「感情反応: 未検出」\n「面会記録: 保持」\n「調整医療部: 定期観測中」", "speaker": null, "sprites": []}, {"text": "（管理されている。\nこの部屋も、母の状態も、全部記録に収まっている。\nなのに、なぜか記録には「事故」と書かれていない。）", "speaker": null, "sprites": []}, {"text": "母は笑って、少し焦げた卵を木の皿に置いた。", "speaker": null, "sprites": []}, {"text": "「トウは、困ってる人を見ると顔に出るね」", "speaker": {"name": "母", "color": "#b0a8c8", "role": "（記憶）"}, "sprites": []}, {"text": "「でもね、助ける時は、\n自分の心も置いていかないこと」", "speaker": {"name": "母", "color": "#b0a8c8", "role": "（記憶）"}, "sprites": []}, {"text": "記録には、事故なんて書かれていない。\nでも、母は目を覚まさない。", "speaker": null, "sprites": []}, {"text": "「……行ってきます」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}]}, {"id": "legacy_ch01_009_notification", "type": "phone", "header": "白峰市記録管理局", "messages": [{"from": "白峰市記録管理局", "text": "一部地域で、生活ログの同期異常が確認されています。", "delay": 700}, {"from": "白峰市記録管理局", "text": "市民の皆さまは、通常通り登校・通勤してください。", "delay": 1500}]}, {"id": "legacy_ch01_011_helping", "type": "vn", "bg": "linear-gradient(180deg,#d8e0ec,#b8c4d8)", "beats": [{"text": "（また同期異常だ。最近、多い。）", "speaker": null, "sprites": []}, {"text": "通学路の市場前。\n買い物袋を抱えたおばあさんが、石畳でつまずいた。\n野菜が転がっていく。", "speaker": null, "sprites": []}, {"text": "誰も気づかない。\nみんな、スマホの中の自分の一日を見ている。", "speaker": null, "sprites": []}, {"text": "気づいたら、トウは走っていた。\nひとつ、ふたつ、三つ——野菜を拾い集めて、袋に戻した。", "speaker": null, "sprites": []}, {"text": "「ありがとう、ありがとう」\nおばあさんが何度も頭を下げた。\nトウは少し照れた。", "speaker": null, "sprites": []}, {"text": "「放っておけなかっただけです」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "（それだけだ。\nでも、なぜか胸の中がちょっと暖かかった。）", "speaker": null, "sprites": []}]}, {"id": "legacy_ch01_013_blank", "type": "vn", "bg": "linear-gradient(180deg,#08080f,#0c1020)", "beats": [{"text": "スマホに今日の生活ログが届いていた。\n\n「睡眠: 安定」\n「感情タグ: やや不安」\n「昨日の歩数: 4,821歩」\n「家族記録: 更新なし」\n\n（今日も、記録はちゃんと整っている。）", "speaker": null, "sprites": []}, {"text": "でも、昨日の予定欄を開いた時、トウは止まった。\n\n「本日の予定」\n08:30　学校\n09:00　同期異常により開始遅延\n09:20　広場で　＿＿　と合流\n\n[同期異常：一部データが復元できません]", "speaker": null, "sprites": []}, {"text": "（空白を見る。\n今日、ミオと広場で会う約束をしていた。\nそれは覚えている。\nなのに、名前だけが入っていない。）", "speaker": null, "sprites": []}, {"text": "試しに、昔の写真を開こうとする。\nベンチに座る幼いトウの隣が、白くにじんでいた。", "speaker": null, "sprites": [], "se": "whiteout"}, {"text": "「昨日までは、ここに……」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "端末の画面を閉じる。\nミオのことは、覚えている。\nでも記録は、もう覚えていない。", "speaker": null, "sprites": []}]}, {"id": "legacy_ch01_015_plaza_approach", "type": "vn", "bg": "linear-gradient(180deg,#c8ccd6,#9aa2b4)", "beats": [{"text": "スマホのログに、ぽっかりと空白があいている。\nさっき、人を助けたはずの数分が——ない。", "speaker": null, "sprites": []}, {"text": "（おかしい——あのことが、消えている。）", "speaker": null, "sprites": []}, {"text": "広場の方へ歩くと、入口が封鎖されていた。\n巡回端末と、低く飛ぶドローンの気配。", "speaker": null, "sprites": []}, {"text": "街頭端末に、一瞬ノイズが走る。\n《記録を信じるな》——文字は、すぐに消えた。", "speaker": null, "sprites": []}, {"text": "封鎖の柵に、誰かの落書きが残っていた。", "speaker": null, "sprites": []}]}, {"id": "legacy_ch01_017_plaza_choice", "type": "memory", "prompt": "封鎖された広場へ、どう入る？", "options": [{"text": "路地を回って広場に入る", "next": null}, {"text": "市民に混じって通り過ぎる", "next": null}]}, {"id": "legacy_ch01_020_mio_meet", "type": "vn", "bg": "linear-gradient(180deg,#e8eede,#cdd8c0)", "beats": [{"text": "路地を抜けた先、封鎖の手前の小さな広場。\nいつもの場所に、ミオがいた。", "speaker": null, "sprites": []}, {"text": "紙包みから小さな丸パンをちぎって、鳥に分けている。\n一羽、二羽——気づけば十羽、二十羽と集まってくる。\n通り過ぎる人は、誰も気づかない。", "speaker": null, "sprites": []}, {"text": "「おはよう、トウ」\n「ちょっとだけ、鳥に人気出すぎたかも」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「また自分の分まであげてるの？」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「大丈夫。たぶん」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「そのたぶんが信用できない」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "スマホを向けてみる。\n——ミオの周りだけ、画面が白くにじんで、うまく写らない。", "speaker": null, "sprites": []}, {"text": "「食べる？」\n紙包みの中には、小さな丸パンがもう一つ入っていた。", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「それ、君の昼ごはんじゃないの？」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「うん。でも、困ってる顔の人を見ると、ちょっと分けたくなる」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "（困ってる顔。\nそれ、今の僕のことだ。）", "speaker": null, "sprites": []}]}, {"id": "legacy_ch01_025_name", "type": "vn", "bg": "linear-gradient(180deg,#e4e8f0,#d2d8e4)", "beats": [{"text": "「ミオ」\nその名前を、呼んでみた。", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "その名前を呼んだ瞬間、\nミオの笑顔から、強がりが少しだけ消えた。", "speaker": null, "sprites": []}, {"text": "ほんの一秒。\nでも、その一秒だけは、世界中の記録より確かだった。", "speaker": null, "sprites": []}, {"text": "「……うん」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「その呼び方、好き」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}]}, {"id": "legacy_ch01_030_unlog_sign", "type": "vn", "bg": "linear-gradient(180deg,#c4c8d4,#9498aa)", "beats": [{"text": "広場の端の古い掲示板に、誰かの落書きが残っていた。", "speaker": null, "sprites": []}, {"text": "——《記録は嘘をつく》。\nインクは、まだ乾いていないように見えた。", "speaker": null, "sprites": []}, {"text": "すぐ横の街頭端末が、ざ、ざ、と白いノイズに乱れる。\n知らない文字が一瞬だけ走って、すぐに消えた。", "speaker": null, "sprites": []}, {"text": "（何かがおかしい。\n最近、こういうものが、増えてきた。）", "speaker": null, "sprites": []}]}, {"id": "legacy_ch01_035_unlog_approach", "type": "vn", "bg": "linear-gradient(180deg,#a8acba,#7e8290)", "beats": [{"text": "ベンチのミオに、フードを深くかぶった人物が近づいていく。\n足音は、記録に残らないみたいに静かだった。", "speaker": null, "sprites": []}, {"text": "「見つけた」", "speaker": {"name": "？", "color": "#9a8aa0", "role": "（フードの人物）"}, "sprites": []}, {"text": "「やっぱり、記録に残らない」", "speaker": {"name": "？", "color": "#9a8aa0", "role": "（フードの人物）"}, "sprites": []}, {"text": "「きみは、世界を戻す鍵だ」", "speaker": {"name": "？", "color": "#9a8aa0", "role": "（フードの人物）"}, "sprites": []}, {"text": "ミオは一瞬、息を呑んだ。\nそれでも、いつものように笑ってみせる。", "speaker": null, "sprites": []}, {"text": "「……大丈夫だよ」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "袖を握るミオの指先が、小さく震えていた。", "speaker": null, "sprites": []}]}, {"id": "legacy_ch01_040_choice_protect", "type": "memory", "prompt": "アンログの人物が、ミオに迫っている。どうする？", "options": [{"text": "ミオに声をかける", "next": null}, {"text": "状況を確認する", "next": "legacy_ch01_050_after"}]}, {"id": "legacy_ch01_045_name_call", "type": "vn", "bg": "linear-gradient(180deg,#dfe4f0,#cbd4e8)", "beats": [{"text": "放っておけなかった。\n気づいたら、トウは一歩、前に出ていた。", "speaker": null, "sprites": []}, {"text": "「ミオ」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「鍵なんかじゃない」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「ミオは、ミオだ」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "ミオの肩が、小さく揺れた。\nトウの声に気づいて、強ばっていた顔が、少しほどける。", "speaker": null, "sprites": []}, {"text": "「……トウ」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "フードの人物が、初めて動きを止めた。", "speaker": null, "sprites": []}, {"text": "「なぜ、彼女に声が届く」", "speaker": {"name": "？", "color": "#9a8aa0", "role": "（フードの人物）"}, "sprites": []}, {"text": "人物は背を向け、人混みの白さに溶けるように消えていく。", "speaker": null, "sprites": []}, {"text": "「記録できない子……また来る」", "speaker": {"name": "？", "color": "#9a8aa0", "role": "（フードの人物）"}, "sprites": []}]}, {"id": "legacy_ch01_050_after", "type": "vn", "bg": "linear-gradient(180deg,#e6ebe2,#d0d8c6)", "beats": [{"text": "気づくと、フードの人物の姿は、もうどこにもなかった。", "speaker": null, "sprites": []}, {"text": "ミオが、ふっと肩の力を抜く。", "speaker": null, "sprites": []}, {"text": "「……ありがとう」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「よくあるの。わたし、ちょっと有名みたい」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「記録に、残らないから」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "ミオは笑っていた。\nでも、その笑い方を、トウは放っておけなかった。", "speaker": null, "sprites": []}, {"text": "（また来る、と言っていた。\n次は、もっと早く動く。）", "speaker": null, "sprites": []}, {"text": "「ねえ、トウ」\nミオが少し間を置いてから言った。", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「トウって、放っておけないんだよね。困ってる人」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「……そうかな」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「そういうところ、好きだよ」\nミオは笑った。\n今度は、強がりじゃない笑顔だった。", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "（ミオにそう言われると——\nなんで助けるのかとか、迷惑じゃないかとか、\nそういうことが全部、どうでもよくなった。）", "speaker": null, "sprites": []}]}, {"id": "legacy_ch01_010_message", "type": "vn", "bg": "linear-gradient(180deg,#08080f,#0c1020)", "beats": [{"text": "スマートフォンが震える。", "speaker": null, "sprites": []}, {"text": "「トウ、今どこ？\n広場に来て。変なことが起きてる」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "ミオ。\nまだある。まだ、呼べる。", "speaker": null, "sprites": []}, {"text": "「……行く」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}]}, {"id": "legacy_ch01_020_plaza_meet", "type": "vn", "bg": "linear-gradient(180deg,#0a100a,#0c1810)", "beats": [{"text": "広場の入口で、ミオが手を振っていた。\nその声を聞いただけで、息が戻った。", "speaker": null, "sprites": []}, {"text": "「トウ、こっち」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「ミオ、大丈夫か」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「大丈夫。たぶん、大丈夫」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "（大丈夫じゃない時の声だ）", "speaker": null, "sprites": []}, {"text": "ミオは少し笑った。\n指先はカーディガンの袖を強く握っている。", "speaker": null, "sprites": []}, {"text": "「トウって、そういうところあるよね」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「見すぎないでって言いたくなるところ」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「でも、今日は見てほしいかも」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "ミオが広場の中央を指さした。", "speaker": null, "sprites": []}]}];
