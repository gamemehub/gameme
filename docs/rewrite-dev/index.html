<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>RewriteMemory</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a12;color:#e0e0e8;font-family:'Courier New',monospace}
button{cursor:pointer;font-family:inherit}
.screen{position:fixed;inset:0;display:none;flex-direction:column}

/* SE TOGGLE */
.se-toggle{position:fixed;top:10px;right:10px;z-index:100;background:rgba(20,24,40,.7);border:1px solid #2a3050;color:#6a78a0;font-size:10px;letter-spacing:.12em;padding:6px 12px;border-radius:3px}
.se-toggle.off{color:#3a4060;border-color:#1e2035}
.screen.active{display:flex}

/* TITLE */
#S-title{align-items:center;justify-content:center;background:#0a0a12}
.title-logo{font-size:clamp(32px,8vw,56px);font-weight:900;letter-spacing:.15em;color:#c8d0e8;text-align:center;margin-bottom:8px}
.title-sub{font-size:12px;color:#4a5068;letter-spacing:.3em;text-align:center;margin-bottom:48px}
.start-btn{background:transparent;border:1px solid #3a4060;color:#8090b8;padding:14px 40px;font-size:11px;letter-spacing:.25em;border-radius:2px}

/* SCENE / VN */
#S-scene{background:#0a0a12;cursor:pointer}
.scene-bg{position:absolute;inset:0;background:#0a0a12;transition:background 1s}
.scene-sprites{position:absolute;bottom:188px;left:0;right:0;display:flex;justify-content:center;gap:24px;align-items:flex-end}
.sprite-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;transition:opacity .4s}
.sprite-name{font-size:9px;color:#4a5068;letter-spacing:.1em}
.sprite-img{image-rendering:pixelated;image-rendering:crisp-edges;filter:drop-shadow(0 4px 12px rgba(0,0,0,.7))}
.dialogue-box{position:absolute;bottom:0;left:0;right:0;min-height:180px;max-height:60%;background:rgba(8,8,18,.95);border-top:1px solid #1e2035;padding:0 0 8px;display:flex;flex-direction:column}
.dlg-speaker{display:flex;align-items:center;gap:10px;padding:10px 16px 6px;border-bottom:1px solid #12141e}
.dlg-name{font-size:11px;font-weight:700}
.dlg-role{font-size:8px;color:#2a2e48;margin-left:auto}
.dlg-text{padding:10px 16px 6px;font-size:13px;color:#c8d0e8;line-height:2;max-height:180px;overflow-y:auto;white-space:pre-wrap;flex:1}
.dlg-inner{padding:4px 16px 8px;font-size:10px;color:#4a5878;line-height:1.9;font-style:italic;border-left:2px solid #1e2840;margin:0 16px 6px;background:rgba(10,20,40,.4);display:none;white-space:pre-wrap}
.dlg-next{text-align:center;padding:8px;font-size:9px;color:#1e2840;letter-spacing:.2em;border-top:1px solid #10121e;display:none}

/* MEMORY (書き換え画面) */
#S-memory{background:#06060e;align-items:center;justify-content:center;padding:20px}
.memory-title{font-size:10px;color:#3a4060;letter-spacing:.3em;margin-bottom:20px;text-align:center}
.memory-cards{width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px}
.memory-card{padding:12px 14px;background:#0c0e1a;border:1px solid #1e2035;border-radius:3px;cursor:pointer;transition:border-color .2s}
.memory-card.selected{border-color:#4a60a0;background:#0e1228}
.memory-card-label{font-size:8px;color:#2a3050;letter-spacing:.15em;margin-bottom:4px}
.memory-card-text{font-size:12px;color:#8090b0;line-height:1.7}
.memory-confirm{margin-top:16px;width:100%;max-width:360px;padding:12px;background:transparent;border:1px solid #2a3050;color:#4a5878;font-size:10px;letter-spacing:.2em;border-radius:2px;display:none}

/* PHONE (章末・空白メッセージ) */
#S-phone{background:#05060c;align-items:center;justify-content:center;padding:24px}
.phone-frame{width:100%;max-width:340px;height:70%;max-height:560px;background:#0a0c16;border:1px solid #1e2035;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 8px 40px rgba(0,0,0,.6)}
.phone-header{padding:14px;font-size:11px;letter-spacing:.2em;color:#6a78a0;text-align:center;border-bottom:1px solid #161826;background:#0c0e1a}
.phone-thread{flex:1;padding:16px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
.msg{max-width:82%;display:flex;flex-direction:column;gap:4px;align-self:flex-start;animation:msgIn .35s ease both}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg-from{font-size:9px;color:#4a5068;letter-spacing:.1em;padding-left:4px}
.msg-bubble{padding:10px 12px;font-size:12px;line-height:1.8;border-radius:12px;background:#141828;color:#c8d0e8;word-break:break-word}
.msg.unknown .msg-bubble{background:#0e1020;color:#9aa6c8}
.blank{display:inline-block;background:#e8ecf8;color:transparent;border-radius:2px;box-shadow:0 0 10px rgba(232,236,248,.55);animation:blankPulse 2.8s ease-in-out infinite;vertical-align:middle}
@keyframes blankPulse{0%,100%{opacity:.5}50%{opacity:.95}}
.phone-next{margin-top:14px;font-size:8px;color:#2a3448;letter-spacing:.25em;text-align:center;padding-bottom:8px}

/* CHAPTER END / To be continued */
#S-continued{background:linear-gradient(180deg,#04040a,#06060e);align-items:center;justify-content:center}
.cont-wrap{text-align:center;animation:msgIn .8s ease both}
.cont-chapter{font-size:9px;color:#3a4060;letter-spacing:.35em;margin-bottom:18px}
.cont-title{font-size:clamp(24px,7vw,40px);font-weight:900;letter-spacing:.12em;color:#c8d0e8;margin-bottom:14px}
.cont-sub{font-size:10px;color:#4a5068;letter-spacing:.25em;margin-bottom:40px}
.after-item{display:block;background:transparent;border:1px solid #1e2840;color:#6a78a0;padding:8px 20px;font-size:10px;letter-spacing:.15em;border-radius:2px;cursor:pointer;width:100%;text-align:center;margin-bottom:4px}
.cont-btn{background:transparent;border:1px solid #253050;color:#6a78a0;padding:14px 36px;font-size:10px;letter-spacing:.2em;border-radius:2px}
.mio-sprite{image-rendering:pixelated;image-rendering:crisp-edges;width:72px;height:auto;opacity:0;transition:opacity .5s,transform .4s;transform:translateY(10px);position:absolute;bottom:56px;right:12px;pointer-events:none}.mio-sprite.vis{opacity:1;transform:translateY(0)}
.pw-screen{position:fixed;inset:0;background:#06060e;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999}
.pw-screen h2{color:#4a5a80;font-size:12px;letter-spacing:.3em;margin-bottom:32px}
#pw-input{background:transparent;border:none;border-bottom:1px solid #2a3050;color:#8090c8;font-size:20px;letter-spacing:.5em;text-align:center;width:120px;outline:none;padding:8px 0;margin-bottom:24px}
#pw-error{color:#c87060;font-size:10px;letter-spacing:.2em;height:16px;margin-bottom:16px}
#pw-btn{background:transparent;border:1px solid #2a3050;color:#6a78a0;padding:10px 32px;font-size:10px;letter-spacing:.3em;cursor:pointer;border-radius:2px}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   モバイル最適化 (Issues #148-153)
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */

/* VN本文：スマホで読みやすく */
@media (max-width: 480px) {
  .dlg-text { font-size: 14px; line-height: 2.1; padding: 12px 14px 6px; }
  .dlg-inner { font-size: 11px; line-height: 1.8; }
  .dlg-speaker { padding: 10px 14px 6px; }
  .dlg-name { font-size: 12px; }
  .dialogue-box { min-height: 200px; max-height: 65%; }
  .dlg-next { padding: 10px; font-size: 10px; }
}

/* メモリーカード：スマホで押しやすく */
@media (max-width: 480px) {
  #S-memory { padding: 16px 12px; }
  .memory-cards { max-width: 100%; }
  .memory-card { padding: 14px 12px; font-size: 13px; }
  .memory-card .card-text { font-size: 13px; line-height: 1.7; }
  .memory-confirm { padding: 14px; font-size: 11px; width: 100%; }
}

/* phoneシーン：スマホで見やすく */
@media (max-width: 480px) {
  .phone-frame { max-width: 100%; border-radius: 20px; }
  .phone-header { font-size: 12px; padding: 10px 14px; }
  .phone-thread { padding: 12px 10px; gap: 10px; }
  .phone-bubble { font-size: 12px; line-height: 1.8; padding: 10px 12px; max-width: 88%; }
  .phone-next { font-size: 9px; margin-top: 12px; }
}

/* タイトル画面：スマホで見やすく */
@media (max-width: 480px) {
  .title-logo { font-size: clamp(28px, 10vw, 48px); letter-spacing: .08em; }
  .title-sub { font-size: 10px; letter-spacing: .2em; margin-bottom: 36px; }
  .start-btn { padding: 14px 32px; font-size: 11px; }
  #after-menu-btn { font-size: 9px; padding: 10px 20px; }
}

/* continued画面：スマホで余白調整 */
@media (max-width: 480px) {
  .cont-wrap { padding: 32px 20px; }
  .cont-chapter { font-size: 8px; }
  .cont-title { font-size: 14px; }
  .cont-btn { padding: 14px 28px; font-size: 10px; }
}

/* 重要テキストに余韻 (#153) */
.beat-important .dlg-text {
  color: #d8e0f0;
  text-shadow: 0 0 20px rgba(160,180,255,0.15);
}

/* EXPLORE (探索UI) */
.hotspot-btn{position:absolute;pointer-events:all;background:rgba(128,160,200,0.1);border:1px solid rgba(128,160,200,0.35);border-radius:3px;cursor:pointer;font-size:9px;color:rgba(200,220,255,0.65);letter-spacing:.12em;padding:5px 12px;transition:background .2s,border-color .2s;animation:hsPulse 2.5s ease-in-out infinite;font-family:inherit}
.hotspot-btn:hover{background:rgba(128,160,200,0.22);border-color:rgba(128,160,200,0.7)}
.explore-hint{position:absolute;bottom:192px;left:50%;transform:translateX(-50%);font-size:8px;color:rgba(128,160,200,0.35);letter-spacing:.2em;pointer-events:none;white-space:nowrap}
@keyframes hsPulse{0%,100%{opacity:.55}50%{opacity:1}}

/* M03A 探索会話（DESIGN_TOKEN: --rm-dialog-m03-*） */
:root{
  --rm-dialog-m03-bg:#0B0D16;
  --rm-dialog-m03-border:#EDEDED;
  --rm-dialog-m03-text:#FFFFFF;
}
/* 探索画面を保持したまま下部に出す会話枠（操作バーの上）*/
.m03a-dialog{position:absolute;left:0;right:0;bottom:80px;z-index:6;display:none;
  flex-direction:row;align-items:flex-end;gap:10px;padding:12px 14px;min-height:96px;
  background:var(--rm-dialog-m03-bg);border-top:1px solid var(--rm-dialog-m03-border);
  color:var(--rm-dialog-m03-text);cursor:pointer}
.m03a-dialog.show{display:flex}
/* PortraitSmall（64〜96px・DialogBox 左）*/
.m03a-portrait{flex:0 0 auto;width:72px;height:72px;border-radius:4px;object-fit:cover;
  background:rgba(255,255,255,.04);border:1px solid rgba(237,237,237,.25);
  image-rendering:auto;align-self:flex-end}
.m03a-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;padding-bottom:2px}
.m03a-name{font-size:11px;font-weight:700;letter-spacing:.08em;color:#AEE6FF}
.m03a-text{font-size:13px;line-height:1.7;white-space:pre-wrap;color:var(--rm-dialog-m03-text)}
.m03a-next{font-size:9px;letter-spacing:.2em;text-align:right;color:rgba(255,255,255,.4)}
@media (max-width:480px){
  .m03a-dialog{min-height:104px;padding:12px}
  .m03a-portrait{width:64px;height:64px}
  .m03a-text{font-size:14px;line-height:1.8}
}

/* WALK (移動操作シーン) */
#S-walk{background:#0a0a12;overflow:hidden;cursor:default}
.walk-bg{position:absolute;inset:0;transition:background 1s}
.walk-world{position:absolute;bottom:80px;left:0;height:calc(100% - 80px);transition:transform .3s ease}
.walk-layer{position:absolute;bottom:0;left:0;width:100%;height:100%;pointer-events:none}
/* プレイヤー（トウ） */
.walk-player{position:absolute;bottom:0;width:24px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:left .15s linear}
.walk-player-body{width:12px;height:20px;background:#8090c8;border-radius:2px 2px 0 0;position:relative}
.walk-player-head{width:10px;height:10px;background:#c8a87a;border-radius:50%;margin-bottom:1px}
.walk-player-name{font-size:7px;color:#4a5878;letter-spacing:.05em;white-space:nowrap}
/* NPCやオブジェクト */
.walk-npc{position:absolute;bottom:0;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;transition:opacity .2s}
.walk-npc-body{width:12px;height:18px;background:#8090c8;border-radius:2px 2px 0 0;transition:box-shadow .25s}
.walk-npc-head{width:10px;height:10px;background:#c8a87a;border-radius:50%;transition:box-shadow .25s}
.walk-npc-name{font-size:7px;color:#6a78a0;letter-spacing:.05em;white-space:nowrap}
.walk-obj{position:absolute;bottom:0;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.walk-obj-icon{font-size:16px;line-height:1;transition:text-shadow .25s}
.walk-obj-name{font-size:7px;color:#3a4858;letter-spacing:.05em;white-space:nowrap}
.walk-sprite{display:block;width:auto;pointer-events:none;image-rendering:auto;filter:drop-shadow(0 3px 4px rgba(0,0,0,.55))}
.walk-player-img{height:66px}
.walk-npc-img{height:76px}
.walk-obj-img{height:42px}
.walk-npc.near .walk-npc-img{filter:drop-shadow(0 0 12px rgba(255,255,255,.4)) drop-shadow(0 0 22px rgba(255,255,255,.22)) drop-shadow(0 3px 4px rgba(0,0,0,.55))}
.walk-obj.near .walk-obj-img{filter:drop-shadow(0 0 8px rgba(255,255,255,.3)) drop-shadow(0 3px 4px rgba(0,0,0,.55))}
/* インジケーター（話せる=… / 調べられる=✦）*/
.walk-ind{height:13px;font-size:12px;line-height:1;color:rgba(220,225,240,.5);letter-spacing:.05em;transition:color .25s,text-shadow .25s,transform .25s}
.walk-ind.near{color:rgba(255,255,255,.95);text-shadow:0 0 8px rgba(255,255,255,.6),0 0 14px rgba(255,255,255,.3);transform:translateY(-2px)}
/* 近接時：白く淡くにじむ（白層化モチーフ）*/
.walk-npc.near .walk-npc-head,.walk-npc.near .walk-npc-body{box-shadow:0 0 8px rgba(255,255,255,.3),0 0 16px rgba(255,255,255,.2)}
.walk-obj.near .walk-obj-icon{text-shadow:0 0 8px rgba(255,255,255,.3),0 0 16px rgba(255,255,255,.2)}
/* アクションラベル（白いにじみのみ）*/
.walk-action{position:absolute;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.28);border-radius:3px;font-size:9px;color:rgba(255,255,255,.85);letter-spacing:.1em;padding:5px 12px;cursor:pointer;font-family:inherit;white-space:nowrap;animation:hsPulse 2s ease-in-out infinite;transform:translateX(-50%)}
/* 右上HUD（現在地 / 時刻）常時表示 */
.walk-hud{position:absolute;top:12px;right:12px;display:flex;align-items:center;gap:6px;background:rgba(8,10,18,.5);border:1px solid rgba(255,255,255,.08);border-radius:4px;padding:5px 10px;font-size:9px;color:rgba(220,225,240,.75);letter-spacing:.12em;white-space:nowrap;pointer-events:none;z-index:5}
.walk-hud-sep{opacity:.4}
.walk-hud-clock{font-size:11px;opacity:.7}
/* 操作バー */
.walk-controls{position:absolute;bottom:0;left:0;right:0;height:80px;background:rgba(6,6,14,.92);border-top:1px solid #111820;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.walk-dpad{display:flex;gap:8px}
.walk-btn{background:rgba(128,144,200,.08);border:1px solid #1e2838;color:#4a5878;width:44px;height:44px;border-radius:4px;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit;user-select:none;-webkit-user-select:none}
.walk-btn:active{background:rgba(128,144,200,.2);border-color:#3a4868}
.walk-info{font-size:8px;color:#2a3040;letter-spacing:.15em;text-align:center;flex:1}
/* 操作説明Aボタン（常時表示・近接時に白くにじむ）*/
.walk-act{width:auto;padding:0 16px;font-size:9px;letter-spacing:.1em;color:rgba(200,210,235,.4);border-color:rgba(255,255,255,.12);white-space:nowrap;transition:color .25s,border-color .25s,background .25s,box-shadow .25s}
.walk-act.on{color:rgba(255,255,255,.95);border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.06);box-shadow:0 0 10px rgba(255,255,255,.25)}
/* 違和感演出（eerie：消えた椅子の跡などが微かに揺れ・点滅する）*/
.walk-obj.eerie .walk-obj-icon,.walk-obj.eerie .walk-obj-img{animation:eerieFlicker 3.4s ease-in-out infinite}
@keyframes eerieFlicker{0%,44%,100%{transform:translate(0,0) rotate(0);opacity:.92;filter:none}48%{transform:translate(-1px,-1px) rotate(-2deg);opacity:.5;filter:hue-rotate(45deg) brightness(1.25)}52%{transform:translate(1px,0) rotate(2deg);opacity:.95;filter:hue-rotate(-20deg)}70%{opacity:.7}}

</style>
</head>
<body>
<div class="screen" id="S-walk">
  <div class="walk-bg" id="walk-bg"></div>
  <div class="walk-hud" id="walk-hud">
    <span id="walk-hud-loc"></span>
    <span class="walk-hud-sep">/</span>
    <span id="walk-hud-time">17:17</span>
    <span class="walk-hud-clock">◷</span>
  </div>
  <div class="walk-world" id="walk-world">
    <div class="walk-layer" id="walk-layer"></div>
    <div class="walk-player" id="walk-player">
      <img class="walk-sprite walk-player-img" src="assets/tou_sprite_front.png" alt="トウ">
    </div>
  </div>
  <!-- M03A 探索会話（探索画面を保持したまま会話）-->
  <div class="m03a-dialog" id="m03a-dialog" onclick="M03A.next()">
    <img class="m03a-portrait" id="m03a-portrait" alt="" style="display:none">
    <div class="m03a-body">
      <div class="m03a-name" id="m03a-name" style="display:none"></div>
      <div class="m03a-text" id="m03a-text"></div>
      <div class="m03a-next" id="m03a-next">▸ タップして続ける</div>
    </div>
  </div>
  <div class="walk-controls">
    <div class="walk-dpad">
      <button class="walk-btn" id="walk-left" ontouchstart="WK.startMove(-1)" ontouchend="WK.stopMove()" onmousedown="WK.startMove(-1)" onmouseup="WK.stopMove()">←</button>
      <button class="walk-btn" id="walk-right" ontouchstart="WK.startMove(1)" ontouchend="WK.stopMove()" onmousedown="WK.startMove(1)" onmouseup="WK.stopMove()">→</button>
    </div>
    <div class="walk-info" id="walk-info">← → 移動</div>
    <button class="walk-btn walk-act" id="walk-act" onclick="WK.doAction()">Ⓐ 話す / 調べる</button>
  </div>
</div>
<div id="S-password" class="pw-screen">
  <h2>REWRITE MEMORY</h2>
  <input id="pw-input" type="password" maxlength="8" placeholder="····" autocomplete="off">
  <div id="pw-error"></div>
  <button id="pw-btn">ENTER</button>
</div>

<!-- SE 音量トグル（全画面共通） -->
<button class="se-toggle" id="se-toggle" aria-label="効果音 ON/OFF">♪ ON</button>

<!-- TITLE -->
<div class="screen active" id="S-title">
  <div style="text-align:center">
    <div class="title-logo">RewriteMemory</div>
    <div class="title-sub">記憶は、書き換えられる。</div>
    <button id="after-menu-btn" style="display:none;background:transparent;border:1px solid #2a3050;color:#6a78a0;padding:10px 28px;font-size:10px;letter-spacing:.2em;border-radius:2px;margin-bottom:8px;cursor:pointer">記 録 の 続 き</button>
<div id="after-menu-list" style="display:none;flex-direction:column;gap:6px;margin-bottom:12px"></div>
<div style="font-size:9px;color:#2a3550;letter-spacing:.08em;margin-bottom:18px;line-height:1.8;text-align:center;max-width:220px;padding:0 8px">記録から消えていく幼馴染の名前を、<br>プレイヤーが呼び続けるSF恋愛VN。</div>
<button class="start-btn" id="start-btn" style="animation:titlePulse 3s ease-in-out 1.2s infinite">はじめる</button>
  </div>
  <div style="position:absolute;bottom:16px;width:100%;text-align:center;font-size:8px;color:#1e2030;letter-spacing:.15em">GC2026 — Chapter 01</div>
</div>

<!-- SCENE / VN -->
<div class="screen" id="S-scene">
  <div class="scene-bg" id="scene-bg"></div>
  <div class="scene-sprites" id="scene-sprites"></div>
  <div id="explore-hotspots" style="display:none;position:absolute;inset:0;pointer-events:none"></div>

<script>
/* ═══ SPRITE SYSTEM ═══════════════════════════════════════ */
var SPRITES = {};
var _SC = {};

function mkSprite(id) {
  var d = SPRITES[id]; if (!d) return null;
  var s = 5, h = d.px.length, w = d.px[0].length;
  var c = document.createElement('canvas');
  c.width = w*s; c.height = h*s;
  var x = c.getContext('2d');
  for (var y=0;y<h;y++) for (var i=0;i<w;i++) {
    var ci = d.px[y][i];
    if (ci > 0 && d.pal[ci]) { x.fillStyle=d.pal[ci]; x.fillRect(i*s,y*s,s,s); }
  }
  return c.toDataURL();
}
function getSprite(id) { if(!_SC[id])_SC[id]=mkSprite(id); return _SC[id]||''; }

/* ═══ SOUND ENGINE (Web Audio API・全SE自作/ゼロ素材) ════════
   仕様: docs/specs/chapter01_se_spec.md
   - 外部音源ファイルは一切使わず、その場で波形を合成する
   - 音量ON/OFFは localStorage('se_enabled') に保存（既定ON）
   - テキストブリップは 80ms 間隔で連続再生制御
*/
var SE = (function(){
  var _ctx     = null;
  var _running = false;   /* resume()完了後にtrue */
  var _enabled = (localStorage.getItem('se_enabled') !== 'off');
  var _last    = 0;
  var INTERVAL = 72;
  var MASTER   = 0.30;

  /* AudioContextを生成/取得。まだrunningでなければnullを返す */
  function _ac() {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    if (!_ctx) {
      try { _ctx = new AC(); } catch(e){ return null; }
    }
    if (_running) return _ctx;
    /* suspended → resume()を呼んで、完了したら_running=trueにする */
    if (_ctx.state === 'suspended') {
      try {
        _ctx.resume().then(function(){ _running = true; });
      } catch(e) {}
      return null; /* まだrunningでないので今回は音を出さない */
    }
    /* すでにrunning（ユーザーがすでに操作済み等） */
    if (_ctx.state === 'running') { _running = true; return _ctx; }
    return null;
  }

  /* iOS / PC: ユーザージェスチャー内でOscillatorを即起動してautoplay制限を解除 */
  function _unlock() {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!_ctx) { try { _ctx = new AC(); } catch(e){ return; } }
    /* resume()を呼んで、完了したらrunning状態になることを保証 */
    if (_ctx.state === 'suspended') {
      try {
        _ctx.resume().then(function(){
          _running = true;
          /* 無音のoscillatorを1ms鳴らして確実にunlock（iOS対応） */
          try {
            var o = _ctx.createOscillator();
            var g = _ctx.createGain();
            g.gain.setValueAtTime(0.0001, _ctx.currentTime);
            o.connect(g); g.connect(_ctx.destination);
            o.start(_ctx.currentTime);
            o.stop(_ctx.currentTime + 0.001);
          } catch(e2) {}
        });
      } catch(e) {}
    } else if (_ctx.state === 'running') {
      _running = true;
    }
  }

  function _tone(freq, type, dur, gain, at, freqTo, reverb) {
    if (!_enabled) return;
    var c = _ac(); if (!c) return; /* runningでない間はスキップ */
    var t0 = c.currentTime + (at||0) + 0.005;
    var pk = (gain==null?0.18:gain) * MASTER;
    try {
      var osc = c.createOscillator(), gn = c.createGain();
      osc.type = type||'sine';
      osc.frequency.setValueAtTime(freq, t0);
      if (freqTo) osc.frequency.linearRampToValueAtTime(freqTo, t0+(dur||0.08));
      gn.gain.setValueAtTime(0.0001, t0);
      gn.gain.exponentialRampToValueAtTime(Math.max(0.0002,pk), t0+0.015);
      gn.gain.exponentialRampToValueAtTime(0.0001, t0+(dur||0.08));
      osc.connect(gn); gn.connect(c.destination);
      if (reverb) {
        var dl=c.createDelay(); dl.delayTime.value=0.06;
        var fb=c.createGain(); fb.gain.value=0.25;
        var wt=c.createGain(); wt.gain.value=0.35*MASTER;
        gn.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wt); wt.connect(c.destination);
      }
      osc.start(t0); osc.stop(t0+(dur||0.08)+(reverb?0.4:0.02));
    } catch(e) {}
  }

  function _noise(dur, gain, lp) {
    if (!_enabled) return;
    var c = _ac(); if (!c) return;
    var t0 = c.currentTime;
    try {
      var len = Math.floor(c.sampleRate*(dur||0.3));
      var buf = c.createBuffer(1,len,c.sampleRate);
      var arr = buf.getChannelData(0);
      for(var i=0;i<len;i++) arr[i]=(Math.random()*2-1)*(1-i/len);
      var src=c.createBufferSource(); src.buffer=buf;
      var gn=c.createGain(); gn.gain.value=(gain==null?0.09:gain)*MASTER;
      var node=src;
      if(lp){var f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=lp;src.connect(f);node=f;}
      node.connect(gn); gn.connect(c.destination); src.start(t0);
    } catch(e) {}
  }

  var SE = {
    unlock:    _unlock,
    resume:    function(){ _unlock(); },
    isEnabled: function(){ return _enabled; },
    toggle: function(){
      _enabled = !_enabled;
      try{ localStorage.setItem('se_enabled',_enabled?'on':'off'); }catch(e){}
      return _enabled;
    },
    blip: function(chr) {
      if(!_enabled) return;
      var now=Date.now();
      if(now-_last<INTERVAL) return;
      _last=now;
      if(chr==='mio'){
        _tone(520+(Math.random()*40-20),'triangle',0.06,0.13);
      } else if(chr==='noa'){
        _tone(880,'sine',0.07,0.10,0,null,true);
      } else {
        _tone(320,'sine',0.06,0.12);  /* トウ・その他 */
      }
    },
    select:         function(){ _tone(520,'sine',0.06,0.15); _tone(660,'sine',0.06,0.12,0.07); },
    notify:         function(){ _tone(880,'sine',0.08,0.13); _tone(1100,'sine',0.06,0.10,0.09); },
    notifyBlank:    function(){ _noise(0.35,0.06,600); },
    bell:function(){var f=[220,440,660,880],g=[0.28,0.18,0.10,0.06];for(var i=0;i<f.length;i++){(function(a,b,d){_tone(a,'sine',2.2,b,d);})(f[i],g[i],i*0.005);}},
    whiteout:function(){_noise(0.18,0.10,4000);_tone(1800,'sawtooth',0.25,0.08,0.05,200);},
    memoryClick:    function(){ _tone(1320,'sine',0.04,0.12); },
    reconstruction: function(){
      _tone(523,'sine',0.12,0.14);
      _tone(659,'sine',0.12,0.12,0.10);
      _tone(784,'sine',0.18,0.14,0.20);
    }
  };
  return SE;
})();

/* SE トグルボタン制御 */
(function() {
  var btn = document.getElementById('se-toggle');
  if (!btn) return;
  function paint() {
    try {
      var on = SE && SE.isEnabled ? SE.isEnabled() : true;
      btn.textContent = on ? '♪ ON' : '♪ OFF';
      btn.classList.toggle('off', !on);
    } catch(e) {}
  }
  paint();
  btn.addEventListener('click', function(e) {
    e.stopPropagation();
    try { if (SE) { SE.unlock(); var on = SE.toggle(); paint(); if (on) SE.select(); } } catch(e) {}
  });
})();

document.addEventListener('touchstart',function(){ SE.unlock(); },{passive:true,once:false});
/* ═══ SCENE ENGINE ═══════════════════════════════════════ */
var si=0, beat=0, tTimer=null;
var SCENES = []; /* ← シナリオデータはここに入る */

function sc() {
  if (typeof si === 'string') {
    var idx = SCENES.findIndex(function(s){ return s.id === si; });
    if (idx >= 0) { si = idx; } else { return null; }
  }
  return SCENES[si] || null;
}
function ns() {
  var s = sc();
  if (s && s.next) {
    var idx = SCENES.findIndex(function(x){ return x.id === s.next; });
    if (idx >= 0) { si = idx; runScene(); return; }
  }
  si++; runScene();
}

function runScene() {
  var s = sc(); if (!s) { showEnd(); return; }
  if (s.setFlag) setCh01Flag(s.setFlag);
  if (s.type === 'vn')     showVN(s);
  else if (s.type === 'memory') showMemory(s);
  else if (s.type === 'phone') showPhone(s);
  else if (s.type === 'continued') showContinued(s);
  else if (s.type === 'explore')   showExplore(s);
  else if (s.type === 'walk')      showWalk(s);
}



/* ━━━━ WALK ENGINE ━━━━ */
var WK = {
  scene: null,
  playerX: 20,   // %
  dir: 0,        // -1=左 1=右
  moveIv: null,
  nearTarget: null,
  SPEED: 0.4,    // %/tick
  WORLD_W: 200,  // ワールド幅(%)
};

function showWalk(s) {
  show('S-walk');
  WK.scene = s;
  WK.playerX = s.startX || 20;
  WK.dir = 0; WK.nearTarget = null;
  document.getElementById('walk-bg').style.background = s.bg || '#0a0a12';
  document.getElementById('walk-hud-loc').textContent = s.location || '';
  document.getElementById('walk-hud-time').textContent = s.time || '17:17';
  document.getElementById('walk-act').classList.remove('on');
  wkRender();
  clearInterval(WK.moveIv);
  WK.moveIv = setInterval(wkTick, 30);
  // キーボード
  WK._keydown = function(e) {
    if(e.key==='ArrowLeft'||e.key==='a') WK.dir=-1;
    if(e.key==='ArrowRight'||e.key==='d') WK.dir=1;
    if(e.key===' '||e.key==='Enter') WK.doAction();
  };
  WK._keyup = function(e) {
    if(['ArrowLeft','a','ArrowRight','d'].includes(e.key)) WK.dir=0;
  };
  window.addEventListener('keydown', WK._keydown);
  window.addEventListener('keyup',   WK._keyup);
}

WK.startMove = function(d){ WK.dir = d; };
WK.stopMove  = function(){ WK.dir = 0; };

WK.teardown = function() {
  clearInterval(WK.moveIv); WK.moveIv = null;
  window.removeEventListener('keydown', WK._keydown);
  window.removeEventListener('keyup',   WK._keyup);
  document.getElementById('walk-act').classList.remove('on');
};
// 探索を一時停止（M03A 会話中は移動・近接判定を止める）
WK.pause = function() {
  WK.dir = 0;
  clearInterval(WK.moveIv); WK.moveIv = null;
  window.removeEventListener('keydown', WK._keydown);
  window.removeEventListener('keyup',   WK._keyup);
  document.getElementById('walk-act').classList.remove('on');
};
// 探索へ復帰
WK.resume = function() {
  WK.dir = 0; WK.nearTarget = null;
  clearInterval(WK.moveIv);
  WK.moveIv = setInterval(wkTick, 30);
  window.addEventListener('keydown', WK._keydown);
  window.addEventListener('keyup',   WK._keyup);
};
// 遷移先シーンがあれば進む。なければ false
WK.gotoScene = function(t) {
  var next = t.scene;
  if (t.sceneIfFlag && hasCh01Flag(t.sceneIfFlag.flag)) next = t.sceneIfFlag.scene;
  if (next) {
    var idx = SCENES.findIndex(function(sc){ return sc.id === next; });
    if (idx >= 0) { si = idx; beat = 0; runScene(); return true; }
  }
  return false;
};

WK.doAction = function() {
  if (M03A.active) return;          // 会話中の二重起動を防ぐ
  if (!WK.nearTarget) return;
  var t = WK.nearTarget;
  if (t.setFlag) setCh01Flag(t.setFlag);
  // M03A 探索会話: 探索画面を保持したまま会話する（PortraitSmall・名前あり）
  if (t.talk && t.talk.length) {
    WK.pause();
    M03A.start(t.talk, function() {
      // 会話後、遷移先があれば進む。なければ探索へ戻る
      if (!WK.gotoScene(t)) WK.resume();
    });
    return;
  }
  // それ以外: フルシーンへ遷移（M03B イベント会話 / M04 等）
  WK.teardown();
  WK.gotoScene(t);
};

/* ━━━━ M03A 探索会話エンジン（探索画面を保持したまま会話）━━━━ */
/* lines: [{ name?, portrait?, text }] — name/portrait は任意（独り言・通知は名前なし）*/
var M03A = { lines: null, idx: 0, onDone: null, active: false };
M03A.start = function(lines, onDone) {
  if (!lines || !lines.length) { if (onDone) onDone(); return; }
  M03A.lines = lines; M03A.idx = 0; M03A.onDone = onDone || null; M03A.active = true;
  document.getElementById('m03a-dialog').classList.add('show');
  window.addEventListener('keydown', M03A._key);
  M03A.render();
};
M03A.render = function() {
  var ln = M03A.lines[M03A.idx] || {};
  var nameEl = document.getElementById('m03a-name');
  var portEl = document.getElementById('m03a-portrait');
  var textEl = document.getElementById('m03a-text');
  var nextEl = document.getElementById('m03a-next');
  // 名前あり（M03A）。独り言・システム通知など名前なしは省略
  if (ln.name) { nameEl.textContent = ln.name; nameEl.style.display = ''; }
  else { nameEl.style.display = 'none'; }
  // PortraitSmall（顔グラ）。指定が無ければ非表示
  if (ln.portrait) { portEl.src = ln.portrait; portEl.alt = ln.name || ''; portEl.style.display = ''; }
  else { portEl.removeAttribute('src'); portEl.style.display = 'none'; }
  textEl.textContent = ln.text || '';
  var last = M03A.idx >= M03A.lines.length - 1;
  nextEl.textContent = last ? '▸ とじる' : '▸ タップして続ける';
};
M03A.next = function() {
  if (!M03A.active) return;
  if (M03A.idx < M03A.lines.length - 1) { M03A.idx++; M03A.render(); return; }
  M03A.end();
};
M03A.end = function() {
  if (!M03A.active) return;
  M03A.active = false;
  document.getElementById('m03a-dialog').classList.remove('show');
  window.removeEventListener('keydown', M03A._key);
  var cb = M03A.onDone;
  M03A.onDone = null; M03A.lines = null;
  if (cb) cb();
};
M03A._key = function(e) {
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); M03A.next(); }
};

function wkTick() {
  if (WK.dir !== 0) {
    WK.playerX += WK.dir * WK.SPEED;
    var world_w = WK.scene ? (WK.scene.worldWidth || 160) : 160;
    WK.playerX = Math.max(2, Math.min(world_w - 5, WK.playerX));
    wkRender();
  }
  // 近接判定
  var objs = WK.scene ? (WK.scene.objects || []) : [];
  var near = null;
  objs.forEach(function(obj) {
    if (Math.abs(WK.playerX - obj.x) < 8) near = obj;
  });
  WK.nearTarget = near;
  // Aボタンは常時表示。近接時のみ白く点灯する
  document.getElementById('walk-act').classList.toggle('on', !!near);
}

function wkRender() {
  var player = document.getElementById('walk-player');
  var world  = document.getElementById('walk-world');
  var scene  = document.getElementById('S-walk');
  // カメラ追従
  var sw = scene.offsetWidth || window.innerWidth;
  var worldPx = (WK.scene ? (WK.scene.worldWidth || 160) : 160) / 100 * sw;
  var playerPx = WK.playerX / 100 * worldPx;
  var camX = Math.max(0, Math.min(worldPx - sw, playerPx - sw/2));
  world.style.width = worldPx + 'px';
  world.style.transform = 'translateX(' + (-camX) + 'px)';
  player.style.left = WK.playerX + '%';
  // オブジェクト描画
  var layer = document.getElementById('walk-layer');
  layer.innerHTML = '';
  (WK.scene ? (WK.scene.objects || []) : []).forEach(function(obj) {
    var isNpc = obj.type === 'npc';
    var near  = Math.abs(WK.playerX - obj.x) < 8;
    var el = document.createElement('div');
    el.className = (isNpc ? 'walk-npc' : 'walk-obj') + (near ? ' near' : '') + (obj.eerie ? ' eerie' : '');
    el.style.left = obj.x + '%';
    // 頭上インジケーター（話せる=… / 調べられる=✦）
    var ind=document.createElement('div');
    ind.className='walk-ind'+(near?' near':'');
    ind.textContent = isNpc ? '…' : '✦';
    el.appendChild(ind);
    if (isNpc) {
      if (obj.sprite) { var im=document.createElement('img'); im.className='walk-sprite walk-npc-img'; im.src=obj.sprite; im.alt=obj.name||''; el.appendChild(im); }
      else { var hd=document.createElement('div'); hd.className='walk-npc-head'; var bd=document.createElement('div'); bd.className='walk-npc-body'; if(obj.color) bd.style.background=obj.color; el.appendChild(hd); el.appendChild(bd); }
      var nm=document.createElement('div'); nm.className='walk-npc-name'; nm.textContent=obj.name||''; el.appendChild(nm);
    } else {
      if (obj.sprite) { var im2=document.createElement('img'); im2.className='walk-sprite walk-obj-img'; im2.src=obj.sprite; im2.alt=obj.name||''; el.appendChild(im2); }
      else { var ic=document.createElement('div'); ic.className='walk-obj-icon'; ic.textContent=obj.icon||'◆'; el.appendChild(ic); }
      var lb=document.createElement('div'); lb.className='walk-obj-name'; lb.textContent=obj.name||''; el.appendChild(lb);
    }
    // 近接ハイライト（白いにじみのアクションラベル）
    if (near) {
      var act=document.createElement('div'); act.className='walk-action';
      act.textContent=obj.action||'話す'; act.style.bottom='130%'; act.style.left='50%';
      el.appendChild(act);
    }
    layer.appendChild(el);
  });
}

/* EXPLORE ENGINE */
function showExplore(s){
  show('S-scene');
  document.getElementById('scene-bg').style.background = s.bg||'#0a0a12';
  updateSprites([]);
  var zone=document.getElementById('explore-hotspots');
  zone.style.display='block'; zone.innerHTML='';
  var hint=document.createElement('div');
  hint.className='explore-hint'; hint.textContent='タップして調べる';
  zone.appendChild(hint);
  (s.hotspots||[]).forEach(function(hs){
    var btn=document.createElement('button');
    btn.className='hotspot-btn';
    btn.textContent=hs.label;
    btn.style.left=hs.x+'%'; btn.style.top=hs.y+'%';
    btn.onclick=function(){
      zone.style.display='none';
      if(typeof hs.next==='string'){
        var idx=SCENES.findIndex(function(sc){return sc.id===hs.next;});
        if(idx>=0){si=idx;beat=0;runScene();}
      }
    };
    zone.appendChild(btn);
  });
  if(s.skip){
    var skipBtn=document.createElement('button');
    skipBtn.textContent=s.skipLabel||'先に進む →';
    skipBtn.style.cssText='position:absolute;bottom:196px;right:14px;background:transparent;border:1px solid #1e2838;color:#3a4858;font-size:9px;padding:6px 12px;letter-spacing:.1em;cursor:pointer;font-family:inherit;pointer-events:all';
    skipBtn.onclick=function(){
      zone.style.display='none';
      var idx=SCENES.findIndex(function(sc){return sc.id===s.skip;});
      if(idx>=0){si=idx;beat=0;runScene();}
    };
    zone.appendChild(skipBtn);
  }
}

function updateMioSprite(spk,beatText){
  var el=document.getElementById("mio-sp"); if(!el) return;
  var n=(spk&&(spk.name||spk))||"";
  if(["ミオ","＿＿"].indexOf(n)>=0){
    // 不安・怖い表情のキーワード
    var anxiousKW=["大丈夫","怖","消え","いなければ","迷惑","ここにいる","ちゃんと"];
    var isAnxious=anxiousKW.some(function(k){ return (beatText||"").indexOf(k)>=0; });
    el.src=isAnxious ? MIO_SRC_ANXIOUS : MIO_SRC_NORMAL;
    el.classList.add("vis");
  } else { el.classList.remove("vis"); }
}
/* ビート表示条件: ifAllFlags が全て立つ時のみ表示（未指定なら常に表示・後方互換）*/
function beatActive(b) {
  if (b && b.ifAllFlags) {
    for (var i = 0; i < b.ifAllFlags.length; i++) {
      if (!hasCh01Flag(b.ifAllFlags[i])) return false;
    }
  }
  return true;
}
function activeBeats(s) { return (s.beats || []).filter(beatActive); }

function showVN(s) {
  show('S-scene');
  beat = 0;
  s._ab = activeBeats(s);
  var bg = document.getElementById('scene-bg');
  bg.style.background = s.bg || '#0a0a12';
  showBeat(s);
}

/* 話者名 → ブリップ用キャラキー（ト書き=無音） */
function blipKey(speaker) {
  if (!speaker || !speaker.name) return null;
  var n = speaker.name;
  if (n.indexOf('トウ') >= 0) return 'tou';
  if (n.indexOf('ミオ') >= 0) return 'mio';
  if (n.indexOf('ノア') >= 0) return 'noa';
  return null;
}

function showBeat(s) {
  var b = (s._ab || s.beats)[beat]; if (!b) { ns(); return; }
  var sp = document.getElementById('dlg-speaker');
  var nm = document.getElementById('dlg-name');
  var rl = document.getElementById('dlg-role');
  var tx = document.getElementById('dlg-text');
  var inn = document.getElementById('dlg-inner');
  var nx = document.getElementById('dlg-next');
  tx.textContent=''; inn.textContent=''; inn.style.display='none'; nx.style.display='none';

  /* スプライト更新 */
  updateSprites(b.sprites);
  /* ミオの立ち絵を自動表示（スプライトが空の時） */
  (function(){
    var zone=document.getElementById('scene-sprites');
    var spkName=(b.speaker&&b.speaker.name)||'';
    var showMio=['ミオ','＿＿','＿　オ'].indexOf(spkName)>=0;
    if(showMio && zone.innerHTML===''){
      var anxKW=['大丈夫','怖','消え','いなければ','ここにいる','ちゃんと'];
      var src=anxKW.some(function(k){return(b.text||'').indexOf(k)>=0;})?MIO_SRC_ANXIOUS:MIO_SRC_NORMAL;
      var el=document.createElement('img');
      el.style.cssText='image-rendering:pixelated;image-rendering:crisp-edges;width:130px;height:auto;opacity:0;transition:opacity .4s,transform .3s;transform:translateY(8px)';
      el.src=src;
      zone.appendChild(el);
      setTimeout(function(){el.style.opacity='1';el.style.transform='translateY(0)';},30);
    }
  })();

  if (b.speaker) {
    sp.style.display='flex';
    nm.textContent=b.speaker.name; nm.style.color=b.speaker.color||'#c8d0e8';
    rl.textContent=b.speaker.role||'';
  } else {
    sp.style.display='none';
  }

  if (b.text) typewrite(tx, b.text, 16, blipKey(b.speaker));
  if (b.inner) { inn.style.display='block'; typewrite(inn, b.inner, 14, null); }
  setTimeout(function(){ nx.style.display='block'; }, 400);
}

function updateSprites(list) {
  var zone = document.getElementById('scene-sprites');
  zone.innerHTML = '';
  if (!list) return;
  list.forEach(function(sp) {
    var wrap = document.createElement('div'); wrap.className='sprite-wrap';
    var src = getSprite(sp.id);
    if (src) {
      var img = document.createElement('img');
      img.src=src; img.className='sprite-img';
      img.style.height = (sp.height||96)+'px';
      if (sp.flip) img.style.transform='scaleX(-1)';
      wrap.appendChild(img);
    }
    if (sp.label) {
      var lbl = document.createElement('div'); lbl.className='sprite-name';
      lbl.textContent=sp.label; wrap.appendChild(lbl);
    }
    zone.appendChild(wrap);
  });
}

function typewrite(el, txt, spd, blipChar) {
  if(tTimer)clearInterval(tTimer);
  el.textContent=''; var i=0;
  tTimer=setInterval(function(){
    var ch=txt[i++];
    el.textContent+=ch;
    /* 空白・改行以外の文字でキャラ別ブリップ（内部で80ms制御） */
    if(blipChar && ch && ch!=='\n' && ch!=='　' && ch!==' ') SE.blip(blipChar);
    if(i>=txt.length){clearInterval(tTimer);tTimer=null;}
  }, spd||14);
}

document.getElementById('S-scene').addEventListener('click', function() {
  SE.resume();
  if (tTimer) { clearInterval(tTimer); tTimer=null;
    var s=sc(); var _ab=s&&(s._ab||s.beats); if(_ab&&_ab[beat]) {
      var b=_ab[beat];
      document.getElementById('dlg-text').textContent=b.text||'';
      if(b.inner)document.getElementById('dlg-inner').textContent=b.inner;
    }
    document.getElementById('dlg-next').style.display='block'; return;
  }
  beat++;
  var s=sc();
  if(s&&(s._ab||s.beats)&&beat<(s._ab||s.beats).length) showBeat(s);
  else ns();
});

/* ═══ MEMORY REWRITE ═══════════════════════════════════ */
var selectedMemory = null;

function showMemory(s) {
  show('S-memory');
  selectedMemory = null;
  var ct = document.getElementById('memory-cards');
  var btn = document.getElementById('memory-confirm');
  ct.innerHTML=''; btn.style.display='none';
  /* タイトル/確認ラベルはシーンで上書き可（未指定なら記憶書き換えの既定）*/
  var titleEl = document.querySelector('#S-memory .memory-title');
  if (titleEl) titleEl.textContent = s.title || '── 記憶の書き換え ──';
  btn.textContent = s.confirmLabel || 'この記憶を書き換える';

  var opts = s.options || s.choices || [];
  opts.forEach(function(opt, i) {
    var card = document.createElement('div'); card.className='memory-card';
    var _lbl = s.title ? '' : ('記憶 '+(i+1));
    card.innerHTML=(_lbl?'<div class="memory-card-label">'+_lbl+'</div>':'')
      +'<div class="memory-card-text">'+(opt.text||opt.label||'')+'</div>';
    card.onclick = function() {
      SE.resume();
      SE.memoryClick(); /* 記憶断片クリック */
      document.querySelectorAll('.memory-card').forEach(function(c){c.classList.remove('selected');});
      card.classList.add('selected');
      selectedMemory = opt;
      btn.style.display='block';
    };
    ct.appendChild(card);
  });

  var isReconstruction = (s.id && s.id.indexOf('reconstruction') >= 0);
  btn.onclick = function() {
    if (!selectedMemory) return;
    /* intent分類でCh01 stateを更新 */
    applyChoiceIntent(selectedMemory.intent);
    if (selectedMemory.setFlag) setCh01Flag(selectedMemory.setFlag);
    /* 再構成シーンで正解（次へ進む）なら和音、それ以外は選択音 */
    if (isReconstruction && selectedMemory.next) SE.reconstruction();
    else SE.select();
    if (selectedMemory.next) { si = selectedMemory.next; runScene(); }
    else ns();
  };
}

/* ═══ PHONE / 章末・空白メッセージ ════════════════════ */
var phone = { msgs: [], idx: 0, done: false, timer: null };

function escapeHtml(t) {
  return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
/* 文字列、または [{t:'通常'},{b:'　　'}] 形式（b=白く抜ける部分）を描画 */
function renderSeg(seg) {
  if (seg == null) return '';
  if (typeof seg === 'string') return escapeHtml(seg);
  return seg.map(function(p) {
    if (p.b != null) return '<span class="blank">' + escapeHtml(p.b) + '</span>';
    return escapeHtml(p.t || '');
  }).join('');
}

function addPhoneMsg(m) {
  var thread = document.getElementById('phone-thread');
  var wrap = document.createElement('div');
  wrap.className = 'msg' + (m.unknown ? ' unknown' : '');
  var from = document.createElement('div'); from.className = 'msg-from';
  from.innerHTML = renderSeg(m.from);
  var bub = document.createElement('div'); bub.className = 'msg-bubble';
  bub.innerHTML = renderSeg(m.text);
  wrap.appendChild(from); wrap.appendChild(bub);
  thread.appendChild(wrap);
  thread.scrollTop = thread.scrollHeight;
}

/* 空白メッセージ判定（unknown、または b: 抜け部分を含むセグメント） */
function segHasBlank(seg) {
  if (!seg || typeof seg === 'string') return false;
  return seg.some(function(p) { return p && p.b != null; });
}
function isBlankMsg(m) {
  return !!(m.unknown || segHasBlank(m.text) || segHasBlank(m.text_parts) ||
            segHasBlank(m.from) || segHasBlank(m.from_parts));
}

function phoneStep() {
  if (phone.idx >= phone.msgs.length) {
    phone.done = true;
    document.getElementById('phone-next').style.display = 'block';
    return;
  }
  var m = phone.msgs[phone.idx++];
  addPhoneMsg(m);
  if (isBlankMsg(m)) SE.notifyBlank(); else SE.notify();
  phone.timer = setTimeout(phoneStep, m.delay || 900);
}

function showPhone(s) {
  var td=document.getElementById('phone-time-display');
  if(td){ var h=String(9+Math.floor(Math.random()*3)).padStart(2,'0'),m=String(Math.floor(Math.random()*60)).padStart(2,'0'); td.textContent=h+':'+m; }
  show('S-phone');
  if (phone.timer) { clearTimeout(phone.timer); phone.timer = null; }
  phone.msgs = s.messages || [];
  phone.idx = 0; phone.done = false;
  document.getElementById('phone-header').textContent = s.header || 'メッセージ';
  document.getElementById('phone-thread').innerHTML = '';
  document.getElementById('phone-next').style.display = 'none';
  phoneStep();
}

document.getElementById('S-phone').addEventListener('click', function() {
  SE.resume();
  if (!phone.done) {
    /* 残りメッセージを一括表示（音は最後に1回だけ：空白があれば不安音） */
    if (phone.timer) { clearTimeout(phone.timer); phone.timer = null; }
    var sawBlank = false;
    while (phone.idx < phone.msgs.length) {
      var rm = phone.msgs[phone.idx++];
      if (isBlankMsg(rm)) sawBlank = true;
      addPhoneMsg(rm);
    }
    if (sawBlank) SE.notifyBlank(); else SE.notify();
    phone.done = true;
    document.getElementById('phone-next').style.display = 'block';
    return;
  }
  ns();
});

/* ═══ CHAPTER END ═════════════════════════════════════ */
function showContinued(s) {
  if (s && s.flag) {
    try { localStorage.setItem(s.flag, '1'); } catch(e) {}
    updateTitleMenu();
  }
  var lbl = document.getElementById('cont-label');
  if (lbl) lbl.textContent = (s && s.label) ? s.label : '';
  show('S-continued');
  var btn = document.getElementById('cont-btn');
  /* 次のシーンがあれば「次の章へ」、なければ「タイトルへ戻る」 */
  var hasNext = (si + 1) < SCENES.length;
  btn.textContent = hasNext ? '次の章へ' : 'タイトルへ戻る';
  /* クリックハンドラを付け替え（重複防止） */
  var newBtn = btn.cloneNode(true);
  btn.parentNode.replaceChild(newBtn, btn);
  newBtn.addEventListener('click', function() {
    if (hasNext) { si++; beat=0; runScene(); }
    else { showEnd(); }
  });
}

function show(id) {
  document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});
  document.getElementById(id).classList.add('active');
}
function showEnd() {

}

var AFTER_MAP = {
  'rwm_end_memory_bureau': {scene:'after_memory_bureau', label:'保護された名前'},
  'rwm_end_unlog':         {scene:'after_unlog',         label:'記録されない朝'},
  'rwm_end_true':          {scene:'after_true',          label:'名前を呼ぶ朝'}
};

function updateTitleMenu() {
  var keys = Object.keys(AFTER_MAP);
  var reached = keys.filter(function(k){ try { return !!localStorage.getItem(k); } catch(e){ return false; } });
  var menuBtn = document.getElementById('after-menu-btn');
  var menuList = document.getElementById('after-menu-list');
  if (!menuBtn || !menuList) return;
  if (reached.length === 0) { menuBtn.style.display='none'; return; }
  menuBtn.style.display = 'block';
  menuList.innerHTML = '';
  reached.forEach(function(k){
    var info = AFTER_MAP[k];
    var li = document.createElement('button');
    li.className = 'after-item';
    li.textContent = info.label;
    li.onclick = function(){
      SE.unlock();
      menuList.style.display = 'none';
      var idx = SCENES.findIndex(function(s){ return s.id === info.scene; });
      if (idx >= 0) { si = idx; beat = 0; runScene(); }
    };
    menuList.appendChild(li);
  });
  var newMenuBtn = menuBtn.cloneNode(false);
  newMenuBtn.textContent = menuBtn.textContent;
  newMenuBtn.style.cssText = menuBtn.style.cssText;
  menuBtn.parentNode.replaceChild(newMenuBtn, menuBtn);
  newMenuBtn.onclick = function(){
    menuList.style.display = menuList.style.display === 'block' ? 'none' : 'block';
  };
}

/* ═══ Ch01 STATE ═══════════════════════════════════════════
   Ch01のみで使用する最小state。localStorageには保存しない。
   ═══════════════════════════════════════════════════════ */
var CH01_STATE = {
  observation: 0,
  trust: 0,
  choseNotToLook: false,
  fragments: [],
  flags: {}
};
/* シーン進行フラグ（mio_first_talked 等）。Ch01最小state同様 localStorage には保存しない。 */
function setCh01Flag(name) { if (name) CH01_STATE.flags[name] = true; }
function hasCh01Flag(name) { return !!CH01_STATE.flags[name]; }
function addCh01Fragment(id) {
  if (!id) return;
  if (CH01_STATE.fragments.indexOf(id) === -1) {
    CH01_STATE.fragments.push(id);
  }
}
function applyChoiceIntent(intent) {
  if (!intent) return;
  if (intent === 'observe')           { CH01_STATE.observation++; addCh01Fragment('fifth_seat_mark'); }
  if (intent === 'avoid_observation') { CH01_STATE.trust++; CH01_STATE.choseNotToLook = true; }
  if (intent === 'ask')               { CH01_STATE.trust += 0.5; addCh01Fragment('mio_memory_fragment'); }
  if (intent === 'wait')              { CH01_STATE.trust++; addCh01Fragment('mio_voluntary_speech'); }
}

SCENES = [{"id": "ch01_hook", "type": "vn", "bg": "linear-gradient(180deg,#f8f8fc,#f0f0f8)", "beats": [{"text": "白い広場。\n時計塔。\n誰もいない。\nミオだけが目の前にいた。", "speaker": null, "sprites": []}, {"text": "「ミオ」\nトウが呼んだ。", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "ミオは少し笑った。\n怖い時ほど笑う、あの笑い方だった。", "speaker": null, "sprites": []}, {"text": "「ごめんなさい」\nミオが言った。", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「あなたは、誰ですか？」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "その瞬間、スマホが震えた。\n\n17:17\nミオ：空いている席で待ってる", "speaker": null, "sprites": []}, {"text": "通知を開いた。\n本文は、空白だった。\n\nミオ：\n\n（既読だけが付いていた。\n開いた覚えはなかった。）", "speaker": null, "sprites": []}, {"text": "画面が白くなった。", "speaker": null, "sprites": []}, {"text": "── 3日前 ──", "speaker": null, "sprites": []}], "next": "ch01_morning_new"}, {"id": "ch01_morning_new", "type": "vn", "bg": "linear-gradient(180deg,#0e1018,#080c14)", "beats": [{"text": "朝。\n台所。\n叔母が焼きたてのパンを切っていた。\n母のエプロンをつけて。", "speaker": null, "sprites": []}, {"text": "「今日も時計塔？」", "speaker": {"name": "叔母", "color": "#c8a890", "role": ""}, "sprites": []}, {"text": "「まだ何も言ってない」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「顔に書いてある。誰かを待ちます、って」", "speaker": {"name": "叔母", "color": "#c8a890", "role": ""}, "sprites": []}, {"text": "遠くで、時計塔の鐘が鳴った。", "speaker": null, "sprites": []}, {"text": "「鐘が鳴ったね。今日の記録も整ったみたい」", "speaker": {"name": "叔母", "color": "#c8a890", "role": ""}, "sprites": []}, {"text": "「整った、か」\nトウはスマホを見た。\n17:17の空白メッセージの履歴が残っている。", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「あの子、名前を呼ばれると安心するって。\nお母さんがよく言ってた」", "speaker": {"name": "叔母", "color": "#c8a890", "role": ""}, "sprites": []}, {"text": "「母さんが？」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「……たぶんね」\n叔母は少し間を置いた。\n「やだね。覚えてることから先に怪しくなる」", "speaker": {"name": "叔母", "color": "#c8a890", "role": ""}, "sprites": []}, {"text": "廊下の奥、母の部屋のドアが少しだけ開いていた。\n中は静かだった。", "speaker": null, "sprites": []}], "next": "ch01_walk_plaza"}, {"id": "ch01_walk_plaza", "type": "walk", "bg": "#0a0a12 url(assets/white_square_bg.png) center/cover no-repeat", "location": "時計塔前の広場", "startX": 15, "worldWidth": 180, "objects": [{"type": "npc", "name": "ミオ", "x": 55, "color": "#8090c8", "action": "ミオに話しかける", "scene": "ch01_211_mio_plaza_talk", "setFlag": "mio_first_talked", "sprite": "assets/mio_sprite_front.png", "sceneIfFlag": {"flag": "package_opened", "scene": "ch01_214_mio_reacted"}}, {"type": "obj", "name": "5席目の跡", "icon": "□", "x": 90, "action": "跡を調べる", "scene": "ch01_explore_seat", "eerie": true}, {"type": "obj", "name": "時計塔", "icon": "🕰", "x": 140, "action": "見上げる", "scene": "ch01_explore_tower"}, {"type": "obj", "name": "小包", "icon": "📦", "sprite": "assets/package_object.png", "x": 35, "action": "小包を調べる", "scene": "ch01_212_package_inspect", "setFlag": "package_inspected", "sceneIfFlag": {"flag": "package_opened", "scene": "ch01_213_package_opened_again"}}]}, {"id": "ch01_211_mio_plaza_talk", "type": "vn", "bg": "linear-gradient(180deg,#141620,#0c0e18)", "beats": [{"text": "「……ここ、前にも来た気がする」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「白い広場？」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「ううん。誰かに呼ばれた感じだけ、覚えてる」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}], "next": "ch01_212_package_inspect"}, {"id": "ch01_214_mio_reacted", "type": "vn", "bg": "linear-gradient(180deg,#141620,#0c0e18)", "beats": [{"text": "「……それ、どこで見つけたの」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「広場に置いてあった」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「変だね。知らないはずなのに、怖い」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「ミオ？」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「名前を呼ばれると、少しだけ戻ってこられる気がする」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}], "setFlag": "mio_reacted_to_package", "next": "ch01_clocktower"}, {"id": "ch01_212_package_inspect", "type": "vn", "bg": "linear-gradient(180deg,#141620,#0c0e18)", "beats": [{"text": "白い広場の中央に、見覚えのない小包が置かれている。", "speaker": null, "sprites": []}, {"text": "宛名はない。", "speaker": null, "sprites": []}, {"text": "けれど、ずっと前からここにあったように見える。", "speaker": null, "sprites": []}], "next": "ch01_213_open_choice"}, {"id": "ch01_213_open_choice", "type": "memory", "title": "── 小包 ──", "confirmLabel": "決める", "options": [{"text": "開ける", "setFlag": "package_opened", "next": "ch01_213_package_contents"}, {"text": "開けない", "next": "ch01_walk_plaza"}]}, {"id": "ch01_213_package_contents", "type": "vn", "bg": "linear-gradient(180deg,#141620,#0c0e18)", "beats": [{"text": "包みの中には、丁寧に束ねられた髪が入っていた。", "speaker": null, "sprites": []}, {"text": "その髪には、見覚えのあるリボンが結ばれている。", "speaker": null, "sprites": []}, {"text": "ミオが、いつも髪につけていたものだ。", "speaker": null, "sprites": []}, {"text": "一番下には、白い手紙が一枚だけ入っている。", "speaker": null, "sprites": []}, {"text": "けれど、そこには何も書かれていない。", "speaker": null, "sprites": []}], "next": "ch01_walk_plaza"}, {"id": "ch01_213_package_opened_again", "type": "vn", "bg": "linear-gradient(180deg,#141620,#0c0e18)", "beats": [{"text": "小包は、もう開いている。", "speaker": null, "sprites": []}, {"text": "束ねられた髪。ミオのリボン。そして、白紙の手紙。", "speaker": null, "sprites": []}, {"text": "何度見ても、宛名はない。", "speaker": null, "sprites": []}], "next": "ch01_walk_plaza"}, {"id": "ch01_clocktower", "type": "vn", "bg": "linear-gradient(180deg,#141620,#0c0e18)", "beats": [{"text": "夕方。\n時計塔前のベンチ。\n横一列に4つの席がある。", "speaker": null, "sprites": []}, {"text": "ミオは迷わず、左から二番目に座った。", "speaker": null, "sprites": []}, {"text": "「今日もそこ？」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「座り心地じゃないよ」\nミオが言った。\n「ここに座ってると、少しだけ静かになるの」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「頭の中で、紙から文字を剥がすみたいな音がする時がある。\nでもここだと、少し止まる」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「ミオ」\nトウが呼んだ。", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "一瞬、音が止まった。\n\nミオ「……止まった」\nミオ「今のは、ちゃんと私だった」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}], "next": "ch01_211_mio_plaza_talk"}, {"id": "ch01_explore_bench", "type": "explore", "bg": "linear-gradient(180deg,#141620,#0c0e18)", "hotspots": [{"label": "ミオに話しかける", "x": 55, "y": 40, "next": "ch01_explore_talk"}, {"label": "5席目の跡を調べる", "x": 72, "y": 58, "next": "ch01_explore_seat"}, {"label": "時計塔を見上げる", "x": 30, "y": 20, "next": "ch01_explore_tower"}], "skip": "ch01_1717", "skipLabel": "17:17 →"}, {"id": "ch01_explore_talk", "type": "vn", "bg": "linear-gradient(180deg,#141620,#0c0e18)", "beats": [{"text": "ミオに声をかけた。", "speaker": null, "sprites": []}, {"text": "「頭の中、どんな感じ？」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「紙から文字を剥がすみたいな音がする。\nでもトウが話しかけてくると——少し静かになる」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「名前を呼ぼうか」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「……うん。呼んで」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「ミオ」\n一瞬、音が止まった。\nミオが少しだけ安心した顔をした。", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}], "next": "ch01_explore_bench"}, {"id": "ch01_explore_seat", "type": "vn", "bg": "linear-gradient(180deg,#141620,#0c0e18)", "beats": [{"text": "右端のさらに先。地面に四角い跡がある。", "speaker": null, "sprites": []}, {"text": "「なんだこれ」\nかがんで触ろうとした。", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「——やめて」\nミオが胸を押さえた。", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「大丈夫？」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「……うん。なんか、触らない方がいい気がした」\nミオは跡から目をそらした。\n「案内板には4席って書いてある。でも、影は5つある」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}], "next": "ch01_clocktower"}, {"id": "ch01_explore_tower", "type": "vn", "bg": "linear-gradient(180deg,#141620,#0c0e18)", "beats": [{"text": "時計塔を見上げた。", "speaker": null, "sprites": []}, {"text": "記録整合の時計塔。\n毎日17:17に鐘が鳴る。\n生活ログが同期される。", "speaker": null, "sprites": []}, {"text": "（昨日の17:17に空白メッセージが届いた。\nミオから。でも、ミオは送っていないと言った。）", "speaker": null, "sprites": []}, {"text": "ミオが少し黙って、時計塔の方を見た。\n一瞬だけ——笑顔が消えた。", "speaker": null, "sprites": []}, {"text": "「ミオ、時計塔が気になる？」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「なんでもない」\nミオはすぐに笑顔を戻した。\nでも目線だけはまだ塔を向いていた。", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}], "next": "ch01_explore_bench"}, {"id": "ch01_1717", "type": "phone", "messages": [{"from": "ミオ", "text": [{"t": "空いている席で待ってる"}], "delay": 1200}], "next": "ch01_1717_after"}, {"id": "ch01_1717_after", "type": "vn", "bg": "linear-gradient(180deg,#141620,#0c0e18)", "beats": [{"text": "17:17。時計塔の鐘が鳴った。\n同時に、スマホに通知が届いた。", "speaker": null, "sprites": []}, {"text": "目の前のミオはスマホを触っていない。", "speaker": null, "sprites": []}, {"text": "「今、送った？」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「……来たんだ」\nミオが言った。\n「ごめん。たぶん、それ、まだ見ちゃだめ」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "通知を開いた。\n本文は空白だった。\n既読だけが付いていた。\nトウは開いた覚えがない。", "speaker": null, "sprites": []}], "next": "ch01_bench_seats"}, {"id": "ch01_bench_seats", "type": "vn", "bg": "linear-gradient(180deg,#141620,#0c0e18)", "beats": [{"text": "ミオが、4つ並んだベンチの右端のさらに先を見た。", "speaker": null, "sprites": []}, {"text": "「あそこ、まだ空いてるね」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「どこ？」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「五つ目」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「席は四つしかないよ」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「……そう、だよね」\nミオは小さく笑った。", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "地面を見ると、右端のさらに先に四角い跡があった。\n\n[席1][席2][席3][席4][跡]\n\nまるで昔そこにもう一つ席が固定されていたような跡。\n案内板には「時計塔前ベンチ：4席」と書かれている。", "speaker": null, "sprites": []}, {"text": "古い写真にもベンチは4席しか写っていない。\nしかし影だけは、5つある。", "speaker": null, "sprites": []}], "next": "ch01_060_choice"}, {"id": "ch01_anlog_flood", "type": "phone", "messages": [{"from": "system", "text": [{"t": "[17:17:05] 観測点：トウ"}], "delay": 600}, {"from": "system", "text": [{"t": "[17:17:06] 対象：ミオ\n[17:17:07] 関係強度：最大\n[17:17:08] アンログ共鳴：開始"}], "delay": 1000}, {"from": "??", "text": [{"b": "来て"}], "delay": 800}, {"from": "??", "text": [{"b": "待ってた"}], "delay": 600}, {"from": "??", "text": [{"b": "名前、呼んで"}], "delay": 700}, {"from": "??", "text": [{"b": "見ないで"}], "delay": 500}, {"from": "??", "text": [{"b": "でも、忘れないで"}], "delay": 800}, {"from": "system", "text": [{"t": "[17:17:33] 記録化失敗\n[17:17:34] 理由：本人発話\n[17:17:35] 次回観測予定：明日 17:17"}], "delay": 1200}], "next": "ch01_anlog_end"}, {"id": "ch01_anlog_end", "type": "vn", "bg": "linear-gradient(180deg,#06060e,#030308)", "beats": [{"text": "スマホに最後の通知が届いた。\n\nミオ：明日、空いている席で待ってる", "speaker": null, "sprites": []}, {"text": "数秒後、送信者名が変わった。\n\n送信者：ミオ\n↓\n送信者：トウ", "speaker": null, "sprites": []}, {"text": "（送った覚えは、なかった。\nでも、既読だけは付いていた。）", "speaker": null, "sprites": []}], "next": "ch01_099_continued"}, {"id": "legacy_ch01_030_missing_chair", "type": "vn", "bg": "linear-gradient(180deg,#06060e,#080814)", "beats": [{"text": "そこには、何もなかった。\n昨日まであったはずの古い椅子が——ない。", "speaker": null, "sprites": []}, {"text": "地面には、四角い跡だけが残っている。\n椅子の脚が長い間そこにあった証拠。", "speaker": null, "sprites": []}, {"text": "「消えてる。」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「撤去されたのか」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「でも、誰も覚えてない」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "清掃員。通行人。近くの店員。\n誰に聞いても答えは同じだった。\n「そんな椅子、ありましたっけ。」", "speaker": null, "sprites": []}, {"text": "（おかしい——絶対に、おかしい。あの椅子は、確かにあった。）", "speaker": null, "sprites": []}, {"text": "ミオは軽く笑った。怖い時の笑い方だった。", "speaker": null, "sprites": []}, {"text": "「……わたしたち、あそこに座ったよね？　ね？」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「違う。ミオが怖がってる。それが証拠だ。」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「……そういうところ、ほんと変」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「でも、今のは嫌じゃない」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}]}, {"id": "ch01_060_choice", "type": "memory", "prompt": "どうする？", "options": [{"text": "五つ目の跡をよく見る", "intent": "observe", "next": "ch01_070a_observe"}, {"text": "そこから目をそらす", "intent": "avoid_observation", "next": "ch01_070b_dont_look"}, {"text": "ミオに「ここ、覚えてる？」と聞く", "intent": "ask", "next": "ch01_070c_listen"}, {"text": "ミオが話すまで待つ", "intent": "wait", "next": "ch01_070d_wait"}]}, {"id": "ch01_070a_observe", "type": "vn", "bg": "linear-gradient(180deg,#060610,#080818)", "beats": [{"text": "椅子の跡に手を伸ばした。\n指先が触れた瞬間、視界が白く弾ける。", "speaker": null, "sprites": []}, {"text": "（雨上がりの広場。濡れた椅子。ハンカチを敷く手。ミオの笑い声。\nでも、その笑い声の奥に、小さな震えがある。）", "speaker": null, "sprites": []}, {"text": "視界が戻った時、ミオは胸元を押さえていた。", "speaker": null, "sprites": []}, {"text": "「……今、何を見たの？」", "speaker": {"name": "＿　オ", "color": "#404060", "role": ""}, "sprites": []}, {"text": "（ミオの名前が、一瞬だけ白く抜けた気がした。）", "speaker": null, "sprites": []}, {"text": "トウ", "speaker": {"name": "＿　オ", "color": "#404060", "role": ""}, "sprites": []}, {"text": "今の、私から何か持っていった？", "speaker": {"name": "＿　オ", "color": "#404060", "role": ""}, "sprites": []}, {"text": "「…気づいてたんだ。」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": [], "ifAllFlags": ["package_opened", "mio_reacted_to_package"]}], "setFlag": "mio_reacted_observe", "next": "ch01_070_reconstruction"}, {"id": "ch01_070b_dont_look", "type": "vn", "bg": "linear-gradient(180deg,#060610,#080818)", "beats": [{"text": "手を下ろした。", "speaker": null, "sprites": []}, {"text": "「見ないの？」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「ミオが不安そうだから」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "ミオは少しだけ息を吐いた。", "speaker": null, "sprites": []}, {"text": "「うん」\n「今のは、たぶん正しい」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "しばらく沈黙が続いた後、ミオが自分から口を開いた。\n「昔ね、ここで誰かを待ってた気がする」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「誰を？」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「思い出そうとすると、何かがこぼれる気がして」\nミオは右端の跡を見た。\n「でも、まだ待ってる感じはするの」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「…そっか。」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": [], "ifAllFlags": ["package_opened", "mio_reacted_to_package"]}], "setFlag": "mio_reacted_avoid", "next": "ch01_070_reconstruction"}, {"id": "ch01_070c_listen", "type": "vn", "bg": "linear-gradient(180deg,#060610,#080818)", "beats": [{"text": "「ミオ、ここ覚えてる？」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「覚えてる、って言うと」\nミオが笑った。\n怖い時の笑い方。\n「何かが、こぼれる気がして」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「無理しなくていい」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「……椅子があった気がする。\nここに座って、誰かと話してた気がする」\nミオは右端の跡を見た。\n「でも、それが誰だったか」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「名前、ちゃんと聞こえてた。」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": [], "ifAllFlags": ["package_opened", "mio_reacted_to_package"]}], "setFlag": "mio_reacted_ask", "next": "ch01_070_reconstruction"}, {"id": "ch01_070d_wait", "type": "vn", "bg": "linear-gradient(180deg,#060610,#080818)", "beats": [{"text": "トウは何も言わなかった。\nミオの横に座って、同じ方向を見た。", "speaker": null, "sprites": []}, {"text": "しばらく沈黙が続いた。", "speaker": null, "sprites": []}, {"text": "「昔ね」\nミオが静かに言った。", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「ここに、椅子が五つあった気がするの。\nでも、それを言うと」\nミオは右端の跡を見た。", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「私の中から、何かが抜ける」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「急がなくていい」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「うん」\nミオは少しだけ安心したように笑った。\n今度は、本物の笑顔だった。", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「待っててくれたんだ。」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": [], "ifAllFlags": ["package_opened", "mio_reacted_to_package"]}], "setFlag": "mio_reacted_wait", "next": "ch01_070_reconstruction"}, {"id": "ch01_070_reconstruction", "type": "memory", "prompt": "断片を選んで再構成する", "options": [{"text": "17:17の空白メッセージ", "next": null}, {"text": "地面に残った五つ目の跡", "next": "ch01_080_truth"}, {"text": "写真に残る五つ目の影", "next": "ch01_080_truth"}, {"text": "ミオだけが「空いている」と言う", "next": "ch01_080_truth"}]}, {"id": "ch01_080_truth", "type": "vn", "bg": "linear-gradient(180deg,#08080f,#0a0818)", "beats": [{"text": "断片がつながる。", "speaker": null, "sprites": []}, {"text": "「椅子が消えたんじゃない」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「椅子に結びついていた関係が、白く抜けてる」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「……消えるのは、物じゃないんだ」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「ミオがそこに座ったこと。誰かと話したこと。\nその椅子に意味があったこと——それが、消えてる」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「……じゃあ、私が寂しいのは\nそこに何かがあったからなんだね」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "（書き換えるのではなく——受け止め直すことが、できるだろうか。）", "speaker": null, "sprites": []}, {"text": "スマホが再び震えた。", "speaker": null, "sprites": []}], "next": "ch01_anlog_flood"}, {"id": "legacy_ch01_090_phone", "type": "phone", "messages": [{"from": "ミオ", "text": "今日はありがとう。", "delay": 700}, {"from": "ミオ", "text": "またね。", "delay": 1400}, {"unknown": true, "from_parts": [{"t": "ミ"}, {"b": "　　"}], "text_parts": [{"t": "ねえ、わたしの"}, {"b": "　　　"}, {"t": "こと、"}, {"b": "　　　　　"}, {"t": "ないでね。"}], "delay": 2200}]}, {"id": "ch01_099_continued", "type": "continued"}, {"id": "ch02_001_morning_log", "type": "vn", "bg": "linear-gradient(180deg,#10121c,#181a2a)", "beats": [{"text": "翌朝。\nスマホに昨日の生活ログが届いていた。", "speaker": null, "sprites": []}, {"text": "昨日 16:20　広場\n同行者: ＿＿\n会話ログ: 一部同期失敗\n感情タグ: 未分類", "speaker": null, "sprites": []}, {"text": "（また、ミオの部分だけ空白になっている。\nもう驚かなくなってきた自分が、少し怖い。）", "speaker": null, "sprites": []}, {"text": "「ミオは、いた」\n「僕は覚えてる」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "スマホの公式通知欄に、記憶局からのアラートが届いていた。\n\n【記憶局 定期通知】\n観測エラー多発地区：白峰市東部\n原因：アンログ混入の可能性\n推奨：対象記録の再同期", "speaker": null, "sprites": []}, {"text": "（アンログ——整理されなかった感情や関係の残響が、\n記録システムに混ざり込む現象のことらしい。\n記憶局は「危険な未整理データ」と呼んでいる。）", "speaker": null, "sprites": []}]}, {"id": "ch02_002_mio_talk", "type": "vn", "bg": "linear-gradient(180deg,#e8eede,#cdd8c0)", "beats": [{"text": "広場の端でミオを見つけた。\n今日もいつもの場所にいた。", "speaker": null, "sprites": []}, {"text": "「昨日の記録、ミオに関係するところだけ消えてるんだ」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「また同期異常かな。大丈夫だよ、たぶん」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「そのたぶんが信用できない」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「トウは心配しすぎ」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「ミオが心配させるんだろ」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "ミオは笑った。\nいつものように、怖くなさそうに。", "speaker": null, "sprites": []}]}, {"id": "ch02_003_city_blank", "type": "vn", "bg": "linear-gradient(180deg,#141620,#0c0e18)", "beats": [{"text": "街を歩いていると、おかしなことに気づいた。", "speaker": null, "sprites": []}, {"text": "スマホの地図に、店名が入っていない場所がある。\n看板の写真を撮ると、文字の部分だけ白く抜ける。\n昨日すれ違った人の名前タグが、生活ログから消えている。", "speaker": null, "sprites": []}, {"text": "スマホが振動した。記憶局の自動警告。\n\n「この地区のアンログ濃度が通常の3倍を超えています。\n長時間滞在は推奨しません。」\n\nアンログの濃い場所は、記録から漏れた感情が溜まりやすい。\nそういう場所ではミオへの影響が強くなるらしかった。", "speaker": null, "sprites": []}, {"text": "どれも、ミオが触れた場所だった。\nミオが悪いわけじゃない。\nただ、ミオがいた場所の記録だけが、なかったことになっていく。", "speaker": null, "sprites": []}, {"text": "「……これって、ずっとこうだったの？」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「最近は、少し早くなった気がする」\nミオは空を見ながら、静かに笑った。", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "街の奥に、時計塔の尖塔が見えた。\nミオがその方向を見た。\n一瞬だけ——笑顔が消えた。", "speaker": null, "sprites": []}, {"text": "「ミオ？」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「なんでもない」\nミオはすぐに笑顔を戻した。\nでも、目線だけはまだ時計塔の方を向いていた。", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}]}, {"id": "ch02_004_rina_meet", "type": "vn", "bg": "linear-gradient(180deg,#2a2c3a,#1e2030)", "beats": [{"text": "「ちょっといい？」\n路地の出口で、女の子が立っていた。\nスマホをこちらに向けながら、メモを取っている。", "speaker": null, "sprites": []}, {"text": "「わたし、リナ。\n白峰の記録異常を三か月追ってる」", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "「今日だけで十一か所。\n全部、同じ方向に動いてる」\n画面を差し出してきた。今いる路地が、白く抜けていた。", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "「さっきから追いかけてた。\n——この異常、あなたと一緒に動いてる」\nリナはミオを見た。断定じゃなく、確認だった。", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "「責めてるわけじゃない。\nパターンとして、そうなってる」", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "ミオは少し黙ってから頷いた。", "speaker": null, "sprites": []}, {"text": "「……たぶん、そう。\n昔からちょっとこういうことが起きる」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「昔から？」\nリナが眉を上げた。メモの手が止まった。", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "「名前、聞いていい？\n記録に残したい。あなたたち二人とも」", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "「……ミオ」\n「トウ」", "speaker": {"name": "ミオ／トウ", "color": "#8898b8", "role": ""}, "sprites": []}, {"text": "「ミオ、トウ。\n管理局が来る前に動いたほうがいい。\n一緒に来てくれると助かる——あなたたちのことも、もっと調べたい」", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}]}, {"id": "ch02_005_market", "type": "vn", "bg": "linear-gradient(180deg,#181a24,#101218)", "beats": [{"text": "「一緒に来て」\nリナに促されて、三人で路地を歩き始めた。", "speaker": null, "sprites": []}, {"text": "市場の入口で、白い鳥が数羽舞い降りた。\nミオの足元に集まってくる。\n「またきた」\nミオが小さく笑った。\n「どこに行っても、来るんだよね」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「記憶局って知ってる？\n正式名称は白峰市記録管理局。\n市民の生活ログを管理してる行政機関」", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "「白く抜けた場所を見つけると、\n『同期異常』として巡回端末を飛ばしてくる。\n異常の発生源だと判定したものは——保護、って名目で連れていく」", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "「連れていく？」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「一度連れていかれた人が\nどうなるかは——記録に残ってない」\nリナは短く言って、前を向いた。", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "「だから避ける。\n今日ミオの異常を検知したなら、もう端末が来てる可能性がある」", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "石畳の市場へ入った。\n野菜籠が並んで、焼きたてのパンの匂いがする。\n木の看板が風に揺れている。\n誰もが普通に暮らしている。", "speaker": null, "sprites": []}, {"text": "そこで、ミオが急に立ち止まった。\n路地の端で、小さな子どもが泣いていた。", "speaker": null, "sprites": []}, {"text": "「逃げてる途中に寄り道って、よくないよね」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「わかってるなら、なんで子どもに近づいてるの」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「泣いてたから」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "ミオが子どもの前にしゃがんだ。\n「大丈夫だよ。一緒にお母さん探そう」\n笑顔だった。\n今にも泣き出しそうな子が、少し安心した顔をした。", "speaker": null, "sprites": []}, {"text": "「それだけ？」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「それだけで十分じゃない？」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "リナが小さく息を吐いた。\n「……調査対象が規格外すぎる」", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "（言い返せなかった。\nだから、放っておけなくなる。）", "speaker": null, "sprites": []}]}, {"id": "ch02_006_detection", "type": "phone", "messages": [{"from": "白峰市記録管理局", "text": [{"t": "同期異常の中心反応を確認。"}, {"b": "対象を保護します。"}, {"t": "市民の安全のため、移動を停止してください。"}], "delay": 1200}, {"from": "——", "text": [{"t": "エリアログ: 一括同期失敗"}], "delay": 800}], "next": "ch02_006b_after_detection"}, {"id": "ch02_006b_after_detection", "type": "vn", "bg": "linear-gradient(180deg,#1a1c28,#0e1020)", "beats": [{"text": "「私、また迷惑かけた？」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「違う」\n「君が悪いんじゃない」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「でも端末が——」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "「ミオが悪いんじゃない」\nもう一度、言った。", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}]}, {"id": "ch02_007_escape", "type": "memory", "bg": "linear-gradient(180deg,#1a1c28,#0e1020)", "prompt": "記憶局の端末が近づいている。どうする？", "choices": [{"label": "路地に隠れる", "next": "ch02_007a_hide"}, {"label": "市場の人混みに紛れる", "next": "ch02_007b_crowd"}]}, {"id": "ch02_007a_hide", "type": "vn", "bg": "linear-gradient(180deg,#0a0c18,#080a14)", "beats": [{"text": "路地の奥、木箱の影に三人で身を潜めた。\n端末の光が目の前を通り過ぎていく。", "speaker": null, "sprites": []}, {"text": "「……行った」", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "ミオが小さく息を吐いた。\n手が少し震えていた。", "speaker": null, "sprites": []}]}, {"id": "ch02_007b_crowd", "type": "vn", "bg": "linear-gradient(180deg,#c8b898,#b0a080)", "beats": [{"text": "市場の人混みに紛れて、何事もない顔で歩いた。\n端末が近くを通り過ぎていく。", "speaker": null, "sprites": []}, {"text": "「……通った」", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "ミオが小さく息を吐いた。\n手が少し震えていた。", "speaker": null, "sprites": []}]}, {"id": "ch02_008_shelter", "type": "vn", "bg": "linear-gradient(180deg,#1e1a2a,#161222)", "beats": [{"text": "記録されない路地の奥。\n古い石造りの軒下で、三人は雨をやり過ごした。", "speaker": null, "sprites": []}, {"text": "スマホが圏外になっていた。\nここは地図にも、生活ログにも存在しない場所らしかった。", "speaker": null, "sprites": []}, {"text": "「ミオ」\n静かに呼んだ。", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "ミオが、少しだけ顔を上げた。\n笑顔じゃなかった。ほんの一瞬だけ。\nでもすぐに笑った。", "speaker": null, "sprites": []}, {"text": "「……うん」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "（その一瞬が、ずっと頭に残った。）", "speaker": null, "sprites": []}]}, {"id": "ch02_009_unlog_trace", "type": "vn", "bg": "linear-gradient(180deg,#1e1a2a,#161222)", "beats": [{"text": "路地の壁に、見慣れない落書きがあった。\n鐘のような形。その下に、「記録を信じるな」という文字。", "speaker": null, "sprites": []}, {"text": "「鐘砕き、か」\nリナが低い声で言った。", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "「知ってるの？」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「アンログの急進派。\n時計塔の鐘と関係があるらしい。それ以上は……記録が封鎖されてる」", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "ミオが時計塔の方角を見た。\n一瞬だけ、笑顔が消えた。", "speaker": null, "sprites": []}]}, {"id": "ch02_010_triangle", "type": "vn", "bg": "linear-gradient(180deg,#0a0c18,#080a14)", "beats": [{"text": "出口を確認しようとした時、\n広場の入口に記憶局の巡回端末が現れた。", "speaker": null, "sprites": []}, {"text": "「囲まれた」\nリナが小声で言った。", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "その時、街頭端末がノイズで乱れた。\n「記録を信じるな」という文字が一瞬映って、消えた。\n記憶局の端末が一斉に再起動を始める。", "speaker": null, "sprites": []}, {"text": "「今だ、逃げろ——」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "でも、ノイズの向こうから人影が現れた。\nフードを深く被った人たち。\nアンログだ。助けに来たんじゃなかった。", "speaker": null, "sprites": []}, {"text": "「やっと見つけた」\n「その子を管理局に渡すな。世界を戻す鍵だ」", "speaker": {"name": "???", "color": "#c87060", "role": ""}, "sprites": []}]}, {"id": "ch02_011_mio_helps", "type": "vn", "bg": "linear-gradient(180deg,#0a0c18,#080a14)", "beats": [{"text": "逃げようとした。\nしかしミオが立ち止まった。", "speaker": null, "sprites": []}, {"text": "路地の端に、小さな子どもがいた。\n混乱の中で転んで、動けなくなっていた。", "speaker": null, "sprites": []}, {"text": "「ミオ、来て——」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "ミオは振り返った。\n笑っていた。\n怖い時の、あの笑顔だった。", "speaker": null, "sprites": []}, {"text": "（あの笑顔を、僕は知っている。\n怖い時ほど、笑う。\n誰かを安心させるために。）", "speaker": null, "sprites": []}, {"text": "「大丈夫。すぐ行く」", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}]}, {"id": "ch02_012_abduction", "type": "vn", "bg": "linear-gradient(180deg,#060810,#040608)", "beats": [{"text": "その隙だった。", "speaker": null, "sprites": []}, {"text": "アンログの人影がミオの腕を掴んだ。", "speaker": null, "sprites": []}, {"text": "「ミオ——！」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "手を伸ばした。\n届かなかった。", "speaker": null, "sprites": []}]}, {"id": "ch02_013_loss", "type": "vn", "bg": "linear-gradient(180deg,#060810,#040608)", "beats": [{"text": "連れていかれながら、ミオはこちらを見た。", "speaker": null, "sprites": []}, {"text": "「大丈夫」\n笑っていた。", "speaker": {"name": "ミオ", "color": "#8090c8", "role": ""}, "sprites": []}, {"text": "怖い時の、あの笑顔で。\n誰かを安心させようとする、あの笑顔で。", "speaker": null, "sprites": []}, {"text": "「大丈夫じゃないだろ」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "届かなかった。", "speaker": null, "sprites": []}, {"text": "スマホが震えた。\n画面を開く。\n\n【昨日の生活ログ】\n同行者: ＿＿\n会話ログ: 同期失敗\n感情タグ: 未分類", "speaker": null, "sprites": []}, {"text": "ミオの名前が——白く抜けていた。\n端末には、今日ミオと歩いた記録が、もうなかった。", "speaker": null, "sprites": [], "se": "whiteout"}, {"text": "「ミオ！」\nトウは叫んだ。\nでも、名前の欄は白いままだった。", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": [], "se": "whiteout"}]}, {"id": "ch02_014_chapter03_hook", "type": "vn", "bg": "linear-gradient(180deg,#10121c,#0c0e18)", "beats": [{"text": "どのくらい時間が経ったか分からない。\nミオが連れて行かれた方角を、ただ見ていた。", "speaker": null, "sprites": []}, {"text": "「……追うよね」\nリナが言った。", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "「追うなら、記録にない道を行くしかない」", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "「——行く」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}]}, {"id": "ch02_099_continued", "type": "continued"}, {"id": "ch03_001_loss_after", "type": "vn", "bg": "linear-gradient(180deg,#060810,#040608)", "beats": [{"text": "【トウ側】", "speaker": null, "sprites": []}, {"text": "ミオが連れ去られた路地で、トウはしばらく動けなかった。", "speaker": null, "sprites": []}, {"text": "「……追う」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "リナが頷いた。\n「ログには残ってない。でも、消えた跡は残ってる」", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "「跡？」", "speaker": {"name": "トウ", "color": "#90a0c8", "role": "（僕）"}, "sprites": []}, {"text": "「紙の地図、手書きのメモ、人の記憶」\n「記録じゃなくても、残るものはある」", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}]}, {"id": "ch03_002_paper_map", "type": "vn", "bg": "linear-gradient(180deg,#1a1c28,#10121c)", "beats": [{"text": "リナが古本屋の軒下で、紙の地図を広げた。\n手書きの文字で、知らない路地名が書かれている。", "speaker": null, "sprites": []}, {"text": "「鐘砕きが活動してる区域はログに出ない。\nでも、紙には残ってる」", "speaker": {"name": "リナ", "color": "#a0c8a0", "role": ""}, "sprites": []}, {"text": "地図の端に、小さな落書き。\n鐘のような形。その横に——「白層」という文字。", "speaker": null, "sprites": []}, {"text": "「ここに行く」\nトウが指さした。", "speaker": {"name": "トウ", "color": "#90a0c8", "role"
