<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>FEED — Teaser</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:'Courier New',monospace;color:#fff}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:32px}
#content{width:100%;max-width:400px}

/* SCAN */
@keyframes scan{0%{top:-5%}100%{top:105%}}
.scanline{position:fixed;left:0;width:100%;height:2px;background:rgba(255,255,255,0.03);animation:scan 5s linear infinite;pointer-events:none;z-index:100}

/* GLITCH */
@keyframes g1{0%,100%{clip-path:inset(0 0 95% 0);transform:translate(-3px)}50%{clip-path:inset(40% 0 50% 0);transform:translate(3px)}}
@keyframes g2{0%,100%{clip-path:inset(90% 0 0 0);transform:translate(3px)}50%{clip-path:inset(50% 0 40% 0);transform:translate(-3px)}}
.gw{position:relative;display:inline-block}
.gw::before,.gw::after{content:attr(data-t);position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.gw::before{color:#0ff;animation:g1 .12s infinite;opacity:.6}
.gw::after{color:#f0a;animation:g2 .12s infinite;opacity:.6}

/* SHARED */
.t1{font-size:clamp(11px,3vw,14px);letter-spacing:.2em;line-height:2;color:#334455}
.t2{font-size:clamp(14px,4vw,20px);letter-spacing:.08em;line-height:1.8}
.t3{font-size:clamp(18px,5vw,28px);font-weight:700;letter-spacing:.06em;line-height:1.5}
.t4{font-size:clamp(40px,12vw,80px);font-weight:900;letter-spacing:.15em}
.line{width:50px;height:1px;background:#1a2a38;margin:16px auto}

/* PILLS */
.pill{display:inline-block;padding:3px 12px;border-radius:99px;font-size:clamp(8px,2vw,10px);letter-spacing:.18em;font-weight:700;margin:5px 3px;border:1px solid currentColor;opacity:.75}

/* CASE GRID */
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:320px;margin:12px auto}
.ccard{padding:9px 11px;border:1px solid #1a2a38;border-radius:6px;font-size:10px;line-height:1.6;color:#3a5060;text-align:left}

/* CHAR ROW */
.crow{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.ci{text-align:center;transition:opacity .6s}
.ci-icon{font-size:32px;margin-bottom:4px}
.ci-name{font-size:8px;letter-spacing:.12em;color:#2a3a48;line-height:1.6}

/* WORLD BAR */
.wbg{height:2px;background:#0a1520;border-radius:99px;width:180px;margin:8px auto}
.wfill{height:100%;border-radius:99px;background:#2ecc71;transition:width .1s,background .5s}

/* CONTROLS */
#skip-btn{position:fixed;bottom:20px;right:20px;font-size:9px;color:#1a2a38;letter-spacing:.15em;cursor:pointer;border:1px solid #1a2a38;padding:5px 12px;border-radius:2px;background:transparent;z-index:200}
#replay-btn{position:fixed;bottom:20px;right:20px;font-size:9px;color:#2a4a60;letter-spacing:.15em;cursor:pointer;border:1px solid #1a3a50;padding:5px 12px;border-radius:2px;background:transparent;z-index:200;display:none}
#play-btn{margin-top:28px;padding:11px 28px;background:transparent;border:1px solid #1a4a60;color:#2a6a80;font-size:10px;letter-spacing:.2em;cursor:pointer;font-family:inherit;border-radius:2px}
</style>
</head>
<body>
<div class="scanline"></div>
<div id="stage"><div id="content"></div></div>
<button id="skip-btn" onclick="skipAll()">SKIP</button>
<button id="replay-btn" onclick="startTeaser()">REPLAY</button>

<script>
var C = document.getElementById('content');
var skipRequested = false;
var currentTimer = null;
var viewTimer = null;

function clear() { C.innerHTML = ''; }

function wait(ms) {
  return new Promise(function(res) {
    currentTimer = setTimeout(res, skipRequested ? 0 : ms);
  });
}

function fadeIn(ms) {
  C.style.transition = 'opacity ' + ms + 'ms';
  C.style.opacity = 1;
  return wait(ms);
}

function fadeOut(ms) {
  C.style.transition = 'opacity ' + ms + 'ms';
  C.style.opacity = 0;
  return wait(ms + 50);
}

function type(el, text, spd) {
  return new Promise(function(res) {
    if (skipRequested) { el.textContent = text; res(); return; }
    var i = 0;
    var t = setInterval(function() {
      el.textContent += text[i++];
      if (i >= text.length) { clearInterval(t); setTimeout(res, 200); }
    }, spd);
  });
}

var viewsVal = 892441;
function startViews(el) {
  stopViews();
  viewTimer = setInterval(function() {
    viewsVal += Math.floor(Math.random()*180+60);
    if (el) el.textContent = '👁 ' + viewsVal.toLocaleString();
  }, 700);
}
function stopViews() { clearInterval(viewTimer); }

function skipAll() {
  skipRequested = true;
  stopViews();
  clearTimeout(currentTimer);
}

async function startTeaser() {
  skipRequested = false;
  document.getElementById('skip-btn').style.display = 'block';
  document.getElementById('replay-btn').style.display = 'none';
  C.style.opacity = 0;

  // ── S0: GC2026 ──────────────────────────────────
  clear();
  C.innerHTML = '<div class="t1" style="color:#0a1520">GC2026</div>';
  await fadeIn(800); await wait(700); await fadeOut(500);

  // ── S1: FEED logo ───────────────────────────────
  clear();
  C.innerHTML = '<div class="t1" style="color:#0a1824;margin-bottom:16px;letter-spacing:.3em">THE PLATFORM</div><div class="gw t4" data-t="FEED" style="color:#0a1e2a">FEED</div>';
  await fadeIn(1000); await wait(1600); await fadeOut(600);

  // ── S2: Opening ─────────────────────────────────
  clear();
  C.innerHTML = '<div class="t1" style="margin-bottom:16px">毎日</div><div class="t3" style="color:#4a6a7a" id="s2t"></div>';
  await fadeIn(600);
  await type(document.getElementById('s2t'), '誰かの人生があなたの画面に届く', 55);
  await wait(1800); await fadeOut(600);

  // ── S3: The job ─────────────────────────────────
  clear();
  C.innerHTML = '<div class="t1" style="margin-bottom:16px;color:#1a3040">あなたの仕事は</div><div class="line"></div><div class="t3" style="color:#4a7a9a;margin:10px 0">残す</div><div class="t3" style="color:#cc4a30;margin:10px 0">消す</div><div class="t3" style="color:#c89a20;margin:10px 0">上申する</div><div class="line"></div><div class="t1" style="margin-top:8px">それだけだ</div>';
  await fadeIn(600); await wait(3000); await fadeOut(600);

  // ── S4: Cases ───────────────────────────────────
  clear();
  var vc = document.createElement('div');
  vc.style.cssText = 'font-size:11px;letter-spacing:.12em;color:#2ecc71;margin-top:14px';
  vc.textContent = '👁 ' + viewsVal.toLocaleString();
  C.innerHTML = '<div class="t1" style="margin-bottom:10px;color:#1a2a38">今日、届いたケース</div><div class="cgrid"><div class="ccard">🐱 天才猫の<br>ピアノ動画</div><div class="ccard">🍜 ラーメン店の<br>相互誹謗中傷</div><div class="ccard">🎹 8歳の少女<br>親権争い</div><div class="ccard">💍 結婚式の動画<br>花嫁からの申請</div></div>';
  C.appendChild(vc);
  await fadeIn(600);
  startViews(vc);
  await wait(3200);
  stopViews();
  await fadeOut(600);

  // ── S5: Factions ────────────────────────────────
  clear();
  C.innerHTML = '<div class="t1" style="margin-bottom:16px">世界には5つの思想がある</div><div><span class="pill" style="color:#00eeff">情報解放主義</span><span class="pill" style="color:#4466ff">情報保護主義</span><span class="pill" style="color:#ffaa00">情報資本主義</span><span class="pill" style="color:#ffcc66">情報記録主義</span><span class="pill" style="color:#aa5555">情報断絶主義</span></div><div class="line" style="margin-top:18px"></div><div class="t2" style="margin-top:12px;color:#5a7a8a">そのどれもが正義を名乗っている</div>';
  await fadeIn(600); await wait(3500); await fadeOut(600);

  // ── S6: Contradiction ───────────────────────────
  clear();
  C.innerHTML = '<div class="t2" style="color:#00eeff;margin-bottom:14px">「情報は自由に流れるべきだ」</div><div class="t2" style="color:#4466ff;margin-bottom:14px">「情報は守られるべきだ」</div><div class="t2" style="color:#ffaa00;margin-bottom:14px">「情報は価値を持つ」</div><div class="line"></div><div class="t1" style="margin-top:14px;line-height:2.4">誰も間違っていない<br>だから<br><span style="color:#ff3344">誰も止められない</span></div>';
  await fadeIn(600); await wait(3800); await fadeOut(600);

  // ── S7: Characters ──────────────────────────────
  clear();
  C.innerHTML = '<div class="t1" style="color:#1a2a38;margin-bottom:6px">あなたの周りにいる人たち</div><div class="line"></div><div class="crow"><div class="ci" id="ci1"><div class="ci-icon">👤</div><div class="ci-name" style="color:#4a7a9a">神田ミツル<br><span style="color:#1a2a30">課長</span></div></div><div class="ci" id="ci2"><div class="ci-icon">📊</div><div class="ci-name" style="color:#4a8a7a">七森ユキ<br><span style="color:#1a2a30">解析部</span></div></div><div class="ci" id="ci3"><div class="ci-icon">🔐</div><div class="ci-name" style="color:#4a9a6a">UNKNOWN<br><span style="color:#1a2a30">enc://ch-7</span></div></div><div class="ci" id="ci4"><div class="ci-icon">💍</div><div class="ci-name" style="color:#8a9aaa">白銀ハナ<br><span style="color:#1a2a30">ユーザー</span></div></div><div class="ci" id="ci5"><div class="ci-icon">🌸</div><div class="ci-name" style="color:#7a6a9a">久世アオイ<br><span style="color:#1a2a30">代表取締役</span></div></div></div><div class="t1" style="color:#112233;margin-top:4px">全員が、正しかった</div>';
  document.querySelectorAll('.ci').forEach(function(el){ el.style.opacity=0; });
  await fadeIn(600);
  var ids = ['ci1','ci2','ci3','ci4','ci5'];
  for (var i=0; i<ids.length; i++) {
    await wait(350);
    var el = document.getElementById(ids[i]);
    if (el) el.style.opacity = 1;
  }
  await wait(1200); await fadeOut(600);

  // ── S8: World drain ─────────────────────────────
  clear();
  C.innerHTML = '<div class="t1" style="color:#1a2a38;margin-bottom:20px">WORLD STATE</div><div style="display:flex;justify-content:space-between;font-size:9px;color:#1a3040;margin-bottom:5px;max-width:180px;margin-left:auto;margin-right:auto"><span id="wpct">82%</span></div><div class="wbg"><div class="wfill" id="wfill" style="width:82%"></div></div><div class="t1" style="margin-top:20px;line-height:2.4">あなたが判断するたびに世界は変わる<br><br><span style="color:#ff3344">でも——誰も教えてくれない</span><br><span style="color:#1a2a38">何が変わったか</span></div>';
  await fadeIn(800);
  await wait(600);
  var w = 82;
  var wfill = document.getElementById('wfill');
  var wpct = document.getElementById('wpct');
  await new Promise(function(res) {
    var dt = setInterval(function() {
      w -= 2;
      if (wfill) { wfill.style.width = w+'%'; wfill.style.background = w>50?'#2ecc71':w>25?'#f0a030':'#e74c3c'; }
      if (wpct) wpct.textContent = w+'%';
      if (w <= 12 || skipRequested) { clearInterval(dt); res(); }
    }, skipRequested ? 0 : 100);
  });
  await wait(800); await fadeOut(600);

  // ── S9: Mysteries ───────────────────────────────
  clear();
  C.innerHTML = '<div class="t1" style="color:#1a3040;margin-bottom:18px">解かれていない謎</div><div style="text-align:left;display:inline-block"><div class="t1" style="margin-bottom:10px;color:#2a3a48">— 2847 とは何か</div><div class="t1" style="margin-bottom:10px;color:#2a3a48">— ファイル#PRE-0001の設計者</div><div class="t1" style="margin-bottom:10px;color:#2a3a48">— ARCHITECTのタイムライン矛盾</div><div class="t1" style="margin-bottom:10px;color:#2a3a48">— アオイは人間か</div><div class="t1" style="color:#1a2a30">— そして、7つ目のエンディング</div></div>';
  await fadeIn(600); await wait(3500); await fadeOut(600);

  // ── S10: Core twist ─────────────────────────────
  clear();
  C.innerHTML = '<div class="t1" style="margin-bottom:20px;color:#2a4050" id="s10a"></div><div class="t3" style="color:#4a6a7a;line-height:1.7" id="s10b"></div>';
  await fadeIn(600);
  await type(document.getElementById('s10a'), 'そしてゲームが終わった後に気づく', 45);
  await wait(400);
  await type(document.getElementById('s10b'), 'このシステムを\n最初に作ったのは\n誰だったのか', 55);
  await wait(2000); await fadeOut(700);

  // ── S11: Twist hint ─────────────────────────────
  clear();
  C.innerHTML = '<div class="t2" style="color:#334455;line-height:2.2;margin-bottom:24px">悪人はいない<br>でも世界は壊れていく<br><br><span style="color:#4a6070">あなたは毎日、その歯車を回していた</span></div><div class="t2" style="color:#cc3344" id="s11t"></div>';
  await fadeIn(700);
  await wait(1400);
  await type(document.getElementById('s11t'), 'そしてその歯車を\n最初に設計したのは——', 60);
  await wait(1200); await fadeOut(600);

  // ── S12: 2847 ───────────────────────────────────
  clear();
  C.innerHTML = '<div class="gw t4" data-t="2847" style="color:#0a1e2a;letter-spacing:.2em">2847</div><div class="t1" style="margin-top:16px;color:#0a1520">PROJECT_INITIALIZED</div>';
  await fadeIn(300); await wait(1600); await fadeOut(500);

  // ── S13: Logo ───────────────────────────────────
  clear();
  C.innerHTML = '<div class="t1" style="color:#0a1824;margin-bottom:20px;letter-spacing:.3em">THE PLATFORM PRESENTS</div><div class="gw t4" data-t="FEED" style="color:#1a3a50;font-size:clamp(56px,15vw,96px);letter-spacing:.2em">FEED</div><div class="line" style="margin-top:22px"></div><div class="t1" style="margin-top:14px;color:#0a1824">あなたの仕事は、世界が見るものを決めることだ。</div><div class="t1" style="margin-top:20px;color:#08141e;font-size:9px">GC2026</div>';
  await fadeIn(1200); await wait(4000); await fadeOut(800);

  // ── S14: CTA ────────────────────────────────────
  clear();
  C.innerHTML = '<div class="t4" style="color:#0d2a3a;margin-bottom:28px;letter-spacing:.3em;font-size:clamp(40px,11vw,64px)">FEED</div><div class="t1" style="color:#1a3040;margin-bottom:28px">あなたの仕事は、世界が見るものを決めることだ。</div><button id="play-btn" onclick="location.href=\'../\'">勤務を開始する →</button>';
  await fadeIn(1000);

  document.getElementById('skip-btn').style.display = 'none';
  document.getElementById('replay-btn').style.display = 'block';
}

window.addEventListener('load', function() { setTimeout(startTeaser, 400); });
</script>
</body>
</html>
