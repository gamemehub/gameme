<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>FEED TEST</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#040810;color:#8aabb0;font-family:'Courier New',monospace;display:flex;align-items:center;justify-content:center;min-height:100vh}
.btn{background:transparent;border:1px solid #1a4a60;color:#2a7a9a;padding:14px 36px;font-size:12px;letter-spacing:.2em;border-radius:3px;cursor:pointer;font-family:inherit;display:block;margin:20px auto}
#log{font-size:10px;color:#4a6a8a;padding:20px;line-height:2;max-width:300px;text-align:center}
</style>
</head>
<body>
<div style="text-align:center">
  <div style="font-size:64px;font-weight:900;letter-spacing:.3em;color:#0d2a3a;margin-bottom:16px">FEED</div>
  <div style="font-size:12px;color:#1a3a50;letter-spacing:.06em;line-height:2;margin-bottom:32px">あなたの仕事は、<br>世界が見るものを決めることだ。</div>
  <button class="btn" onclick="startGame()">勤務を開始する</button>
  <div id="log">ボタンを押してください</div>
</div>

<script>
function startGame() {
  document.getElementById('log').textContent = '✓ ボタンが動作しています。本番版をロード中...';
  document.getElementById('log').style.color = '#2ecc71';
  setTimeout(function() {
    window.location.href = './full/';
  }, 800);
}

window.onerror = function(msg, src, line) {
  document.getElementById('log').textContent = 'JSエラー: ' + msg + ' (line ' + line + ')';
  document.getElementById('log').style.color = '#e74c3c';
};
</script>
</body>
</html>
