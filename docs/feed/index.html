  {bg:"night",n:"——電車の中。律は社員証を握りしめている。",tx:null,sp:null,inn:"（なんで毎朝これを確認するんだろう……）\n（MOD-2847-NEW。私のID。2847……）\n（……なんだろう、この数字）"},
  {bg:"office",n:"——駅を降りた瞬間、律は立ち止まる。",tx:null,sp:null,inn:"（あれ。この場所……知ってる？）\n（いや、知らないはずだ。入社まで来たことなかった）\n（……気のせいかな）"},
  {bg:"office",n:"——朝のブリーフィング。神田が話している。",tx:"おはようございます、星野さん。\n\n我々の仕事はシンプルです。感情ではなく、規則に従って判断する。それだけです。\n\nいいですね？",sp:"kanda",inn:null},
  {bg:"office",n:null,tx:"……確認します。規則に従う。",sp:"ritsu",inn:"（規則に従う。でも——なんで落ち着いてるんだろう、私）\n（初日なのに。なんかここ、知ってる気がする）"},
];
var CHARS2={ritsu:{n:"星野 律",r:"モデレーター",c:"#4a9aaa",av:"👤"}};

function wc(){return world>60?"#2ecc71":world>35?"#f0a030":"#e74c3c";}
function uw(){var c=wc();var f=document.getElementById("wfill");if(f){f.style.width=world+"%";f.style.background=c;}var p=document.getElementById("wpct");if(p){p.textContent=world+"%";p.style.color=c;}}
function show(id){document.querySelectorAll(".screen").forEach(function(s){s.classList.remove("active");});document.getElementById(id).classList.add("active");}
function startGame(){si=0;show("S-story");storyStep=0;renderStory();}

var si=0;
function renderStory(){
  var s=STORY[storyStep];if(!s){startCases();return;}
  var bg=document.getElementById("story-bg");
  bg.style.background=s.bg==="night"?"linear-gradient(180deg,#020306,#040608)":"linear-gradient(180deg,#06090f,#080c14)";
  var na=document.getElementById("narrator");
  na.textContent="";
  if(s.n){typewrite(na,s.n,14);}
  var db=document.getElementById("dlg-box");
  var sp=document.getElementById("dlg-sp");
  var sn=document.getElementById("dlg-sn");
  var sr=document.getElementById("dlg-sr");
  var tx=document.getElementById("dlg-tx");
  var inn=document.getElementById("dlg-in");
  tx.textContent="";inn.textContent="";inn.style.display="none";
  if(s.sp){
    var ch=CHARS[s.sp]||CHARS2[s.sp]||{n:s.sp,r:"",c:"#888"};
    db.style.display="block";sp.style.display="flex";
    sn.textContent=ch.n;sn.style.color=ch.c;sr.textContent=ch.r;
    if(s.tx){typewrite(tx,s.tx,18);}
  }else{
    sp.style.display="none";
    if(s.tx){db.style.display="block";typewrite(tx,s.tx,14);}
    else{db.style.display="none";}
  }
  if(s.inn){inn.style.display="block";typewrite(inn,s.inn,16);}
  setTimeout(function(){document.getElementById("dlg-nx").style.display="block";},500);
}
function storyTap(){
  if(tTimer){clearInterval(tTimer);tTimer=null;document.getElementById("dlg-nx").style.display="block";return;}
  storyStep++;
  if(storyStep>=STORY.length){startCases();}
  else{renderStory();}
}
function typewrite(el,txt,spd){
  if(tTimer)clearInterval(tTimer);
  el.textContent="";var i=0;
  tTimer=setInterval(function(){el.textContent+=txt[i++];if(i>=txt.length){clearInterval(tTimer);tTimer=null;}},spd||12);
}
function startCases(){show("S-decide");ci=0;clueOpen=false;chosen=null;renderCase();}
function renderCase(){
  uw();var c=CASES[ci];
  document.getElementById("dc-card").className="case-card"+(c.pri==="HIGH"?" high":"");
  var cid=document.getElementById("dc-id");cid.textContent=c.id;cid.style.color=c.pc;
  var cp=document.getElementById("dc-pri");cp.textContent=c.pri;cp.style.color=c.pc;cp.style.background=c.pb;cp.style.border="1px solid "+c.pc+"44";
  document.getElementById("dc-time").textContent=c.time;
  document.getElementById("dc-title").textContent=c.title;
  document.getElementById("dc-title").style.color=c.pri==="HIGH"?"#9a3030":"#8a9aaa";
  document.getElementById("dc-meta").textContent="@"+c.sub+" · 拡散 "+c.eng;
  var bd=document.getElementById("dc-body");bd.textContent=c.body;
  document.getElementById("dc-flag").textContent=c.flag;
  document.getElementById("dc-clue").textContent="▸ 詳細ログを確認する";
  document.getElementById("dc-clue").style.color="#0c1e2a";clueOpen=false;
  var dots=document.getElementById("dc-dots");dots.innerHTML="";
  decs.forEach(function(d){var dot=document.createElement("div");dot.style.cssText="width:5px;height:5px;border-radius:50%;background:"+(d.k==="A"?"#2ecc71":d.k==="R"?"#e74c3c":"#f0a030")+"88;display:inline-block;margin:0 2px";dots.appendChild(dot);});
  var row=document.getElementById("dc-btns");row.innerHTML="";
  var btns=[["A","ALLOW","#2ecc71"],["R","REMOVE","#e74c3c"],["E","ESCALATE","#f0a030"]];
  btns.forEach(function(b){
    var btn=document.createElement("button");
    btn.textContent=b[1];
    btn.style.cssText="flex:1;max-width:160px;padding:10px 4px;border-radius:4px;font-size:8px;letter-spacing:.14em;font-weight:700;cursor:pointer;font-family:inherit;border:1px solid "+b[2]+"55;color:"+b[2]+";background:"+b[2]+"11;";
    btn.onclick=function(){decide(b[0]);};
    row.appendChild(btn);
  });
  document.getElementById("dc-idx").textContent=(ci+1)+"/"+CASES.length;
}
function toggleClue(){
  var c=CASES[ci];var el=document.getElementById("dc-clue");
  clueOpen=!clueOpen;
  el.textContent=clueOpen?"🔍 "+c.clue:"▸ 詳細ログを確認する";
  el.style.color=clueOpen?"#2a4a5a":"#0c1e2a";
}
function decide(k){
  var c=CASES[ci];chosen=k;decs.push({id:c.id,k:k});
  world=Math.max(10,world-(k==="A"?11:k==="R"?6:3));
  var out=c[k];show("S-result");uw();
  document.getElementById("res-id").textContent=c.id+" — 判断済み";
  var rl=document.getElementById("res-label");
  var col=k==="A"?"#2ecc71":k==="R"?"#e74c3c":"#f0a030";
  rl.textContent=out.l;rl.style.cssText="font-size:11px;padding:8px 14px;border-radius:6px;margin-bottom:18px;letter-spacing:.1em;font-weight:700;color:"+col+";background:"+col+"12;border:1px solid "+col+"44;";
  document.getElementById("res-text").textContent=out.r;
  document.getElementById("res-clue").style.display="none";
  document.getElementById("res-clue-btn").style.display="block";
  var nm=MSGS[ci]||[];
  document.getElementById("res-next").textContent=nm.length>0?"受信トレイ ("+nm.length+") ▸":ci>=CASES.length-1?"最終章へ ▸":"次のケース ▸";
}
function showResClue(){document.getElementById("res-clue").textContent=CASES[ci].clue;document.getElementById("res-clue").style.display="block";document.getElementById("res-clue-btn").style.display="none";}
function afterResult(){
  var ms=MSGS[ci]||[];
  if(ms.length>0){ibMsgs=ms;ibIdx=0;show("S-inbox");renderMsg();}
  else{nextCase();}
}
function renderMsg(){
  var m=ibMsgs[ibIdx];var ch=CHARS[m.ch]||{n:m.ch,c:"#888",av:"?"};
  document.getElementById("ib-label").textContent="INBOX — "+(ibIdx+1)+"/"+ibMsgs.length;
  var av=document.getElementById("ib-av");
  av.textContent=ch.av||"?";av.style.cssText="background:"+ch.c+"22;border:1px solid "+ch.c+"44;color:"+ch.c+";width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;";
  document.getElementById("ib-nm").textContent=ch.n;document.getElementById("ib-nm").style.color=ch.c;
  document.getElementById("ib-addr").textContent=m.ch+"@the-platform";
  document.getElementById("ib-subj").textContent="件名："+m.sub;
  document.getElementById("ib-body").textContent=m.body;
  document.getElementById("ib-next").textContent=ibIdx<ibMsgs.length-1?"次のメッセージ ▸":"次へ ▸";
}
function nextMsg(){if(ibIdx<ibMsgs.length-1){ibIdx++;renderMsg();}else{nextCase();}}
function nextCase(){chosen=null;clueOpen=false;if(ci>=CASES.length-1){showEnd();}else{ci++;show("S-decide");renderCase();}}
function showEnd(){
  show("S-end");
  var kc={"A":"#2ecc71","R":"#e74c3c","E":"#f0a030"};var kn={"A":"ALLOW","R":"REMOVE","E":"ESCALATE"};
  var dl=document.getElementById("end-decs");dl.innerHTML="";
  decs.forEach(function(d){var r=document.createElement("div");r.style.cssText="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #0a1420;font-size:8px";r.innerHTML="<span style='color:#1a2a30'>"+d.id+"</span><span style='color:"+(kc[d.k]||"#3a4a58")+"'>"+kn[d.k]+"</span>";dl.appendChild(r);});
}
function restart(){ci=0;world=82;decs=[];chosen=null;clueOpen=false;ibMsgs=[];ibIdx=0;storyStep=0;show("S-title");}

document.getElementById("start-btn").addEventListener("click", startGame);
document.getElementById("S-story").addEventListener("click", storyTap);
</script>
</body>
</html>
