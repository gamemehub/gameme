<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>FEED</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Courier New',monospace;background:#040810;color:#8aabb0}
button{cursor:pointer;font-family:inherit}
.screen{position:fixed;inset:0;display:none;flex-direction:column}
.screen.active{display:flex}
@keyframes g1{0%,100%{clip-path:inset(0 0 96% 0);transform:translate(-2px)}50%{clip-path:inset(40% 0 50% 0);transform:translate(2px)}}
@keyframes g2{0%,100%{clip-path:inset(92% 0 0 0);transform:translate(2px)}50%{clip-path:inset(50% 0 40% 0);transform:translate(-2px)}}
.gw{position:relative;display:inline-block}
.gw::before,.gw::after{content:attr(data-t);position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.gw::before{color:#0ff;animation:g1 .15s infinite;opacity:.5}
.gw::after{color:#f0a;animation:g2 .15s infinite;opacity:.5}
.topbar{background:#04080e;border-bottom:1px solid #0c1824;padding:7px 14px;display:flex;align-items:center;gap:8px;flex-shrink:0}
.tb-logo{font-size:11px;font-weight:900;letter-spacing:.35em;color:#0d2a3a}
.wbg{flex:1;height:2px;background:#0a1420;border-radius:99px;margin:0 5px}
.wfill-el{height:100%;border-radius:99px;transition:width 1.2s,background 1.2s}
.sm-btn{background:transparent;border:1px solid #1a3040;color:#3a5060;padding:8px 20px;font-size:8px;letter-spacing:.15em;border-radius:2px}
.mode-tag{font-size:8px;color:#1a3040;letter-spacing:.1em}
/* STORY */
.story-bg{position:absolute;inset:0}
.story-content{position:relative;z-index:2;display:flex;flex-direction:column;height:100%}
.nar-bar{flex:1;padding:20px 18px;font-size:12px;color:#5a7080;line-height:2;overflow-y:auto;white-space:pre-wrap}
.dlg-wrap{background:rgba(4,8,16,0.96);border-top:1px solid #0d1e2e;flex-shrink:0}
/* MEETING */
.meet-char{border-bottom:1px solid #0c1824;padding:14px;text-align:center}
.meet-dlg{flex:1;padding:16px;font-size:12px;color:#6a8a9a;line-height:2;white-space:pre-wrap;overflow-y:auto}
.choice-btn{display:block;width:100%;padding:11px 14px;background:#06090f;border:1px solid #0d1e2e;border-radius:4px;font-size:11px;color:#3a5060;text-align:left;cursor:pointer;line-height:1.6;margin-bottom:8px}
/* INVEST */
.inv-item{display:flex;align-items:center;gap:12px;padding:11px 14px;background:#06090f;border:1px solid #0d1e2e;border-radius:4px;cursor:pointer;margin-bottom:8px}
.inv-item.done{opacity:.5;pointer-events:none;border-color:#0a1820}
.inv-label{font-size:11px;color:#3a5060;flex:1}
.inv-label.done{color:#1a3a50}
.clue-ov{position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:200;align-items:center;justify-content:center;padding:24px}
.clue-card{background:#06090f;border:1px solid #1a4a60;border-radius:6px;padding:20px;max-width:340px;width:100%}
/* CASE */
.case-scroll{flex:1;overflow-y:auto;padding-bottom:110px}
.case-card{margin:12px;border-radius:6px;overflow:hidden;background:#06090f;border:1px solid #0c1824}
.case-card.high{border-color:#2a0a08}
.btn-bar{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(transparent,#040810 30%);padding:16px 12px 12px}
.judge-btn{flex:1;max-width:160px;padding:10px 4px;border-radius:4px;font-size:8px;letter-spacing:.14em;font-weight:700;cursor:pointer;border:1px solid}
/* INTERCEPT */
.ic-chat{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.bubble{max-width:80%;padding:10px 13px;border-radius:4px;font-size:11px;line-height:1.8}
.bubble.R{align-self:flex-end;background:#0a1420;border:1px solid #0d2030;color:#4a6a80}
.bubble.L{align-self:flex-start;background:#06090f;border:1px solid #0c1824;color:#4a6070}
.b-who{font-size:8px;font-weight:700;margin-bottom:3px}
.b-time{font-size:7px;color:#1a2a38;margin-top:3px}
/* CRISIS */
.cr-cards{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:8px}
.cr-card{padding:10px 12px;background:#06090f;border:1px solid #0c1824;border-radius:4px;cursor:pointer;display:flex;align-items:center;gap:10px}
.cr-card.done{opacity:.4;pointer-events:none}
.cr-ov{position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:100;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.cr-jbtns{display:flex;gap:8px;width:100%;max-width:360px;margin-top:20px}
.cr-jbtn{flex:1;padding:12px 4px;border-radius:4px;font-size:9px;letter-spacing:.12em;font-weight:700;cursor:pointer;border:1px solid}
/* DEDUCE */
.dd-card{padding:12px 14px;background:#06090f;border:1px solid #0d1e2e;border-radius:4px;cursor:pointer;margin-bottom:8px;position:relative}
.dd-card.sel{border-color:#2a6a8a;background:#04101a}
.dd-card.conn{opacity:.6;pointer-events:none;border-color:#1a4a30}
.dd-foot{padding:12px;border-top:1px solid #0c1824;display:flex;gap:8px}
.dd-btn{flex:1;padding:10px;border-radius:3px;font-size:9px;letter-spacing:.15em;cursor:pointer}
</style>
</head>
<body>

<!-- TITLE -->
<div class="screen active" id="S-title" style="background:linear-gradient(180deg,#020408,#040810);align-items:center;justify-content:center;padding:32px">
  <div style="text-align:center">
    <div style="font-size:9px;color:#0d2030;letter-spacing:.3em;margin-bottom:12px">THE PLATFORM</div>
    <div class="gw" data-t="FEED" style="font-size:80px;font-weight:900;letter-spacing:.2em;color:#0d2a3a;display:block;margin-bottom:14px">FEED</div>
    <div style="font-size:13px;color:#1a3a50;line-height:2;margin-bottom:40px">あなたの仕事は、<br>世界が見るものを決めることだ。</div>
    <button id="start-btn" style="background:transparent;border:1px solid #1a4a60;color:#2a7a9a;padding:14px 36px;font-size:12px;letter-spacing:.2em;border-radius:3px;width:100%;max-width:260px">勤務を開始する</button>
  </div>
  <div style="position:absolute;bottom:18px;font-size:8px;color:#0a1820;letter-spacing:.15em">GC2026 — FEED Ch.1-2</div>
</div>

<!-- STORY -->
<div class="screen" id="S-story" style="cursor:pointer">
  <div id="story-bg" class="story-bg" style="background:#040810"></div>
  <div class="story-content">
    <div class="nar-bar" id="nar"></div>
    <div class="dlg-wrap" id="dlg-box" style="display:none">
      <div id="dlg-sp" style="display:none;align-items:center;gap:10px;padding:9px 16px 5px;border-bottom:1px solid #080e18">
        <span id="dlg-sn" style="font-size:11px;font-weight:700"></span>
        <span id="dlg-sr" style="font-size:8px;color:#1a2a38;margin-left:auto"></span>
      </div>
      <div id="dlg-tx" style="padding:10px 16px 6px;font-size:12px;color:#8aabb0;line-height:2;min-height:64px;white-space:pre-wrap"></div>
      <div id="dlg-in" style="padding:6px 16px 8px;font-size:10px;color:#4a6a8a;line-height:1.9;font-style:italic;border-left:2px solid #1a3a60;margin:0 16px 8px;background:rgba(10,30,60,0.3);display:none;white-space:pre-wrap"></div>
    </div>
    <div id="dlg-nx" style="text-align:center;padding:10px;font-size:9px;color:#1a4060;letter-spacing:.2em;border-top:1px solid #080e18;display:none">▸ 画面をタップして続ける</div>
  </div>
</div>

<!-- MEETING -->
<div class="screen" id="S-meet" style="background:#040810">
  <div class="topbar"><span class="tb-logo">FEED</span><div class="wbg"><div class="wfill-el" id="wfill" style="width:82%;background:#2ecc71"></div></div><span class="mode-tag">会議</span></div>
  <div class="meet-char">
    <div style="font-size:36px;margin-bottom:6px" id="mt-av"></div>
    <div style="font-size:12px;font-weight:700;margin-bottom:3px" id="mt-nm"></div>
    <div style="font-size:8px;color:#1a2a38" id="mt-rl"></div>
  </div>
  <div class="meet-dlg" id="mt-dlg"></div>
  <div style="padding:12px;border-top:1px solid #0c1824" id="mt-ch"></div>
</div>

<!-- INVESTIGATE -->
<div class="screen" id="S-invest" style="background:#040810">
  <div class="topbar"><span class="tb-logo">FEED</span><div class="wbg"><div class="wfill-el" id="wfill2" style="width:82%;background:#2ecc71"></div></div><span id="wpct2" style="font-size:8px;color:#2ecc71;min-width:28px">82%</span><span class="mode-tag">情報収集</span></div>
  <div style="padding:12px 14px;font-size:10px;color:#2a4050;line-height:1.8;font-style:italic" id="iv-desc"></div>
  <div style="flex:1;overflow-y:auto;padding:0 12px 12px" id="iv-items"></div>
  <div style="text-align:center;padding:8px;font-size:9px;color:#1a3040" id="iv-prog"></div>
</div>
<div class="clue-ov" id="clue-ov" style="display:none">
  <div class="clue-card">
    <div style="font-size:8px;color:#2a6a8a;letter-spacing:.2em;margin-bottom:10px">🔍 手がかり発見</div>
    <div style="font-size:13px;color:#6a9aaa;font-weight:700;margin-bottom:10px;line-height:1.5" id="cv-title"></div>
    <div style="font-size:11px;color:#4a6070;line-height:1.9" id="cv-body"></div>
    <button class="sm-btn" style="margin-top:16px;width:100%" onclick="closeClue()">確認した</button>
  </div>
</div>

<!-- DECIDE -->
<div class="screen" id="S-decide" style="background:#040810">
  <div class="topbar">
    <span class="tb-logo">FEED</span>
    <div style="flex:1;display:flex;align-items:center;gap:5px">
      <span style="font-size:8px;color:#1a2a38">WORLD</span>
      <div class="wbg"><div class="wfill-el" id="wfill" style="width:82%;background:#2ecc71"></div></div>
      <span id="wpct" style="font-size:8px;color:#2ecc71;min-width:28px">82%</span>
    </div>
    <span id="dc-idx" style="font-size:8px;color:#1a2a38"></span>
  </div>
  <div class="case-scroll">
    <div class="case-card" id="dc-card">
      <div style="padding:8px 12px;border-bottom:1px solid #0c1824;background:#070b11;display:flex;align-items:center;gap:7px;flex-wrap:wrap">
        <span style="font-size:8px;letter-spacing:.08em" id="dc-id"></span>
        <span style="font-size:7px;padding:2px 7px;border-radius:99px;font-weight:700;letter-spacing:.1em" id="dc-pri"></span>
        <span style="margin-left:auto;font-size:8px;color:#0a1420" id="dc-time"></span>
      </div>
      <div style="font-size:13px;font-weight:700;padding:10px 12px 5px;line-height:1.5" id="dc-title"></div>
      <div style="padding:0 12px 9px;font-size:8px;color:#1a2a38" id="dc-meta"></div>
      <div style="height:1px;background:#0a1420;margin:0 12px 11px"></div>
      <div style="margin:0 12px 11px;padding:11px;background:#040810;border:1px solid #0a1420;border-radius:2px;font-size:11px;line-height:1.95;color:#4a5a6a;white-space:pre-wrap" id="dc-body"></div>
      <div style="margin:0 12px 11px;padding:11px;background:#050500;border:1px solid #1a1600;border-radius:2px;font-size:10px;color:#5a5020;line-height:1.8;white-space:pre-wrap" id="dc-flag"></div>
      <div style="margin:0 12px 12px;padding:7px 11px;background:#04080c;border:1px solid #0a1e30;border-radius:2px;font-size:8px;color:#0c1e2a;text-align:center;cursor:pointer" id="dc-clue" onclick="toggleClue()">▸ 詳細ログを確認する</div>
    </div>
    <div id="dc-dots" style="display:flex;justify-content:center;padding:4px 14px 6px"></div>
  </div>
  <div class="btn-bar"><div style="display:flex;gap:6px;justify-content:center" id="dc-btns"></div></div>
</div>

<!-- RESULT -->
<div class="screen" id="S-result" style="background:#040810;align-items:center;justify-content:center;padding:18px">
  <div style="max-width:440px;width:100%">
    <div style="font-size:8px;color:#1a3a50;letter-spacing:.15em;margin-bottom:10px" id="rs-id"></div>
    <div id="rs-label"></div>
    <div style="font-size:12px;line-height:2.2;padding:16px;background:#06090f;border:1px solid #0c1824;border-radius:6px;margin-bottom:18px;white-space:pre-wrap;color:#4a5a6a" id="rs-text"></div>
    <div style="font-size:9px;color:#1a3040;text-align:center;margin-bottom:14px;font-style:italic;line-height:1.8;display:none" id="rs-clue"></div>
    <div style="display:flex;gap:10px;justify-content:center">
      <button id="rs-clue-btn" onclick="showResClue()" class="sm-btn">詳細ログ</button>
      <button id="rs-next" onclick="afterResult()" class="sm-btn">次へ ▸</button>
    </div>
  </div>
</div>

<!-- INBOX -->
<div class="screen" id="S-inbox" style="background:#040810;padding:16px;align-items:center;overflow-y:auto">
  <div style="max-width:440px;width:100%;padding-top:8px">
    <div style="font-size:8px;color:#1a2a38;letter-spacing:.15em;margin-bottom:14px" id="ib-label"></div>
    <div style="background:#06090f;border-radius:6px;overflow:hidden;margin-bottom:16px">
      <div style="padding:12px 14px;background:#080c12">
        <div style="display:flex;align-items:center;gap:9px;margin-bottom:8px">
          <div id="ib-av"></div>
          <div><div id="ib-nm" style="font-size:11px;font-weight:700"></div><div id="ib-addr" style="font-size:8px;color:#1a2a38"></div></div>
        </div>
        <div id="ib-subj" style="font-size:9px;color:#3a5060"></div>
      </div>
      <div id="ib-body" style="padding:13px;font-size:11px;line-height:2;color:#4a5a6a;white-space:pre-wrap"></div>
    </div>
    <div style="text-align:center"><button id="ib-next" onclick="nextMsg()" class="sm-btn">次へ ▸</button></div>
  </div>
</div>

<!-- INTERCEPT -->
<div class="screen" id="S-intercept" style="background:#040810">
  <div class="topbar"><span class="tb-logo">FEED</span><div class="wbg"><div class="wfill-el" style="width:82%;background:#2ecc71" id="wfill"></div></div><span class="mode-tag" style="color:#cc4a30">傍受</span></div>
  <div style="padding:10px 14px;border-bottom:1px solid #0c1824;background:#04080a">
    <div style="font-size:8px;color:#cc4a30;letter-spacing:.2em;margin-bottom:3px">⚠ INTERCEPTED</div>
    <div style="font-size:9px;color:#2a3a48" id="ic-info"></div>
  </div>
  <div class="ic-chat" id="ic-chat"></div>
  <div style="padding:12px;border-top:1px solid #0c1824;display:flex;justify-content:space-between;align-items:center">
    <div style="font-size:9px;color:#cc4a30" id="ic-cost"></div>
    <button class="sm-btn" id="ic-next" onclick="interceptNext()">次を傍受 ▸</button>
  </div>
</div>

<!-- CRISIS -->
<div class="screen" id="S-crisis" style="background:#040810">
  <div class="topbar"><span class="tb-logo">FEED</span><div class="wbg"><div class="wfill-el" style="width:82%;background:#2ecc71" id="wfill"></div></div><span class="mode-tag" style="color:#cc4a30">危機</span></div>
  <div style="padding:10px 14px;border-bottom:1px solid #2a0808;background:#080408">
    <div style="display:flex;align-items:center;gap:10px">
      <span style="font-size:9px;color:#cc4a30;letter-spacing:.15em">⚠ TIME</span>
      <div style="flex:1;height:4px;background:#1a0808;border-radius:99px"><div id="cr-tf" style="height:100%;border-radius:99px;background:#cc4a30;width:100%;transition:width .1s"></div></div>
      <span id="cr-time" style="font-size:11px;color:#cc4a30;font-weight:700;min-width:28px;font-family:monospace">60</span>
    </div>
    <div style="font-size:9px;color:#2a1818;margin-top:5px" id="cr-info"></div>
  </div>
  <div class="cr-cards" id="cr-cards"></div>
</div>
<div class="cr-ov" id="cr-ov" style="display:none">
  <div style="font-size:13px;color:#8a9aaa;font-weight:700;margin-bottom:16px;text-align:center;line-height:1.5" id="crj-title"></div>
  <div style="font-size:10px;color:#4a5a6a;line-height:1.8;text-align:center;max-width:300px;white-space:pre-wrap" id="crj-body"></div>
  <div class="cr-jbtns">
    <button class="cr-jbtn" style="color:#2ecc71;border-color:#2ecc71;background:rgba(46,204,113,0.1)" onclick="crisisJudge('A')">ALLOW</button>
    <button class="cr-jbtn" style="color:#e74c3c;border-color:#e74c3c;background:rgba(231,76,60,0.1)" onclick="crisisJudge('R')">REMOVE</button>
    <button class="cr-jbtn" style="color:#f0a030;border-color:#f0a030;background:rgba(240,160,48,0.1)" onclick="crisisJudge('E')">ESCALATE</button>
  </div>
</div>

<!-- REPORT -->
<div class="screen" id="S-report" style="background:#040810;overflow-y:auto;padding:16px">
  <div style="max-width:440px;margin:0 auto">
    <div style="font-size:9px;color:#1a3a50;letter-spacing:.2em;margin-bottom:16px">報告書モード</div>
    <div style="padding:13px;background:#06090f;border:1px solid #0c1824;border-radius:4px;margin-bottom:14px">
      <div style="font-size:8px;color:#1a3040;margin-bottom:5px" id="rp-cid"></div>
      <div style="font-size:12px;color:#6a8a9a;font-weight:700" id="rp-ctitle"></div>
      <div id="rp-dec"></div>
    </div>
    <div style="font-size:11px;color:#4a6070;line-height:1.8;margin-bottom:13px">この判断の理由を選んでください</div>
    <div id="rp-choices"></div>
  </div>
</div>

<!-- DEDUCE -->
<div class="screen" id="S-deduce" style="background:#040810">
  <div class="topbar"><span class="tb-logo">FEED</span><div class="wbg"><div class="wfill-el" style="width:82%;background:#2ecc71" id="wfill"></div></div><span class="mode-tag">推理</span></div>
  <div style="padding:14px 16px;border-bottom:1px solid #0c1824">
    <div style="font-size:11px;color:#4a6070;line-height:1.8;margin-bottom:4px" id="dd-prompt"></div>
    <div style="font-size:9px;color:#1a3040" id="dd-hint"></div>
  </div>
  <div style="flex:1;overflow-y:auto;padding:12px" id="dd-clues"></div>
  <div style="padding:14px;background:#04101a;border:1px solid #1a4a60;border-radius:4px;font-size:11px;color:#4a8a9a;line-height:1.8;margin:0 12px 12px;display:none;white-space:pre-wrap" id="dd-res"></div>
  <div class="dd-foot" id="dd-foot">
    <button class="dd-btn" style="background:#04101a;border:1px solid #1a4a60;color:#2a6a8a" onclick="deduceConnect()">接続する</button>
    <button class="dd-btn" style="background:transparent;border:1px solid #0d1e2e;color:#1a3040" onclick="ns()">スキップ</button>
  </div>
</div>

<!-- END -->
<div class="screen" id="S-end" style="background:#040810;padding:24px;align-items:center;justify-content:center;overflow-y:auto">
  <div style="max-width:420px;width:100%">
    <div style="font-size:9px;color:#1a3a50;letter-spacing:.2em;margin-bottom:20px;text-align:center" id="end-title"></div>
    <div id="end-decs" style="margin-bottom:18px"></div>
    <div id="end-msg" style="padding:16px;background:#06090f;border:1px solid #0c1824;border-radius:6px;margin-bottom:18px;font-size:11px;color:#3a5060;line-height:2.2;white-space:pre-wrap"></div>
    <div id="end-myst" style="font-size:9px;color:#0d1e2a;text-align:center;line-height:2.5;border-top:1px solid #0a1420;padding-top:16px"></div>
    <div style="text-align:center;margin-top:18px"><button class="sm-btn" onclick="restart()">最初からプレイ</button></div>
  </div>
</div>

<script>

var si=0, world=82, decs=[], stBeat=0, tTimer=null;
var invItems=[], invFound=0;
var curCase=null, clueOpen=false;
var ibMsgs=[], ibIdx=0;
var meetSc=null;
var icMsgs=[], icIdx=0;
var crCases=[], crTimer=null, crLeft=60, crOpen=-1;
var ddClues=[], ddSel=[], ddConns=[];
var rpCk=null;

function wc(){return world>60?"#2ecc71":world>35?"#f0a030":"#e74c3c";}
function uw(){
  var c=wc();
  ["wfill","wfill2"].forEach(function(id){
    var e=document.getElementById(id);
    if(e){e.style.width=world+"%";e.style.background=c;}
  });
  ["wpct","wpct2"].forEach(function(id){
    var e=document.getElementById(id);
    if(e){e.textContent=world+"%";e.style.color=c;}
  });
}
function show(id){
  document.querySelectorAll(".screen").forEach(function(s){s.classList.remove("active");});
  document.getElementById(id).classList.add("active");
}
function tw(el,txt,spd,cb){
  if(tTimer)clearInterval(tTimer);
  el.textContent="";var i=0;
  tTimer=setInterval(function(){
    el.textContent+=txt[i++];
    if(i>=txt.length){clearInterval(tTimer);tTimer=null;if(cb)cb();}
  },spd||12);
}

function startGame(){si=0;world=82;decs=[];run();}
function restart(){si=0;world=82;decs=[];crTimer&&clearInterval(crTimer);crTimer=null;show("S-title");}

function sc(){return SEQ[si]||null;}
function ns(){if(crTimer){clearInterval(crTimer);crTimer=null;}si++;run();}

function run(){
  var s=sc();if(!s){showFinal();return;}
  uw();
  var t=s.t;
  if(t==="story")rStory(s);
  else if(t==="meeting")rMeet(s);
  else if(t==="invest")rInvest(s);
  else if(t==="decide")rDecide(s);
  else if(t==="result")rResult(s);
  else if(t==="inbox")rInbox(s);
  else if(t==="intercept")rIntercept(s);
  else if(t==="crisis")rCrisis(s);
  else if(t==="report")rReport(s);
  else if(t==="deduce")rDeduce(s);
  else if(t==="end")rEnd(s);
}

/* STORY */
function rStory(s){
  show("S-story");stBeat=0;
  var bg=document.getElementById("story-bg");
  bg.style.background=s.bg==="night"
    ?"linear-gradient(180deg,#020306,#040608)"
    :"linear-gradient(180deg,#06090f,#080c14)";
  rBeat(s);
}
function rBeat(s){
  var b=s.beats[stBeat];if(!b){ns();return;}
  var na=document.getElementById("nar");
  var db=document.getElementById("dlg-box");
  var sp=document.getElementById("dlg-sp");
  var sn=document.getElementById("dlg-sn");
  var sr=document.getElementById("dlg-sr");
  var tx=document.getElementById("dlg-tx");
  var inn=document.getElementById("dlg-in");
  var nx=document.getElementById("dlg-nx");
  na.textContent="";tx.textContent="";inn.textContent="";
  inn.style.display="none";nx.style.display="none";
  if(b.n)tw(na,b.n,14);
  if(b.sp){
    var ch=CHARS[b.sp]||{n:b.sp,r:"",c:"#888"};
    db.style.display="block";sp.style.display="flex";
    sn.textContent=ch.n;sn.style.color=ch.c;sr.textContent=ch.r;
    if(b.tx)tw(tx,b.tx,18);
  }else{
    sp.style.display="none";
    if(b.tx){db.style.display="block";tw(tx,b.tx,14);}
    else db.style.display="none";
  }
  if(b.inn){inn.style.display="block";tw(inn,b.inn,16);}
  setTimeout(function(){nx.style.display="block";},500);
}
function storyTap(){
  if(tTimer){
    clearInterval(tTimer);tTimer=null;
    document.getElementById("dlg-nx").style.display="block";
    return;
  }
  var s=sc();if(!s||s.t!=="story")return;
  stBeat++;
  if(stBeat>=s.beats.length)ns();else rBeat(s);
}

/* MEETING */
function rMeet(s){
  show("S-meet");meetSc=s;
  var ch=CHARS[s.char]||{n:"?",r:"",c:"#888",av:"?"};
  document.getElementById("mt-av").textContent=ch.av;
  document.getElementById("mt-nm").textContent=ch.n;
  document.getElementById("mt-nm").style.color=ch.c;
  document.getElementById("mt-rl").textContent=ch.r;
  tw(document.getElementById("mt-dlg"),s.dlg,14);
  var ct=document.getElementById("mt-ch");ct.innerHTML="";
  s.choices.forEach(function(c,i){
    var btn=document.createElement("button");
    btn.className="choice-btn";btn.textContent=c.tx;
    btn.onclick=function(){meetChoose(i);};
    ct.appendChild(btn);
  });
}
function meetChoose(i){
  document.getElementById("mt-dlg").textContent=meetSc.choices[i].res;
  document.getElementById("mt-ch").innerHTML=
    "<div style='text-align:center;margin-top:14px'><button class='sm-btn' onclick='ns()'>次へ ▸</button></div>";
}

/* INVESTIGATE */
function rInvest(s){
  show("S-invest");
  document.getElementById("iv-desc").textContent=s.desc;
  invItems=s.items.map(function(it){return{f:false,d:it};});invFound=0;
  renderInvItems();
}
function renderInvItems(){
  var ct=document.getElementById("iv-items");ct.innerHTML="";
  invItems.forEach(function(it,i){
    var d=document.createElement("div");d.className="inv-item"+(it.f?" done":"");
    d.innerHTML="<span style='font-size:20px'>"+it.d.icon+"</span>"
      +"<span class='inv-label"+(it.f?" done":"")+"'>"+it.d.label+(it.f?" ✓":"")+"</span>";
    if(!it.f)d.onclick=function(){invTap(i);};
    ct.appendChild(d);
  });
  var pg=document.getElementById("iv-prog");
  pg.innerHTML=invFound+"/"+invItems.length+" 収集済み";
  if(invFound>=invItems.length)
    pg.innerHTML+=" &nbsp;<button class='sm-btn' onclick='ns()'>次へ ▸</button>";
}
function invTap(i){
  var it=invItems[i];if(it.f)return;
  it.f=true;invFound++;
  document.getElementById("cv-title").textContent=it.d.ct;
  document.getElementById("cv-body").textContent=it.d.cb;
  document.getElementById("clue-ov").style.display="flex";
}
function closeClue(){document.getElementById("clue-ov").style.display="none";renderInvItems();}

/* DECIDE */
function rDecide(s){
  show("S-decide");var c=CASES[s.ck];curCase=c;clueOpen=false;
  document.getElementById("dc-card").className="case-card"+(c.pri==="HIGH"?" high":"");
  var ci2=document.getElementById("dc-id");ci2.textContent=c.id;ci2.style.color=c.pc;
  var cp=document.getElementById("dc-pri");cp.textContent=c.pri;cp.style.color=c.pc;
  cp.style.background=c.pb;cp.style.border="1px solid "+c.pc+"44";
  document.getElementById("dc-time").textContent=c.time;
  document.getElementById("dc-title").textContent=c.title;
  document.getElementById("dc-title").style.color=c.pri==="HIGH"?"#9a3030":"#8a9aaa";
  document.getElementById("dc-meta").textContent="@"+c.sub+" · 拡散 "+c.eng;
  document.getElementById("dc-body").textContent=c.body;
  document.getElementById("dc-flag").textContent=c.flag;
  document.getElementById("dc-clue").textContent="▸ 詳細ログを確認する";
  document.getElementById("dc-clue").style.color="#0c1e2a";
  var dots=document.getElementById("dc-dots");dots.innerHTML="";
  decs.forEach(function(d){
    var dot=document.createElement("div");
    dot.style.cssText="width:5px;height:5px;border-radius:50%;background:"
      +(d.k==="A"?"#2ecc71":d.k==="R"?"#e74c3c":"#f0a030")+"88;display:inline-block;margin:0 2px";
    dots.appendChild(dot);
  });
  var row=document.getElementById("dc-btns");row.innerHTML="";
  [["A","ALLOW","#2ecc71"],["R","REMOVE","#e74c3c"],["E","ESCALATE","#f0a030"]].forEach(function(b){
    var btn=document.createElement("button");btn.className="judge-btn";btn.textContent=b[1];
    btn.style.color=b[2];btn.style.borderColor=b[2]+"55";btn.style.background=b[2]+"11";
    btn.onclick=function(){decide(b[0]);};
    row.appendChild(btn);
  });
  document.getElementById("dc-idx").textContent=(sc()&&sc().ch)||"";
  uw();
}
function toggleClue(){
  var e=document.getElementById("dc-clue");clueOpen=!clueOpen;
  e.textContent=clueOpen?"🔍 "+curCase.clue:"▸ 詳細ログを確認する";
  e.style.color=clueOpen?"#2a4a5a":"#0c1e2a";
}
function decide(k){
  var c=curCase;decs.push({id:c.id,k:k});
  world=Math.max(10,world-(k==="A"?11:k==="R"?6:3));
  window._ld={k:k,c:c};si++;run();
}

/* RESULT */
function rResult(){
  var d=window._ld;if(!d)return;
  show("S-result");uw();
  document.getElementById("rs-id").textContent=d.c.id+" — 判断済み";
  var rl=document.getElementById("rs-label");
  var col=d.k==="A"?"#2ecc71":d.k==="R"?"#e74c3c":"#f0a030";
  rl.textContent=d.c[d.k].l;
  rl.style.cssText="font-size:11px;padding:8px 14px;border-radius:6px;margin-bottom:18px;letter-spacing:.1em;font-weight:700;color:"+col+";background:"+col+"12;border:1px solid "+col+"44;display:block";
  document.getElementById("rs-text").textContent=d.c[d.k].r;
  document.getElementById("rs-clue").style.display="none";
  document.getElementById("rs-clue-btn").style.display="block";
  var ns2=SEQ[si];
  document.getElementById("rs-next").textContent=
    (ns2&&ns2.t==="report")?"報告書を書く ▸":
    (ns2&&ns2.t==="inbox")?"受信トレイ ▸":"次へ ▸";
}
function showResClue(){
  document.getElementById("rs-clue").textContent=curCase.clue;
  document.getElementById("rs-clue").style.display="block";
  document.getElementById("rs-clue-btn").style.display="none";
}
function afterResult(){ns();}

/* INTERCEPT */
function rIntercept(s){
  show("S-intercept");
  document.getElementById("ic-info").textContent=s.info;
  icMsgs=s.msgs;icIdx=0;
  document.getElementById("ic-chat").innerHTML="";

  }

function interceptNext(){var s=sc();renderIcMsg(s);}

/* CRISIS */
function rCrisis(s){
  show("S-crisis");
  document.getElementById("cr-info").textContent=s.info;
  crCases=s.cases.map(function(c){return{d:c,done:false};});
  crLeft=60;crOpen=-1;
  renderCrCards();
  if(crTimer)clearInterval(crTimer);
  crTimer=setInterval(function(){
    crLeft--;
    document.getElementById("cr-tf").style.width=(crLeft/60*100)+"%";
    document.getElementById("cr-time").textContent=crLeft;
    if(crLeft<=10)document.getElementById("cr-tf").style.background="#ff2020";
    if(crLeft<=0){
      clearInterval(crTimer);crTimer=null;
      crCases.forEach(function(c){if(!c.done){c.done=true;world=Math.max(10,world-8);}});
      uw();setTimeout(ns,1200);
    }
  },1000);
}
function renderCrCards(){
  var ct=document.getElementById("cr-cards");ct.innerHTML="";
  crCases.forEach(function(c,i){
    var d=document.createElement("div");d.className="cr-card"+(c.done?" done":"");
    d.innerHTML="<div style='font-size:8px;padding:2px 6px;border-radius:99px;font-weight:700;color:"+c.d.pc+";background:"+c.d.pc+"18;border:1px solid "+c.d.pc+"44'>"+c.d.id+"</div>"
      +"<div style='font-size:10px;color:#3a5060;flex:1;line-height:1.5'>"+c.d.title+"</div>"
      +(c.done?"<span style='color:#2a4050;font-size:9px'>✓</span>":"<span style='color:"+c.d.pc+";font-size:9px'>▸</span>");
    if(!c.done)d.onclick=function(){openCr(i);};
    ct.appendChild(d);
  });
}
function openCr(i){
  crOpen=i;
  document.getElementById("crj-title").textContent=crCases[i].d.title;
  document.getElementById("crj-body").textContent=crCases[i].d.body;
  document.getElementById("cr-ov").style.display="flex";
}
function crisisJudge(k){
  if(crOpen<0)return;
  crCases[crOpen].done=true;decs.push({id:crCases[crOpen].d.id,k:k});
  world=Math.max(10,world-(k==="A"?8:k==="R"?4:2));
  document.getElementById("cr-ov").style.display="none";
  renderCrCards();uw();
  if(crCases.every(function(c){return c.done;})){clearInterval(crTimer);crTimer=null;setTimeout(ns,600);}
}

/* REPORT */
function rReport(s){
  show("S-report");rpCk=s.ck;var c=CASES[s.ck];var d=window._ld;
  document.getElementById("rp-cid").textContent=c.id;
  document.getElementById("rp-ctitle").textContent=c.title;
  var col=d&&d.k==="A"?"#2ecc71":d&&d.k==="R"?"#e74c3c":"#f0a030";
  var label=d?{A:"ALLOW",R:"REMOVE",E:"ESCALATE"}[d.k]:"-";
  var de=document.getElementById("rp-dec");
  de.textContent=label;de.style.cssText="background:"+col+"18;border:1px solid "+col+"44;color:"+col+";padding:3px 10px;border-radius:2px;font-size:9px;font-weight:700;display:inline-block;margin-top:8px;";
  var ct=document.getElementById("rp-choices");ct.innerHTML="";
  ["ガイドラインのSection 4-Bに従ったため","当事者のプライバシーを優先したため","公益性が高いと判断したため","……正直、分からなかった。でも判断しなければならなかった"].forEach(function(r){
    var btn=document.createElement("button");btn.className="choice-btn";btn.textContent=r;
    btn.onclick=function(){rpChoose(r);};ct.appendChild(btn);
  });
  uw();
}
function rpChoose(r){
  document.getElementById("rp-choices").innerHTML=
    "<div style='font-size:11px;color:#4a6a8a;line-height:1.8;padding:8px 0'>理由："+r+"<br><br>報告書に記録しました。</div>"
    +"<div style='text-align:center;margin-top:12px'><button class='sm-btn' onclick='ns()'>次へ ▸</button></div>";
}

/* DEDUCE */
function rDeduce(s){
  show("S-deduce");
  document.getElementById("dd-prompt").textContent=s.prompt;
  document.getElementById("dd-hint").textContent=s.hint;
  ddClues=s.clues.map(function(c){return{d:c,sel:false,conn:false};});
  ddSel=[];ddConns=s.conns||[];
  document.getElementById("dd-res").style.display="none";
  renderDdClues();
}
function renderDdClues(){
  var ct=document.getElementById("dd-clues");ct.innerHTML="";
  ddClues.forEach(function(it,i){
    var d=document.createElement("div");
    d.className="dd-card"+(it.sel?" sel":"")+(it.conn?" conn":"");
    d.innerHTML="<div style='font-size:8px;color:#1a3040;letter-spacing:.12em;margin-bottom:5px'>"+it.d.tag+"</div>"
      +"<div style='font-size:11px;color:#3a5060;line-height:1.7'>"+it.d.tx+"</div>"
      +(it.sel?"<div style='position:absolute;top:8px;right:10px;font-size:8px;color:#2a6a8a;font-weight:700'>選択中</div>":"");
    if(!it.conn)d.onclick=function(){ddSel2(i);};
    ct.appendChild(d);
  });
}
function ddSel2(i){
  var it=ddClues[i];
  if(it.sel){it.sel=false;ddSel=ddSel.filter(function(x){return x!==i;});}
  else if(ddSel.length<2){it.sel=true;ddSel.push(i);}
  renderDdClues();
}
function deduceConnect(){
  if(ddSel.length!==2)return;
  var ids=[ddClues[ddSel[0]].d.id,ddClues[ddSel[1]].d.id].sort();
  var found=null;
  ddConns.forEach(function(c){if(c.ids.slice().sort().join()===ids.join())found=c;});
  var res=document.getElementById("dd-res");res.style.display="block";
  if(found){
    ddSel.forEach(function(i){ddClues[i].conn=true;ddClues[i].sel=false;});
    ddSel=[];renderDdClues();res.textContent=found.res;
    if(ddClues.every(function(c){return c.conn;})){
      document.getElementById("dd-foot").innerHTML="<button class='sm-btn' onclick='ns()'>次へ ▸</button>";
    }
  }else{
    ddSel.forEach(function(i){ddClues[i].sel=false;});ddSel=[];renderDdClues();
    res.textContent="この二つの繋がりは……まだ見えない。";
  }
}

/* END */
function rEnd(s){
  show("S-end");
  document.getElementById("end-title").textContent=s.title;
  var kc={"A":"#2ecc71","R":"#e74c3c","E":"#f0a030"};
  var kn={"A":"ALLOW","R":"REMOVE","E":"ESCALATE"};
  var dl=document.getElementById("end-decs");dl.innerHTML="";
  decs.forEach(function(d){
    var r=document.createElement("div");
    r.style.cssText="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #0a1420;font-size:8px";
    r.innerHTML="<span style='color:#1a2a30'>"+d.id+"</span><span style='color:"+(kc[d.k]||"#3a4a58")+"'>"+kn[d.k]+"</span>";
    dl.appendChild(r);
  });
  document.getElementById("end-msg").textContent=s.msg;
  var me=document.getElementById("end-myst");
  me.innerHTML="<div style='color:#1a3040;margin-bottom:4px'>——　未解決の謎　——</div>";
  s.myst.forEach(function(m){var d=document.createElement("div");d.textContent=m;me.appendChild(d);});
  if(s.next){
    var nb=document.createElement("div");nb.style.cssText="margin-top:16px;text-align:center";
    nb.innerHTML="<button class='sm-btn' onclick='ns()'>第2章を開始する ▸</button>";
    me.appendChild(nb);
  }
}
function showFinal(){
  show("S-end");
  document.getElementById("end-title").textContent="— 全章クリア —";
  document.getElementById("end-msg").textContent="第3章「亀裂」は開発中です。\nFEED — GC2026";
  document.getElementById("end-decs").innerHTML="";document.getElementById("end-myst").innerHTML="";
}

document.getElementById("start-btn").addEventListener("click", startGame);
document.getElementById("S-story").addEventListener("click", storyTap);
</script>
