<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>FEED</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Courier New',monospace}

/* ══ BACKGROUNDS ══════════════════════════════════ */

/* TITLE BG: 深夜のオフィス街 */
.bg-title{
  background:
    radial-gradient(ellipse at 20% 80%, rgba(10,40,80,0.8) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 20%, rgba(20,10,60,0.6) 0%, transparent 50%),
    linear-gradient(180deg, #020408 0%, #040810 40%, #06090f 100%);
  position:relative;overflow:hidden;
}
.bg-title::before{
  content:'';position:absolute;inset:0;
  background-image:
    radial-gradient(1px 1px at 15% 25%, rgba(100,180,255,0.4) 0%, transparent 100%),
    radial-gradient(1px 1px at 35% 15%, rgba(80,160,255,0.3) 0%, transparent 100%),
    radial-gradient(1px 1px at 55% 30%, rgba(120,200,255,0.35) 0%, transparent 100%),
    radial-gradient(1px 1px at 75% 10%, rgba(60,140,255,0.4) 0%, transparent 100%),
    radial-gradient(1px 1px at 90% 20%, rgba(100,180,255,0.3) 0%, transparent 100%),
    radial-gradient(2px 2px at 25% 45%, rgba(80,160,255,0.2) 0%, transparent 100%),
    radial-gradient(1px 1px at 65% 55%, rgba(60,140,255,0.25) 0%, transparent 100%);
}
/* City lights bottom */
.bg-title::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:40%;
  background:
    repeating-linear-gradient(90deg,
      transparent 0px, transparent 18px,
      rgba(20,60,120,0.15) 18px, rgba(20,60,120,0.15) 20px),
    linear-gradient(0deg, rgba(4,8,16,0.95) 0%, transparent 100%);
}
/* Building silhouettes */
.buildings{
  position:absolute;bottom:0;left:0;right:0;height:35%;
  background:
    /* buildings */
    linear-gradient(0deg,
      #020408 0%, #020408 30%,
      transparent 30%),
    repeating-linear-gradient(90deg,
      #020408 0px, #020408 40px,
      transparent 40px, transparent 60px,
      #020408 60px, #020408 70px,
      transparent 70px, transparent 100px,
      #020408 100px, #020408 130px,
      transparent 130px, transparent 160px);
}
/* Window grid on buildings */
.windows{
  position:absolute;bottom:0;left:0;right:0;height:25%;
  background-image:
    radial-gradient(1px 2px at 22% 60%, rgba(255,220,100,0.3) 0%, transparent 100%),
    radial-gradient(1px 2px at 28% 40%, rgba(255,220,100,0.25) 0%, transparent 100%),
    radial-gradient(1px 2px at 45% 50%, rgba(100,200,255,0.3) 0%, transparent 100%),
    radial-gradient(1px 2px at 52% 30%, rgba(255,220,100,0.2) 0%, transparent 100%),
    radial-gradient(1px 2px at 68% 45%, rgba(255,220,100,0.35) 0%, transparent 100%),
    radial-gradient(1px 2px at 75% 65%, rgba(100,200,255,0.25) 0%, transparent 100%),
    radial-gradient(1px 2px at 85% 35%, rgba(255,220,100,0.3) 0%, transparent 100%);
}

/* OFFICE BG: THE PLATFORM オフィス */
.bg-office{
  background:
    linear-gradient(180deg, #06090f 0%, #080c14 60%, #0a0e18 100%);
  position:relative;overflow:hidden;
}
/* Floor reflection */
.bg-office::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:30%;
  background:linear-gradient(0deg,
    rgba(10,20,40,0.8) 0%,
    rgba(6,10,20,0.4) 50%,
    transparent 100%);
}
/* Office ceiling lights */
.ceiling-lights{
  position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,
    transparent 0%, rgba(60,120,200,0.15) 20%,
    rgba(60,120,200,0.3) 40%, rgba(60,120,200,0.15) 60%,
    transparent 80%);
  box-shadow:0 0 40px rgba(40,100,200,0.1);
}
/* Monitor glow */
.monitor-glow{
  position:absolute;bottom:20%;left:50%;transform:translateX(-50%);
  width:60%;height:20%;
  background:radial-gradient(ellipse at 50% 100%,
    rgba(0,80,160,0.15) 0%, transparent 70%);
}
/* Desk line */
.desk-line{
  position:absolute;bottom:22%;left:0;right:0;height:2px;
  background:linear-gradient(90deg,
    transparent 0%, rgba(20,60,120,0.4) 20%,
    rgba(20,60,120,0.6) 50%, rgba(20,60,120,0.4) 80%,
    transparent 100%);
}
/* Side window */
.side-window{
  position:absolute;right:0;top:10%;width:20%;height:70%;
  background:linear-gradient(180deg,
    rgba(20,40,80,0.3) 0%,
    rgba(10,20,60,0.5) 50%,
    rgba(4,8,20,0.7) 100%);
  border-left:1px solid rgba(40,80,160,0.15);
}

/* NIGHT BG: 律のアパート */
.bg-night{
  background:linear-gradient(180deg, #020306 0%, #040608 60%, #060a0e 100%);
  position:relative;overflow:hidden;
}
.bg-night::before{
  content:'';position:absolute;top:10%;right:15%;width:40%;height:50%;
  background:
    linear-gradient(180deg, rgba(4,8,20,0.95) 0%, rgba(4,8,20,0.95) 100%);
  border:1px solid rgba(30,60,120,0.2);
  /* Window frame */
  box-shadow:
    inset 0 0 30px rgba(20,40,100,0.1),
    0 0 20px rgba(10,20,60,0.3);
}
/* City lights through window */
.city-through-window{
  position:absolute;top:15%;right:17%;width:36%;height:44%;
  background:
    radial-gradient(1px 1px at 20% 30%, rgba(255,200,80,0.4) 0%, transparent 100%),
    radial-gradient(1px 1px at 50% 20%, rgba(100,180,255,0.35) 0%, transparent 100%),
    radial-gradient(1px 1px at 75% 40%, rgba(255,200,80,0.3) 0%, transparent 100%),
    radial-gradient(1px 1px at 30% 60%, rgba(100,180,255,0.25) 0%, transparent 100%),
    radial-gradient(1px 1px at 60% 70%, rgba(255,200,80,0.35) 0%, transparent 100%),
    radial-gradient(1px 1px at 85% 55%, rgba(100,180,255,0.3) 0%, transparent 100%),
    linear-gradient(180deg, rgba(4,10,30,0.6) 0%, rgba(2,6,20,0.8) 100%);
}
/* Room desk lamp glow */
.lamp-glow{
  position:absolute;bottom:25%;left:10%;width:30%;height:15%;
  background:radial-gradient(ellipse at 50% 100%,
    rgba(255,200,80,0.08) 0%, transparent 70%);
}

/* MEETING BG: 会議室 */
.bg-meeting{
  background:linear-gradient(180deg, #070a10 0%, #090c14 100%);
  position:relative;overflow:hidden;
}
/* Meeting table reflection */
.meeting-table{
  position:absolute;bottom:0;left:10%;right:10%;height:30%;
  background:linear-gradient(0deg,
    rgba(10,20,50,0.6) 0%,
    rgba(6,12,30,0.3) 50%,
    transparent 100%);
  border-top:1px solid rgba(30,60,120,0.2);
}
/* Overhead light */
.overhead{
  position:absolute;top:0;left:30%;right:30%;height:2px;
  background:rgba(40,80,180,0.4);
  box-shadow:0 0 60px rgba(20,60,160,0.15), 0 0 120px rgba(10,30,80,0.08);
}

/* ══ SCAN LINE ══ */
@keyframes scan{0%{top:-5%}100%{top:105%}}
.scanline{
  position:fixed;left:0;width:100%;height:2px;
  background:rgba(255,255,255,0.025);
  animation:scan 6s linear infinite;pointer-events:none;z-index:999;
}

/* ══ GLITCH ══ */
@keyframes g1{0%,100%{clip-path:inset(0 0 96% 0);transform:translate(-2px)}50%{clip-path:inset(40% 0 50% 0);transform:translate(2px)}}
@keyframes g2{0%,100%{clip-path:inset(92% 0 0 0);transform:translate(2px)}50%{clip-path:inset(50% 0 40% 0);transform:translate(-2px)}}
.gw{position:relative;display:inline-block}
.gw::before,.gw::after{content:attr(data-t);position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.gw::before{color:#0ff;animation:g1 .15s infinite;opacity:.5}
.gw::after{color:#f0a;animation:g2 .15s infinite;opacity:.5}

/* ══ SCREENS ══ */
.screen{position:fixed;inset:0;display:none;flex-direction:column}
.screen.active{display:flex}

/* ══ TITLE SCREEN ══ */
#title-screen{align-items:center;justify-content:center;padding:32px}
.title-center{text-align:center;z-index:10;position:relative}
.title-logo{
  font-size:clamp(64px,18vw,120px);font-weight:900;
  letter-spacing:.2em;color:#0d2a3a;
  text-shadow:0 0 60px rgba(0,80,160,0.2);
  margin-bottom:16px;line-height:1;
}
.title-sub{font-size:11px;color:#0d2030;letter-spacing:.3em;margin-bottom:40px}
.title-tagline{font-size:clamp(11px,3vw,14px);color:#1a3a50;letter-spacing:.06em;line-height:2;margin-bottom:48px}
.title-btn{
  background:transparent;border:1px solid #1a4a60;
  color:#2a7a9a;padding:13px 36px;font-size:11px;
  letter-spacing:.25em;cursor:pointer;font-family:inherit;border-radius:2px;
  transition:all .3s;
}
.title-btn:hover{background:rgba(10,40,80,0.4);border-color:#2a7a9a;color:#4a9aaa}
.title-version{position:absolute;bottom:20px;right:20px;font-size:8px;color:#0a1a28;letter-spacing:.15em}
.title-gc{position:absolute;bottom:20px;left:20px;font-size:8px;color:#0a1a28;letter-spacing:.15em}

/* ══ STORY MODE ══ */
#story-screen{background:#040810;cursor:pointer}
.story-bg{position:absolute;inset:0}
.story-content{position:relative;z-index:10;display:flex;flex-direction:column;height:100%}

/* Character sprite area */
.sprite-area{
  flex:1;position:relative;
  display:flex;align-items:flex-end;justify-content:center;
}
.sprite-placeholder{
  width:55%;max-width:260px;
  background:linear-gradient(180deg,transparent 0%,rgba(4,8,16,0.4) 100%);
  align-self:stretch;display:flex;align-items:center;justify-content:center;
  font-size:10px;color:#0a1a28;letter-spacing:.1em;
}
/* Narrator text */
.narrator{
  padding:16px 20px;font-size:12px;color:#5a7080;
  line-height:2;letter-spacing:.04em;
  min-height:60px;
}

/* Dialog box */
.dialog-box{
  background:rgba(4,8,16,0.95);
  border-top:1px solid #0d1e2e;
  padding:0;
  flex-shrink:0;
}
.dialog-speaker{
  display:flex;align-items:center;gap:10px;
  padding:10px 16px 6px;border-bottom:1px solid #080e18;
}
.speaker-name{font-size:11px;font-weight:700;letter-spacing:.1em}
.speaker-role{font-size:8px;color:#1a2a38;letter-spacing:.1em;margin-left:auto}
.dialog-text{
  padding:10px 16px 14px;
  font-size:12px;color:#8aabb0;line-height:2;
  min-height:70px;white-space:pre-wrap;
}
.inner-thought{
  padding:8px 16px;background:rgba(10,30,60,0.4);
  border-left:2px solid #1a3a60;
  font-size:10px;color:#4a6a8a;line-height:1.9;
  font-style:italic;margin:0 16px 10px;border-radius:0 3px 3px 0;
  min-height:44px;
}
.dialog-next{
  display:flex;justify-content:center;align-items:center;padding:10px 16px 14px;
  font-size:10px;color:#1a4a60;letter-spacing:.2em;cursor:pointer;
  border-top:1px solid #08101a;
}

/* ══ CASE SCREEN ══ */
#case-screen{background:#040810;flex-direction:column}
.topbar{
  background:#04080e;border-bottom:1px solid #0c1824;
  padding:7px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0;z-index:10;
}
.tb-logo{font-size:11px;font-weight:900;letter-spacing:.35em;color:#0d2a3a}
.tb-world{flex:1;display:flex;align-items:center;gap:7px}
.tb-wlabel{font-size:8px;color:#1a2a38;white-space:nowrap}
.tb-wbg{flex:1;height:2px;background:#0a1420;border-radius:99px}
.tb-wfill{height:100%;border-radius:99px;transition:width 1.2s,background 1.2s}
.tb-wpct{font-size:8px;min-width:26px}
.tb-idx{font-size:8px;color:#1a2a38}

.case-scroll{flex:1;overflow-y:auto;padding-bottom:110px}
.case-card{
  margin:12px;border-radius:6px;overflow:hidden;
  background:#06090f;border:1px solid #0c1824;
}
.case-card.high{border-color:#2a0a08;box-shadow:0 0 20px rgba(180,0,0,0.05)}
.card-head{
  padding:8px 12px;border-bottom:1px solid #0c1824;
  background:#070b11;display:flex;align-items:center;gap:7px;flex-wrap:wrap;
}
.card-id{font-size:8px;letter-spacing:.08em}
.card-pri{font-size:7px;padding:2px 7px;border-radius:99px;font-weight:700;letter-spacing:.1em}
.card-time{margin-left:auto;font-size:8px;color:#0a1420}
.card-title{font-size:13px;font-weight:700;padding:10px 12px 5px;line-height:1.5}
.card-meta{padding:0 12px 9px;font-size:8px;color:#1a2a38}
.card-sep{height:1px;background:#0a1420;margin:0 12px 11px}
.card-body{
  margin:0 12px 11px;padding:11px;
  background:#040810;border:1px solid #0a1420;border-radius:2px;
  font-size:11px;line-height:1.95;color:#4a5a6a;white-space:pre-wrap;
}
.card-flag{
  margin:0 12px 11px;padding:11px;
  background:#050500;border:1px solid #1a1600;border-radius:2px;
  font-size:10px;color:#5a5020;line-height:1.8;white-space:pre-wrap;
}
.card-clue{
  margin:0 12px 12px;padding:7px 11px;
  background:#04080c;border:1px solid #0a1e30;border-radius:2px;
  font-size:8px;color:#0c1e2a;text-align:center;cursor:pointer;
}

.btn-bar{
  position:fixed;bottom:0;left:0;right:0;
  background:linear-gradient(transparent,#040810 30%);
  padding:16px 12px 12px;
}
.btn-row{display:flex;gap:6px;justify-content:center}
.judge-btn{
  flex:1;max-width:160px;padding:10px 4px;border-radius:4px;
  font-size:8px;letter-spacing:.14em;font-weight:700;
  cursor:pointer;font-family:inherit;border:1px solid;
  transition:all .2s;
}
.dots{display:flex;gap:4px;padding:4px 14px 6px;justify-content:center}
.dot{width:5px;height:5px;border-radius:50%}

/* ══ RESULT ══ */
#result-screen{background:#040810;align-items:center;justify-content:center;padding:18px}
.result-inner{max-width:440px;width:100%}
.result-id{font-size:8px;color:#1a3a50;letter-spacing:.15em;margin-bottom:10px}
.result-label{font-size:11px;padding:8px 14px;border-radius:6px;margin-bottom:18px;letter-spacing:.1em;font-weight:700}
.result-text{
  font-size:12px;line-height:2.2;padding:16px;
  background:#06090f;border:1px solid #0c1824;border-radius:6px;
  margin-bottom:18px;white-space:pre-wrap;color:#4a5a6a;
}
.result-clue{font-size:9px;color:#1a3040;text-align:center;margin-bottom:14px;font-style:italic;line-height:1.8;padding:0 8px;display:none}
.result-btns{display:flex;gap:10px;justify-content:center}
.result-btn{
  background:transparent;border:1px solid #1a2a38;color:#3a5060;
  padding:8px 20px;font-size:8px;letter-spacing:.12em;cursor:pointer;
  font-family:inherit;border-radius:2px;
}

/* ══ INBOX ══ */
#inbox-screen{background:#040810;padding:16px;align-items:center;justify-content:flex-start}
.inbox-inner{max-width:440px;width:100%;padding-top:8px}
.inbox-label{font-size:8px;color:#1a2a38;letter-spacing:.15em;margin-bottom:14px}
.msg-card{background:#06090f;border-radius:6px;overflow:hidden;margin-bottom:16px}
.msg-head{padding:12px 14px;background:#080c12}
.msg-from{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.msg-avatar{
  width:30px;height:30px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:900;flex-shrink:0;
}
.msg-name{font-size:11px;color:#c8dae0;font-weight:700}
.msg-addr{font-size:8px;color:#1a2a38}
.msg-subj{font-size:9px;color:#3a5060}
.msg-body{padding:13px;font-size:11px;line-height:2;color:#4a5a6a;white-space:pre-wrap}
.msg-next{
  background:transparent;border:1px solid #1a2a38;color:#3a5060;
  padding:9px 24px;font-size:8px;letter-spacing:.15em;cursor:pointer;
  font-family:inherit;border-radius:2px;margin:0 auto;display:block;
}

/* ══ END ══ */
#end-screen{background:#040810;padding:24px;align-items:center;justify-content:center}
.end-inner{max-width:420px;width:100%}
.end-title{font-size:8px;color:#1a3a50;letter-spacing:.2em;margin-bottom:22px;text-align:center}
.dec-list{margin-bottom:18px}
.dec-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #0a1420;font-size:8px}
.end-msg{padding:16px;background:#06090f;border:1px solid #0c1824;border-radius:6px;margin-bottom:18px}
.end-msg-text{font-size:11px;line-height:2.2;color:#3a5060;margin-bottom:12px}
.end-msg-bold{font-size:12px;color:#8aabb0;font-weight:700;line-height:1.8}
.end-mysteries{font-size:9px;color:#0d1e2a;text-align:center;line-height:2.5;border-top:1px solid #0a1420;padding-top:16px}
.end-restart{
  background:transparent;border:1px solid #1a2a38;color:#3a5060;
  padding:8px 20px;font-size:8px;letter-spacing:.15em;cursor:pointer;
  font-family:inherit;border-radius:2px;margin:20px auto 0;display:block;
}
</style>
</head>
<body>
<div class="scanline"></div>

<!-- ══ TITLE ══════════════════════════════════════════ -->
<div class="screen active bg-title" id="title-screen">
  <div class="buildings"></div>
  <div class="windows"></div>
  <div class="title-center">
    <div class="gw title-logo" data-t="FEED">FEED</div>
    <div class="title-sub">THE PLATFORM</div>
    <div class="title-tagline">
      あなたの仕事は、<br>世界が見るものを決めることだ。
    </div>
    <button class="title-btn" onclick="startStory()">勤務を開始する</button>
  </div>
  <div class="title-gc">GC2026</div>
  <div class="title-version">FEED v1.0 — Ch.1</div>
</div>

<!-- ══ STORY ══════════════════════════════════════════ -->
<div class="screen" id="story-screen" onclick="nextBeat()">
  <div class="story-bg" id="story-bg"></div>
  <div class="story-content">
    <div class="sprite-area">
      <div id="sprite-area" style="width:100%;height:100%"></div>
    </div>
    <div class="narrator" id="narrator"></div>
    <div class="dialog-box">
      <div class="dialog-speaker" id="speaker-row" style="display:none">
        <span class="speaker-name" id="speaker-name"></span>
        <span class="speaker-role" id="speaker-role"></span>
      </div>
      <div class="dialog-text" id="dialog-text"></div>
      <div class="inner-thought" id="inner-thought" style="display:none"></div>
      <div class="dialog-next" id="dialog-next">▸ 画面をタップして続ける</div>
    </div>
  </div>
</div>

<!-- ══ CASE ════════════════════════════════════════════ -->
<div class="screen" id="case-screen">
  <div class="topbar">
    <span class="tb-logo">FEED</span>
    <div class="tb-world">
      <span class="tb-wlabel">WORLD</span>
      <div class="tb-wbg"><div class="tb-wfill" id="wfill" style="width:82%;background:#2ecc71"></div></div>
      <span class="tb-wpct" id="wpct" style="color:#2ecc71">82%</span>
    </div>
    <span class="tb-idx" id="case-idx">1/5</span>
  </div>
  <div class="case-scroll" id="case-scroll">
    <div class="case-card" id="case-card">
      <div class="card-head">
        <span class="card-id" id="c-id"></span>
        <span class="card-pri" id="c-pri"></span>
        <span class="card-time" id="c-time"></span>
      </div>
      <div class="card-title" id="c-title"></div>
      <div class="card-meta" id="c-meta"></div>
      <div class="card-sep"></div>
      <div class="card-body" id="c-body"></div>
      <div class="card-flag" id="c-flag"></div>
      <div class="card-clue" id="c-clue" onclick="toggleClue()">▸ 詳細ログを確認する</div>
    </div>
    <div class="dots" id="dots"></div>
  </div>
  <div class="btn-bar">
    <div class="btn-row" id="btn-row"></div>
  </div>
</div>

<!-- ══ RESULT ══════════════════════════════════════════ -->
<div class="screen" id="result-screen">
  <div class="result-inner">
    <div class="result-id" id="r-id"></div>
    <div class="result-label" id="r-label"></div>
    <div class="result-text" id="r-text"></div>
    <div class="result-clue" id="r-clue"></div>
    <div class="result-btns">
      <button class="result-btn" id="r-clue-btn" onclick="showRClue()">詳細ログ</button>
      <button class="result-btn" id="r-next-btn" onclick="afterResult()">次へ ▸</button>
    </div>
  </div>
</div>

<!-- ══ INBOX ══════════════════════════════════════════ -->
<div class="screen" id="inbox-screen">
  <div class="inbox-inner">
    <div class="inbox-label" id="inbox-label">INBOX</div>
    <div class="msg-card">
      <div class="msg-head">
        <div class="msg-from">
          <div class="msg-avatar" id="m-avatar"></div>

/* ══ STATE ══════════════════════════════════════════ */
var beatIdx=0, caseIdx=0, world=82, decisions=[], msgIdx=0, curMsgs=[], clueOpen=false, chosen=null, typeTimer=null;

/* ══ UTILS ══════════════════════════════════════════ */
function show(id){document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active')});document.getElementById(id).classList.add('active');}
function wColor(){return world>60?'#2ecc71':world>35?'#f0a030':'#e74c3c';}
function updateWorld(){var c=wColor();document.getElementById('wfill').style.width=world+'%';document.getElementById('wfill').style.background=c;document.getElementById('wpct').textContent=world+'%';document.getElementById('wpct').style.color=c;}
function setBg(id,cls){var el=document.getElementById(id);el.className='';el.className='bg-'+cls;if(cls==='office'){el.innerHTML='<div class="ceiling-lights"></div><div class="monitor-glow"></div><div class="desk-line"></div><div class="side-window"></div>';}else if(cls==='night'){el.innerHTML='<div class="city-through-window"></div><div class="lamp-glow"></div>';}else if(cls==='meeting'){el.innerHTML='<div class="overhead"></div><div class="meeting-table"></div>';}}

function typewrite(el, text, spd, cb){
  if(typeTimer){clearInterval(typeTimer);}
  el.textContent='';var i=0;
  typeTimer=setInterval(function(){
    el.textContent+=text[i++];
    if(i>=text.length){clearInterval(typeTimer);typeTimer=null;if(cb)cb();}
  },spd);
}

/* ══ STORY MODE ══════════════════════════════════════ */
function startStory(){show('story-screen');beatIdx=0;renderBeat();}

function renderBeat(){
  var b=STORY_BEATS[beatIdx];
  setBg('story-bg',b.bg||'office');
  var narEl=document.getElementById('narrator');
  var spRow=document.getElementById('speaker-row');
  var spName=document.getElementById('speaker-name');
  var spRole=document.getElementById('speaker-role');
  var dlText=document.getElementById('dialog-text');
  var inner=document.getElementById('inner-thought');

  narEl.textContent='';inner.style.display='none';dlText.textContent='';

  if(b.narrator){
    typewrite(narEl,b.narrator,20);
  }
  if(b.speaker){
    spRow.style.display='flex';
    spName.textContent=b.speaker.name;
    spName.style.color=b.speaker.color;
    spRole.textContent=b.speaker.role;
  } else {
    spRow.style.display='none';
  }
  if(b.text){
    typewrite(dlText,b.text,25);
  }
  if(b.inner){
    inner.style.display='block';
    typewrite(inner,b.inner,18);
  }
}

function nextBeat(){
  beatIdx++;
  if(beatIdx>=STORY_BEATS.length){startCase();}
  else{renderBeat();}
}

/* ══ CASE MODE ═══════════════════════════════════════ */
function startCase(){show('case-screen');caseIdx=0;clueOpen=false;renderCase();}

function renderCase(){
  var c=CASES[caseIdx];
  updateWorld();
  document.getElementById('case-idx').textContent=(caseIdx+1)+'/'+CASES.length;
  var card=document.getElementById('case-card');
  card.className='case-card'+(c.pri==='HIGH'?' high':'');
  document.getElementById('c-id').textContent=c.id;
  document.getElementById('c-id').style.color=c.priC;
  var pri=document.getElementById('c-pri');
  pri.textContent=c.pri;pri.style.color=c.priC;pri.style.background=c.priBg;pri.style.border='1px solid '+c.priC+'44';
  document.getElementById('c-time').textContent=c.time;
  document.getElementById('c-title').textContent=c.title;
  document.getElementById('c-title').style.color=c.pri==='HIGH'?'#9a3030':'#8a9aaa';
  document.getElementById('c-meta').textContent='@'+c.sub+' · 拡散 '+c.eng;
  var bodyEl=document.getElementById('c-body');
  bodyEl.textContent='';typewrite(bodyEl,c.body,10);
  document.getElementById('c-flag').textContent=c.flag;
  clueOpen=false;
  document.getElementById('c-clue').textContent='▸ 詳細ログを確認する';
  document.getElementById('c-clue').style.color='#0c1e2a';
  var row=document.getElementById('btn-row');
  row.innerHTML='';
  [['A','ALLOW','#2ecc71'],['R','REMOVE','#e74c3c'],['E','ESCALATE','#f0a030']].forEach(function(b){
    var btn=document.createElement('button');
    btn.className='judge-btn';btn.textContent=b[1];
    btn.style.cssText='color:'+b[2]+';border-color:'+b[2]+'55;background:'+b[2]+'11;';
    btn.onclick=function(){decide(b[0]);};
    row.appendChild(btn);
  });
  var dots=document.getElementById('dots');dots.innerHTML='';
  decisions.forEach(function(d){
    var dot=document.createElement('div');dot.className='dot';
    dot.style.background=(d.k==='A'?'#2ecc71':d.k==='R'?'#e74c3c':'#f0a030')+'88';
    dots.appendChild(dot);
  });
  document.getElementById('case-scroll').scrollTop=0;
}

function toggleClue(){
  var c=CASES[caseIdx];var el=document.getElementById('c-clue');
  clueOpen=!clueOpen;
  if(clueOpen){el.textContent='🔍 '+c.clue;el.style.color='#2a4a5a';}
  else{el.textContent='▸ 詳細ログを確認する';el.style.color='#0c1e2a';}
}

function decide(k){
  var c=CASES[caseIdx];chosen=k;
  decisions.push({id:c.id,k:k});
  world=Math.max(10,world-(k==='A'?11:k==='R'?6:3));
  var out=c[k];
  document.getElementById('r-id').textContent=c.id+' — 判断済み';
  var rl=document.getElementById('r-label');
  var col=k==='A'?'#2ecc71':k==='R'?'#e74c3c':'#f0a030';
  rl.textContent=out.l;rl.style.cssText='color:'+col+';background:'+col+'12;border:1px solid '+col+'44;';
  document.getElementById('r-text').textContent=out.r;
  document.getElementById('r-clue').style.display='none';
  document.getElementById('r-clue-btn').style.display='block';
  var msgs=MSGS[caseIdx]||[];
  document.getElementById('r-next-btn').textContent=msgs.length>0?'受信トレイ ('+msgs.length+') ▸':(caseIdx>=CASES.length-1?'最終章へ ▸':'次のケース ▸');
  show('result-screen');updateWorld();
}

function showRClue(){
  document.getElementById('r-clue').textContent=CASES[caseIdx].clue;
  document.getElementById('r-clue').style.display='block';
  document.getElementById('r-clue-btn').style.display='none';
}

function afterResult(){
  var msgs=MSGS[caseIdx]||[];
  if(msgs.length>0){curMsgs=msgs;msgIdx=0;renderMsg();}
  else{nextCase();}
}

function renderMsg(){
  var m=curMsgs[msgIdx];
  document.getElementById('inbox-label').textContent='INBOX — '+(msgIdx+1)+'/'+curMsgs.length;
  var av=document.getElementById('m-avatar');
  av.textContent=m.i;av.style.cssText='background:'+m.c+'22;border:1px solid '+m.c+'44;color:'+m.c+';width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;';
  document.getElementById('m-name').textContent=m.n;document.getElementById('m-name').style.color='#c8dae0';
  document.getElementById('m-addr').textContent=m.c+'@the-platform';
  document.getElementById('m-subj').textContent='件名：'+m.s;
  document.getElementById('m-body').textContent=m.b;
  document.getElementById('msg-next').textContent=msgIdx<curMsgs.length-1?'次のメッセージ ▸':'次のケースへ ▸';
  show('inbox-screen');
}

function nextMsg(){if(msgIdx<curMsgs.length-1){msgIdx++;renderMsg();}else{nextCase();}}

function nextCase(){
  clueOpen=false;chosen=null;
  if(caseIdx>=CASES.length-1){showEnd();}
  else{caseIdx++;renderCase();show('case-screen');}
}

function showEnd(){
  var dl=document.getElementById('dec-list');dl.innerHTML='';
  var kc={A:'#2ecc71',R:'#e74c3c',E:'#f0a030'};var kn={A:'ALLOW',R:'REMOVE',E:'ESCALATE'};
  decisions.forEach(function(d){
    var row=document.createElement('div');row.className='dec-row';
    row.innerHTML='<span style="color:#1a2a30">'+d.id+'</span><span style="color:'+kc[d.k]+'">'+kn[d.k]+'</span>';
    dl.appendChild(row);
  });
  show('end-screen');
}

function restart(){
  beatIdx=0;caseIdx=0;world=82;decisions=[];msgIdx=0;curMsgs=[];clueOpen=false;chosen=null;
  if(typeTimer){clearInterval(typeTimer);typeTimer=null;}
  show('title-screen');
}
</script>
