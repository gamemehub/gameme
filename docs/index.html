<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Steam Wishlist Ranking | GameMeHub</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --accent: #1b9cfc;
      --accent2: #4ecdc4;
      --gold: #ffd700;
      --silver: #c0c0c0;
      --bronze: #cd7f32;
      --text: #e8eaf0;
      --muted: #7a8099;
      --up: #4ade80;
      --down: #f87171;
      --new: #facc15;
      --border: rgba(255,255,255,0.07);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
    }

    /* Header */
    header {
      background: linear-gradient(135deg, #0f1117 0%, #1a1d27 100%);
      border-bottom: 1px solid var(--border);
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--accent);
    }
    .logo span { color: var(--text); }
    .updated {
      font-size: 0.78rem;
      color: var(--muted);
    }

    /* Hero */
    .hero {
      background: linear-gradient(180deg, #1a1d27 0%, #0f1117 100%);
      padding: 40px 24px 32px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }
    .hero h1 {
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 800;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .hero p { color: var(--muted); font-size: 0.9rem; }

    /* Controls */
    .controls {
      max-width: 900px;
      margin: 24px auto;
      padding: 0 16px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .search-box {
      flex: 1;
      min-width: 200px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-box:focus { border-color: var(--accent); }
    .filter-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 16px;
      color: var(--muted);
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* Ranking list */
    .ranking {
      max-width: 900px;
      margin: 0 auto 60px;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      display: grid;
      grid-template-columns: 52px 1fr auto;
      gap: 12px;
      align-items: center;
      transition: transform 0.15s, border-color 0.15s;
      text-decoration: none;
      color: inherit;
    }
    .card:hover {
      transform: translateX(4px);
      border-color: var(--accent);
    }
    .card.rank-1 { border-left: 3px solid var(--gold); }
    .card.rank-2 { border-left: 3px solid var(--silver); }
    .card.rank-3 { border-left: 3px solid var(--bronze); }

    .rank-badge {
      text-align: center;
      font-size: 1.4rem;
      font-weight: 900;
      color: var(--muted);
      line-height: 1;
    }
    .rank-1 .rank-badge { color: var(--gold); }
    .rank-2 .rank-badge { color: var(--silver); }
    .rank-3 .rank-badge { color: var(--bronze); }

    .game-info { min-width: 0; }
    .game-name {
      font-weight: 600;
      font-size: 1rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }
    .game-meta {
      font-size: 0.78rem;
      color: var(--muted);
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .game-right { text-align: right; }
    .price {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--accent2);
      margin-bottom: 4px;
    }
    .badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 99px;
    }
    .badge-new { background: rgba(250,204,21,0.15); color: var(--new); }
    .badge-up  { background: rgba(74,222,128,0.15); color: var(--up); }
    .badge-down{ background: rgba(248,113,113,0.15); color: var(--down); }

    /* Loading / Error */
    .state-msg {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      font-size: 1rem;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 0.75rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>

<header>
  <div class="logo">🎮 <span>GameMeHub</span></div>
  <div class="updated" id="updated-at">読み込み中...</div>
</header>

<div class="hero">
  <h1>Steam Wishlist Ranking</h1>
  <p>Steamのウィッシュリスト登録数ランキング・毎日自動更新</p>
</div>

<div class="controls">
  <input class="search-box" type="text" placeholder="🔍 ゲームを検索..." id="search" />
  <button class="filter-btn active" data-filter="all">すべて</button>
  <button class="filter-btn" data-filter="new">🆕 新着</button>
  <button class="filter-btn" data-filter="up">📈 上昇</button>
  <button class="filter-btn" data-filter="unreleased">🗓 未発売</button>
</div>

<div class="ranking" id="ranking">
  <div class="state-msg">
    <div class="spinner"></div>
    データを読み込み中...
  </div>
</div>

<footer>
  データはSteamストアから自動取得 · GameMeHub © 2026
</footer>

<script>
  const DATA_URL = "./data/rankings.json";
  let allEntries = [];
  let currentFilter = "all";

  async function loadData() {
    try {
      const res = await fetch(DATA_URL);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      allEntries = data.entries || [];

      const dt = new Date(data.updated_at);
      document.getElementById("updated-at").textContent =
        "更新: " + dt.toLocaleString("ja-JP", { timeZone: "Asia/Tokyo" });

      render();
    } catch (e) {
      document.getElementById("ranking").innerHTML =
        `<div class="state-msg">⚠️ データの読み込みに失敗しました<br><small>${e.message}</small></div>`;
    }
  }

  function getDiff(entry) {
    if (entry.is_new) return { label: "NEW", cls: "badge-new" };
    if (entry.prev_rank == null) return null;
    const d = entry.prev_rank - entry.rank;
    if (d >= 1)  return { label: `↑${d}`, cls: "badge-up" };
    if (d <= -1) return { label: `↓${Math.abs(d)}`, cls: "badge-down" };
    return null;
  }

  function render() {
    const query = document.getElementById("search").value.toLowerCase();
    const filter = currentFilter;

    let entries = allEntries.filter(e => {
      if (query && !e.name.toLowerCase().includes(query)) return false;
      if (filter === "new") return e.is_new;
      if (filter === "up")  return e.prev_rank && (e.prev_rank - e.rank) >= 1;
      if (filter === "unreleased") return !e.release_date || e.release_date.includes("予定") || e.price === "未発表";
      return true;
    });

    if (entries.length === 0) {
      document.getElementById("ranking").innerHTML =
        `<div class="state-msg">該当するゲームが見つかりませんでした</div>`;
      return;
    }

    const html = entries.map(e => {
      const diff = getDiff(e);
      const rankClass = e.rank <= 3 ? `rank-${e.rank}` : "";
      const medal = e.rank === 1 ? "🥇" : e.rank === 2 ? "🥈" : e.rank === 3 ? "🥉" : e.rank;
      const badge = diff
        ? `<span class="badge ${diff.cls}">${diff.label}</span>`
        : "";

      return `
        <a class="card ${rankClass}" href="${e.url || '#'}" target="_blank" rel="noopener">
          <div class="rank-badge">${medal}</div>
          <div class="game-info">
            <div class="game-name">${e.name}</div>
            <div class="game-meta">
              <span>📅 ${e.release_date || "未定"}</span>
              ${e.review_summary ? `<span>⭐ ${e.review_summary}</span>` : ""}
            </div>
          </div>
          <div class="game-right">
            <div class="price">${e.price || "未発表"}</div>
            ${badge}
          </div>
        </a>`;
    }).join("");

    document.getElementById("ranking").innerHTML = html;
  }

  // イベント
  document.getElementById("search").addEventListener("input", render);
  document.querySelectorAll(".filter-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentFilter = btn.dataset.filter;
      render();
    });
  });

  loadData();
</script>
</body>
</html>
